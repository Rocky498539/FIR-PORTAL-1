      <div><div class="progress-name">${t(s.label)}<span class="sr-only">, ${done ? t('completed') : isNext ? t('next step') : t('not started')}</span></div><div class="progress-detail">${stepDetail(c, s.id)}</div></div>

  }).join('')}</ol>`;
}

/* ================= 2. SELECT BNS SECTION ================= */
/* Automatically identify BNS sections as soon as the crime category/sub-category are known,
   so the officer lands on a pre-filled list instead of an empty one. Re-triggers if the
   classification changes while the list is still empty. Still fully editable afterwards. */
function maybeAutoIdentifyBns(c){
  const key = (c.complaint.crimeCategory||"") + "|" + (c.complaint.crimeSubCategory||"");
  if(c.bns.sections.length===0 && c.complaint.crimeCategory && c.complaint.crimeSubCategory && (c.bns.autoIdentifyFor||"") !== key){
    c.bns.autoIdentifyFor = key;
    saveDB();
    setTimeout(()=>identifyBnsSections(c.id), 30);
  }
}
/* Identify likely BNS sections from the case facts, acting as an experienced IO.
   Runs entirely locally (deterministic keyword/tag matching), no network call, so it
   works reliably regardless of the hosting environment's network restrictions. These are
   added to the selected list unconfirmed, the officer reviews, removes anything that
   doesn't fit, and must explicitly confirm before the FIR can be registered. */
function identifyBnsSections(caseId){
  const c = getCase(caseId);
  if(!c.complaint.crimeCategory || !c.complaint.crimeSubCategory){
    toast("Set the crime category and sub-category on the Complaint tab first.");
    return;
  }
  const btn = document.getElementById('bns-identify-btn');
  if(btn){ btn.disabled = true; btn.innerHTML = `${ic('hourglass_top')}<span>Identifying applicable sections…</span>`; }
  const matches = localIdentifyBnsSections(c);
  let added = 0;
  matches.forEach(item=>{
    if(!c.bns.sections.some(s=>s.code===item.code)){
      c.bns.sections.push(Object.assign({}, item, { suggested:true }));
      added++;
    }
  });
  if(added>0) c.bns.confirmed = false;
  saveDB();
  render();
  toast(added>0
    ? `Added ${added} section(s) applicable to ${c.complaint.crimeSubCategory}. Review and remove any that don't apply, then confirm.`
    : "No new sections to add. Everything matching this crime type is already selected.");
}
function bnsSaveContinue(caseId){
  const c = getCase(caseId);
  if(c.bns.sections.length===0){ toast("Select at least one BNS section before continuing."); return; }
  const wasConfirmed = c.bns.confirmed;
  c.bns.confirmed = true;
  // If the FIR was already prepared, redraft its "action taken" text, unless the officer rewrote it
  if(c.fir.registered && /^The information received discloses the commission of a cognizable offence under /.test(c.fir.narrative||'')){
    c.fir.narrative = buildFirNarrative(c);
  }
  saveDB();
  if(!wasConfirmed) toast(`${c.bns.sections.length} BNS section${c.bns.sections.length>1?'s':''} confirmed.`);
  saveAndContinue(caseId,'bns');
}
/* ---- Add more sections: search the list first; add an unlisted section only if it isn't there ----
   The search query and the manual draft live in UI state, so adding a result or speaking into the
   title field doesn't wipe what the officer typed when the tab re-renders. */
function bnsAddState(c){
  if(!UI.bnsAdd || UI.bnsAdd.caseId !== c.id) UI.bnsAdd = { caseId:c.id, open:false, query:"", manualOpen:false, code:"", title:"", error:"" };
  return UI.bnsAdd;
}
const BNS_RESULTS_LIMIT = 8;
/* "BNS 304", but "IT Act 66D", IT Act sections are not BNS sections. */
function sectionLabel(code){ return /^it act/i.test(code) ? code : `BNS ${code}`; }
function normaliseSectionCode(raw){ return String(raw||"").replace(/^\s*(bns|section|sec\.?)\s*/i,"").replace(/\s+/g,"").trim(); }
function renderBnsAddCard(c){
  const st = bnsAddState(c);
  return `
    <div>
      <div class="actions actions--between actions--flush" style="margin-bottom:var(--axial-space-12);">
        <div class="label-def">${t('Add another section')}</div>
        <button type="button" class="axial-btn axial-btn--ghost axial-btn--sm" onclick="toggleBnsAdd('${c.id}', false)">${t('Close')}</button>
      </div>
      <div class="search-field">
        ${ic('search')}
        <input class="axial-input" id="bns-search" type="text" autocomplete="off" aria-label="${t('Search BNS sections')}"
          placeholder="${t('Search by section number, title or keyword')}" value="${esc(st.query)}" oninput="onBnsSearch('${c.id}', this.value)">
        <button type="button" class="icon-btn search-clear" id="bns-search-clear" aria-label="${t('Clear search')}" title="${t('Clear search')}"
          ${st.query ? '' : 'hidden'} onclick="onBnsSearch('${c.id}', ''); document.getElementById('bns-search').value=''; document.getElementById('bns-search').focus();">${ic('close')}</button>
      </div>
      <div id="bns-results" class="bns-results" aria-live="polite">${bnsResultsBody(c, st.query)}</div>
      <div class="bns-manual">
        ${st.manualOpen ? bnsManualForm(c, st) : `
          <div class="bns-manual-prompt">
            <span class="body-def">${t('Section not in the list?')}</span>
            <button type="button" class="axial-btn axial-btn--ghost axial-btn--sm" onclick="toggleBnsManual('${c.id}', true)">${ic('edit_note')}<span>${t('Add it manually')}</span></button>
          </div>`}
      </div>
    </div>`;
}
function bnsManualForm(c, st){
  const match = BNS_LIBRARY.find(s=>s.code.toLowerCase() === normaliseSectionCode(st.code).toLowerCase());
  const canAdd = normaliseSectionCode(st.code) && st.title.trim() && !st.error;
  return `
    <form class="bns-manual-form" novalidate onsubmit="return addCustomBnsSection(event, '${c.id}')">
      <div class="label-def">${t('Add a section manually')}</div>
      <div class="bns-manual-grid">
        <div class="field${st.error?' field-error':''}">
          <label for="bns-custom-code">${t('Section number')}</label>
          <input class="axial-input" id="bns-custom-code" autocomplete="off" placeholder="e.g. 351(2)" value="${esc(st.code)}"
            aria-describedby="bns-custom-msg"${st.error?' aria-invalid="true"':''} oninput="onBnsManualInput('${c.id}','code',this.value)">
        </div>
        <div class="field">
          <label for="bns-custom-title">${t('Title')}</label>
          <div class="field-adorned">
            <input class="axial-input" id="bns-custom-title" autocomplete="off" placeholder="e.g. Criminal intimidation" value="${esc(st.title)}"
              oninput="onBnsManualInput('${c.id}','title',this.value)">
            ${micIconButton('bns-custom-title')}
          </div>
        </div>
      </div>
      <div id="bns-custom-msg" class="bns-manual-msg" aria-live="polite">${bnsManualMessage(st, match)}</div>
      <div class="actions actions--flush">
        <button type="button" class="axial-btn axial-btn--outline axial-btn--md" onclick="toggleBnsManual('${c.id}', false)">${t('Cancel')}</button>
        <button type="button" data-submit id="bns-custom-add" onclick="submitFormFrom(this)" class="axial-btn axial-btn--primary axial-btn--md"${canAdd?'':' disabled'}>${ic('add')}<span>${t('Add section')}</span></button>
      </div>
    </form>`;
}
function bnsManualMessage(st, match){
  if(st.error) return `<span class="field-message">${ic('error')}<span>${esc(st.error)}</span></span>`;
  if(match) return `<span class="caption">${ic('info')}<span>${t('This section is in the list:')} ${esc(match.title)}.</span></span>`;
  return '';
}
function bnsResultsBody(c, query){
  const q = (query||"").trim().toLowerCase();
  if(!q) return '';
  const all = BNS_LIBRARY.filter(s=> s.code.toLowerCase().includes(q) || s.title.toLowerCase().includes(q) || s.desc.toLowerCase().includes(q));
  if(all.length===0) return `<div class="bns-results-note">${t('No matching sections.')}</div>`;
  const shown = all.slice(0, BNS_RESULTS_LIMIT);
  return bnsResultsHtml(c, shown, q) + (all.length > shown.length
    ? `<div class="bns-results-note">${t('Showing')} ${shown.length} ${t('of')} ${all.length}. ${t('Keep typing to narrow the list.')}</div>` : '');
}
function bnsResultsHtml(c, list, query){
  const selectedCodes = c.bns.sections.map(s=>s.code);
  return list.map(s=>{
    const already = selectedCodes.includes(s.code);
    return `<div class="check-item">
      <div>
        <div class="label-def">${esc(sectionLabel(s.code))}: ${esc(s.title)}</div>
        <div class="caption">${esc(s.desc)}</div>
      </div>
      <button type="button" class="axial-btn ${already?'axial-btn--ghost':'axial-btn--outline'} axial-btn--sm" ${already?'disabled':''} onclick="addBnsSection('${c.id}','${esc(s.code)}')">${already?ic('check')+'<span>'+t('Added')+'</span>':ic('add')+'<span>'+t('Add')+'</span>'}</button>
    </div>`;
  }).join("");
}
function onBnsSearch(caseId, value){
  const c = getCase(caseId); const st = bnsAddState(c);
  st.query = value;
  const res = document.getElementById('bns-results'); if(res){ res.innerHTML = bnsResultsBody(c, value); applyTranslations(res); }
  const clr = document.getElementById('bns-search-clear'); if(clr) clr.hidden = !value;
}
function renderBnsResults(caseId){ const el = document.getElementById('bns-search'); onBnsSearch(caseId, el ? el.value : ''); }

        <div class="sec-title"><span>${esc(s.title)}</span>${s.suggested ? `<span class="tag-suggested">${t('Suggested')}</span>` : ''}${s.custom ? `<span class="tag-suggested">${t('Added manually')}</span>` : ''}</div>

    </div>
  </div>
  <div class="stack-16">
    ${banner('info', `<span>${t('Suggested sections are based on the selected crime type. Review them against the BNS before confirming.')}</span>`)}
    <section class="section-card">
      <div class="section-card-head">
        <div style="display:flex; align-items:center; gap:var(--axial-space-12);"><h2 class="section-card-title">${t('Selected sections')}</h2><span class="pill pill--neutral">${n} ${t('selected')}</span></div>
        <button type="button" id="bns-identify-btn" class="axial-btn axial-btn--outline axial-btn--sm" onclick="identifyBnsSections('${c.id}')" ${hasClass?'':'disabled'}>${ic('refresh')}<span>${t(n ? 'Suggest again' : 'Suggest sections')}</span></button>
      </div>
      ${n ? `<ul class="sec-list">${rows}</ul>` : `<div class="sec-empty">${emptyMsg}</div>`}
      ${st.open
        ? `<div class="add-panel">${renderBnsAddCard(c)}</div>`

function toggleBnsAdd(caseId, open){
  const c = getCase(caseId); const st = bnsAddState(c);
  Object.assign(st, open ? { open:true } : { open:false, query:'', manualOpen:false, code:'', title:'', error:'' });
  render();
  const el = document.getElementById(open ? 'bns-search' : 'bns-identify-btn'); if(el) el.focus();
}
function toggleBnsManual(caseId, open){
  const c = getCase(caseId); const st = bnsAddState(c);
  Object.assign(st, { manualOpen: open, error:"" });
  if(!open){ st.code = ""; st.title = ""; }
  render();
  const focusEl = document.getElementById(open ? 'bns-custom-code' : 'bns-search');
  if(focusEl) focusEl.focus();
}
function onBnsManualInput(caseId, key, value){
  const c = getCase(caseId); const st = bnsAddState(c);
  st[key] = value;
  const code = normaliseSectionCode(st.code);
  st.error = code && c.bns.sections.some(s=>s.code.toLowerCase()===code.toLowerCase()) ? `${sectionLabel(code)} ${t('is already selected.')}` : "";
  const match = BNS_LIBRARY.find(s=>s.code.toLowerCase()===code.toLowerCase());
  // A listed section fills its own title, unless the officer has typed one
  const titleEl = document.getElementById('bns-custom-title');
  if(key==='code' && match && titleEl && (!st.title.trim() || st.titleAuto)){ st.title = match.title; st.titleAuto = true; titleEl.value = match.title; }
  if(key==='title') st.titleAuto = false;
  const msg = document.getElementById('bns-custom-msg'); if(msg){ msg.innerHTML = bnsManualMessage(st, match); applyTranslations(msg); }
  const codeField = document.getElementById('bns-custom-code');
  if(codeField){ codeField.closest('.field').classList.toggle('field-error', !!st.error); if(st.error) codeField.setAttribute('aria-invalid','true'); else codeField.removeAttribute('aria-invalid'); }
  const btn = document.getElementById('bns-custom-add'); if(btn) btn.disabled = !(code && st.title.trim() && !st.error);
}
function addBnsSection(caseId, code){
  const c = getCase(caseId);
  const found = BNS_LIBRARY.find(s=>s.code===code);
  if(found && !c.bns.sections.some(s=>s.code===code)){
    c.bns.sections.push(Object.assign({}, found));
    c.bns.confirmed = false;
    saveDB(); render();
    toast(`${sectionLabel(code)} added.`);
  }
}
function removeBnsSection(caseId, code){
  const c = getCase(caseId);
  c.bns.sections = c.bns.sections.filter(s=>s.code!==code);
  c.bns.confirmed = false;
  saveDB(); render();
}
function addCustomBnsSection(ev, caseId){
  if(ev && ev.preventDefault) ev.preventDefault();
  const c = getCase(caseId); const st = bnsAddState(c);
  const code = normaliseSectionCode(st.code), title = st.title.trim();
  if(!code || !title || st.error) return false;
  const listed = BNS_LIBRARY.find(s=>s.code.toLowerCase()===code.toLowerCase());
  c.bns.sections.push(listed && listed.title===title ? Object.assign({}, listed) : { code, title, desc:"Added manually by the officer.", custom:true });
  c.bns.confirmed = false;
  Object.assign(st, { manualOpen:false, code:"", title:"", error:"", titleAuto:false });
  saveDB(); render();
  toast(`${sectionLabel(code)} added.`);
  return false;
}
function confirmBns(caseId){
  const c = getCase(caseId);
  c.bns.confirmed = true;
  saveDB(); render();
  toast("BNS sections confirmed and linked to complaint.");
}

/* ================= 3 & 4. REGISTER FIR / FIR COPY ================= */
function renderFirTab(c){
  if(c.fir.registered && !c.bns.confirmed){
    return `${banner('warning', `<span>${t('The BNS sections were changed after the FIR was prepared. Confirm them so the FIR text uses the final sections.')}</span><div class="banner-links"><button type="button" class="axial-btn axial-btn--outline axial-btn--sm" onclick="setTab('bns')">${t('Review sections')}</button></div>`, 'margin-bottom:var(--axial-space-16);')}${renderFirDocument(c)}`;
  }
  if(!c.bns.confirmed){
    return `<div class="card card-pad">${banner('warning', `<span>${t('Confirm BNS sections before registering the FIR.')}</span><div class="banner-links"><button type="button" class="axial-btn axial-btn--outline axial-btn--sm" onclick="setTab('bns')">${t('Go to BNS sections')}</button></div>`)}</div>`;
  }
  if(!c.fir.registered){
    return renderFirReview(c);
  }
  return renderFirDocument(c);
}
/* ================= FIR =================
   The FIR follows the complainant section of the NCRB FIR format (I.I.F.-I, item 6): name,
   father's/husband's name, age, nationality, ID details (type and number), address, occupation, phone.
   ID is asked at complaint registration. An FIR cannot be refused because the complainant has no
   ID with them, so "Not produced" is a valid answer, but it has to be an answer, not a blank. */
const ID_TYPES = ["Aadhaar (UID)","Voter ID card","Driving licence","PAN card","Passport","Ration card","Not produced"];
function psName(s){ return String(s||"").replace(/^\s*(police\s+station|p\.\s*s\.|ps)\s+/i, "").trim(); }
function idText(p){
  if(p.idType === "Not produced") return "Not produced";
  if(p.idType) return p.idNumber ? `${p.idType}, ${p.idNumber}` : "";
  return p.idDetails || "";
}
function docDate(iso){ const m = String(iso||"").match(/^(\d{4})-(\d{2})-(\d{2})$/); return m ? `${m[3]}/${m[2]}/${m[1]}` : (iso||""); }
function docDay(iso){ const d = new Date(`${iso}T00:00:00`); return isNaN(d) ? "" : d.toLocaleDateString('en-IN', {weekday:'long'}); }
function shortDateTime(iso, time){
  const d = new Date(`${iso}T${time||'00:00'}:00`);
  return isNaN(d) ? `${iso||''} ${time||''}`.trim() : d.toLocaleDateString('en-IN', {day:'numeric', month:'short', year:'numeric'}) + (time ? `, ${time}` : '');
}
const FIR_REQUIRED = [
  { key:'policeStation',   label:'Police station' },
  { key:'district',        label:'District' },
  { key:'complainantName', label:'Complainant name' },
  { key:'guardianName',    label:"Father's / husband's name" },
  { key:'age',             label:'Age' },
  { key:'nationality',     label:'Nationality' },
  { key:'idType',          label:'ID type',   test:p=> !!p.idType || !!p.idDetails },
  { key:'idNumber',        label:'ID number', test:p=> !p.idType || p.idType==='Not produced' || !!String(p.idNumber||'').trim() },
  { key:'address',         label:'Address' },
  { key:'placeOfIncident', label:'Place of incident' },
  { key:'dateOfIncident',  label:'Date of incident' },
  { key:'description',     label:'Description of incident' },
];
function firMissing(p){ return FIR_REQUIRED.filter(r=> r.test ? !r.test(p) : !String(p[r.key]||'').trim()); }
function normaliseComplaint(obj){
  if('policeStation' in obj) obj.policeStation = psName(obj.policeStation);
  if(obj.idType === 'Not produced') obj.idNumber = '';
  if(obj.idType && obj.idType !== 'Not produced' && obj.idNumber) obj.idDetails = `${obj.idType}, ${obj.idNumber}`;
  if(obj.idType === 'Not produced') obj.idDetails = 'Not produced';
  return obj;
}
function onIdTypeChange(sel){
  const num = sel.form && sel.form.elements.idNumber;
  if(!num) return;
  const none = sel.value === 'Not produced';
  num.disabled = none;
  if(none) num.value = '';
  num.placeholder = none ? 'Not needed' : 'Number as on the ID';
}
/* Complainant block, shared by the complaint form and the FIR review, in the FIR format's order. */

  const o = opts || {};

    <div class="form-grid">
      <div class="field${err('complainantName')}"><label>Complainant name</label><input class="axial-input" name="complainantName" value="${v('complainantName')}"${o.complaintForm?' required':''}></div>
      <div class="field${err('guardianName')}"><label>Father's / husband's name</label><input class="axial-input" name="guardianName" value="${v('guardianName')}"></div>
      <div class="field${err('age')}"><label>Age</label><input class="axial-input" type="number" min="0" max="120" name="age" value="${v('age')}"></div>
      <div class="field"><label>Gender</label>
        <select class="axial-select" name="gender">
          <option value="">Select</option>
          ${['Male','Female','Other'].map(g=>`<option ${p.gender===g?'selected':''}>${g}</option>`).join('')}

      <div class="field"><label>Occupation</label><input class="axial-input" name="occupation" value="${v('occupation')}" placeholder="e.g. Shopkeeper"></div>
      <div class="field${err('idType')}"><label>ID type</label>
        <select class="axial-select" name="idType" onchange="onIdTypeChange(this)"${o.complaintForm?' required':''}>
          <option value="">Select</option>
          ${ID_TYPES.map(x=>`<option ${p.idType===x?'selected':''}>${x}</option>`).join('')}
        </select>
        ${!p.idType && p.idDetails ? `<div class="hint">Recorded earlier as: ${esc(p.idDetails)}</div>` : ''}
      </div>
      <div class="field${err('idNumber')}"><label>ID number</label><input class="axial-input" name="idNumber" value="${v('idNumber')}" placeholder="${idNone ? 'Not needed' : 'Number as on the ID'}"${idNone?' disabled':''}></div>
      <div class="field"><label>Mobile number</label><input class="axial-input" name="mobile" inputmode="numeric" maxlength="10" value="${v('mobile')}"></div>
      <div class="field span-2${err('address')}"><label>Address</label><textarea class="axial-textarea" name="address" style="min-height:72px;">${v('address')}</textarea></div>

function onFirReviewInput(caseId){

/* ---- After it is prepared: the CCTNS handoff ---- */

  const copied = !!c.firCctnsCopied, numbered = !!String(c.fir.number||'').trim();
  return { copied, numbered, current: numbered ? 0 : (copied ? 2 : 1) };
}

                : `<p class="task-step-text">${missing.length ? t('Some details are not recorded yet. They will read "Not recorded" in CCTNS.') : t('The FIR text follows the format shown in the preview.')}</p>
                   <button type="button" class="axial-btn axial-btn--primary axial-btn--md" onclick="copyFirText('${c.id}')">${ic('content_copy')}<span>${t('Copy FIR for CCTNS')}</span></button>`}

    <aside class="split-doc" aria-label="${t('FIR preview')}">

/* Keep the task card in step with the FIR number as it is typed, without re-rendering the input */
function syncFirTaskCard(c){
  const s = firTaskState(c);
  const step2 = document.getElementById('fir-step-2');
  if(step2){ step2.classList.toggle('is-done', s.numbered); step2.classList.toggle('is-current', s.current===2); }
  const mark = document.getElementById('fir-step-2-mark'); if(mark) mark.innerHTML = s.numbered ? ic('check') : '2';
  const ok = document.getElementById('fir-number-ok'); if(ok) ok.hidden = !s.numbered;
  const okText = document.getElementById('fir-number-ok-text'); if(okText) okText.textContent = `FIR ${c.fir.number.trim()} ${t('recorded')}`;
  const btn = document.getElementById('fir-continue'); if(btn) btn.disabled = !s.numbered;
  const hint = document.getElementById('fir-next-hint'); if(hint) hint.textContent = s.numbered ? t('Next: assign the investigating officer.') : t('Continue once CCTNS has given the FIR number.');
}

function readFirReviewForm(c){
  const form = document.getElementById("fir-review-form");
  if(!form) return;
  const obj = normaliseComplaint(formToObj(form));
  if(form.elements.idNumber && form.elements.idNumber.disabled) obj.idNumber = '';
  Object.assign(c.complaint, obj);
}
function registerFir(caseId){
  const c = getCase(caseId);
  readFirReviewForm(c);
  const missing = firMissing(c.complaint);
  if(missing.length){
    UI.firShowErrors = c.id;
    saveDB(); render();
    const first = document.querySelector('#fir-review-form .field-error input, #fir-review-form .field-error select, #fir-review-form .field-error textarea');
    if(first){ first.focus(); first.scrollIntoView({block:'center', behavior:'smooth'}); }
    toast(`Fill ${missing.length} more detail${missing.length>1?'s':''} before preparing the FIR.`);
    return;
  }
  UI.firShowErrors = null;
  c.fir.registered = true;
  c.fir.date = nowDate(); c.fir.time = nowTime();
  c.fir.narrative = buildFirNarrative(c);
  c.status = "FIR Registered";
  c.firCopyGenerated = true;
  addDiaryPara(c, {
    investigationStep:"Complaint received & FIR registered",
    actionTaken:`Complaint received from ${c.complaint.complainantName||'complainant'} regarding ${c.complaint.crimeSubCategory||'the reported offence'}. FIR registered under BNS section(s) ${c.bns.sections.map(s=>s.code).join(', ')}.`,
    result:"FIR registered", nextAction:"Copy the FIR text, upload to CCTNS, then enter the FIR number CCTNS assigns.",
    approved:true
  });
  saveDB(); render(); toTop();

/* "Action taken", item 13 of the FIR. Drafted once at registration; the officer can edit it. */
function buildFirNarrative(c){
  const secs = c.bns.sections.map(s=>s.code);
  const bns = secs.filter(x=>!/^it act/i.test(x)), it = secs.filter(x=>/^it act/i.test(x)).map(x=>x.replace(/^it act\s*/i,''));
  const list = (a)=> a.length>1 ? `${a.slice(0,-1).join(', ')} and ${a[a.length-1]}` : a[0];
  const acts = [bns.length ? `section${bns.length>1?'s':''} ${list(bns)} of the Bharatiya Nyaya Sanhita, 2023` : '', it.length ? `section${it.length>1?'s':''} ${list(it)} of the Information Technology Act, 2000` : ''].filter(Boolean).join(', and ');
  return `The information received discloses the commission of a cognizable offence under ${acts || 'the sections at item 2'}. The case is registered and taken up for investigation.`;
}

/* ---- The FIR as a structured document: one model, drawn as the preview and written out as the CCTNS text ---- */
function firDocModel(c){
  const p = c.complaint;
  const secs = c.bns.sections.map(s=>s.code);
  const bns = secs.filter(x=>!/^it act/i.test(x)), it = secs.filter(x=>/^it act/i.test(x)).map(x=>x.replace(/^it act\s*/i,''));
  const V = (x)=> (x==null || String(x).trim()==='') ? null : String(x).trim();
  const age = V(p.age) ? `${p.age} years` : null;
  const genderAge = [age, V(p.gender)].filter(Boolean).join(', ') || null;
  const ioLine = c.io.assigned && c.io.name ? ` Investigation entrusted to ${c.io.rank ? c.io.rank+' ' : ''}${c.io.name}.` : '';
  return {
    title: "FIRST INFORMATION REPORT",
    subtitle: "(Under Section 173 of the Bharatiya Nagarik Suraksha Sanhita, 2023)",
    sections: [
      { no:"1", rows:[ ["District", V(p.district)], ["Police station", V(psName(p.policeStation))], ["Year", c.fir.date ? c.fir.date.slice(0,4) : String(new Date().getFullYear())],
                       ["FIR No.", V(c.fir.number), "To be entered after CCTNS upload"], ["Date and time of FIR", c.fir.date ? `${docDate(c.fir.date)}, ${c.fir.time}` : null, "Recorded when the FIR is prepared"] ] },
      { no:"2", heading:"Acts and sections", rows:[
          ...(bns.length ? [["Bharatiya Nyaya Sanhita, 2023", bns.join(', ')]] : []),
          ...(it.length ? [["Information Technology Act, 2000", it.join(', ')]] : []),
          ...(!secs.length ? [["Sections", null]] : []) ] },
      { no:"3", heading:"Occurrence of offence", rows:[
          ["Day and date", V(p.dateOfIncident) ? `${docDay(p.dateOfIncident)}, ${docDate(p.dateOfIncident)}` : null],
          ["Time", V(p.timeOfIncident), "Not known"],
          ["Information received at P.S.", V(p.complaintDate) ? `${docDate(p.complaintDate)}, ${p.complaintTime||''}`.replace(/, $/,'') : null],
          ["General diary reference", c.gd.number ? `Entry No. ${c.gd.number}` : null, "Entered after the GD is generated"] ] },
      { no:"4", heading:"Type of information", rows:[["", c.firStatement.fields.complaintType==="Oral Information" ? "Oral" : "Written"]] },
      { no:"5", heading:"Place of occurrence", rows:[["Address", V(p.placeOfIncident)]] },
      { no:"6", heading:"Complainant / informant", rows:[
          ["Name", V(p.complainantName)], ["Father's / husband's name", V(p.guardianName)], ["Age and gender", genderAge],
          ["Nationality", V(p.nationality)], ["ID details", V(idText(p))], ["Address", V(p.address)],
          ["Occupation", V(p.occupation), "Not stated"], ["Mobile", V(p.mobile), "Not stated"] ] },
      { no:"7", heading:"First information contents", text: V(p.description) },
      { no:"8", heading:"Action taken", text: V((c.fir.narrative || (c.fir.registered ? '' : buildFirNarrative(c))) + ioLine) }
    ]
  };
}
function firDocHtml(m){
  const val = (row)=> row[1]!=null ? esc(row[1]) : row[2] ? `<span class="fir-soft">${esc(row[2])}</span>` : `<span class="fir-missing">${ic('warning')}Not recorded</span>`;
  return `<div class="fir-doc">
    <div class="fir-doc-title">${esc(m.title)}</div>
    <div class="fir-doc-sub">${esc(m.subtitle)}</div>
    ${m.sections.map(s=>`
      <section class="fir-sec">
        <div class="fir-no">${s.no}.</div>
        <div class="fir-body">
          ${s.heading ? `<div class="fir-heading">${esc(s.heading)}</div>` : ''}
          ${s.rows ? `<dl class="fir-rows">${s.rows.map(r=> r[0] ? `<dt>${esc(r[0])}</dt><dd>${val(r)}</dd>` : `<dd class="fir-wide">${val(r)}</dd>`).join('')}</dl>` : ''}
          ${'text' in s ? `<p class="fir-text">${s.text!=null ? esc(s.text) : `<span class="fir-missing">${ic('warning')}Not recorded</span>`}</p>` : ''}
        </div>
      </section>`).join('')}
  </div>`;
}
function firDocText(m){
  const val = (row)=> row[1]!=null ? row[1] : (row[2] || 'Not recorded');
  let out = `${m.title}\n${m.subtitle}\n`;
  m.sections.forEach(s=>{
    const lines = [];
    if(s.rows) s.rows.forEach(r=> lines.push(r[0] ? `${r[0]}: ${val(r)}` : val(r)));
    if('text' in s) lines.push(s.text!=null ? s.text : 'Not recorded');
    if(s.heading) out += `\n${s.no}. ${s.heading}\n` + lines.map(l=>`   ${l}`).join('\n') + '\n';
    else out += `\n${s.no}. ${lines[0]||''}\n` + lines.slice(1).map(l=>`   ${l}`).join('\n') + (lines.length>1 ? '\n' : '');
  });
  return out;
}

function copyToClipboard(text){
  function fallbackCopy(){
    try{
      const ta=document.createElement('textarea');
      ta.value=text; ta.style.position='fixed'; ta.style.left='-9999px'; ta.style.top='0';
      document.body.appendChild(ta); ta.focus(); ta.select();
      const ok = document.execCommand('copy');
      document.body.removeChild(ta);
      return ok;
    }catch(e){ return false; }
  }
  // Runs after the caller's "copied" message, so a failure replaces it
  const failed = ()=> setTimeout(()=>toast("Couldn't copy to the clipboard. Select the text in the preview and copy it by hand."), 0);
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).catch(()=>{ if(!fallbackCopy()) failed(); });
  } else if(!fallbackCopy()){
    failed();
  }
}

/* ---- Voice-to-text (speech recognition) helper, used throughout the app ---- */
/* Voice input, hardened: only one recognition instance runs at a time (a second tap on the
   active mic stops it), microphone permission is requested explicitly up front so failures
   are clear rather than a silent/generic recognition error, and partial speech is shown live. */
let ACTIVE_RECOGNITION = null;
let ACTIVE_RECOGNITION_BTN = null;
async function startVoiceInput(elementId, btn){
  const el = document.getElementById(elementId);
  if(!el) return;

  if(ACTIVE_RECOGNITION && ACTIVE_RECOGNITION_BTN === btn){
    ACTIVE_RECOGNITION.stop();
    return;
  }
  if(ACTIVE_RECOGNITION){
    try{ ACTIVE_RECOGNITION.stop(); }catch(e){}
  }

  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ toast("Voice input isn't supported in this browser. Try Chrome or Edge."); return; }

  if(navigator.mediaDevices && navigator.mediaDevices.getUserMedia){
    try{
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      stream.getTracks().forEach(t=>t.stop());
    }catch(permErr){
      if(permErr && permErr.name === 'NotFoundError'){
        toast("No microphone found on this device.");
      } else {
        toast("Microphone access is blocked. Check site/browser permissions, or type instead.");
      }
      return;
    }
  }

  try{
    const rec = new SR();
    rec.lang = UI_LANG === "hi" ? "hi-IN" : "en-IN";
    rec.interimResults = true;
    rec.maxAlternatives = 1;
    ACTIVE_RECOGNITION = rec;
    ACTIVE_RECOGNITION_BTN = btn;
    if(btn){ btn.classList.add("mic-active"); btn.innerHTML = ic('stop','ms--fill'); btn.setAttribute('aria-label','Stop listening'); btn.title = "Listening. Tap to stop"; }
    toast("Listening... speak now.");
    const baseValue = (el.value && el.value.trim()) ? el.value.trim() + " " : "";
    rec.onresult = (e)=>{
      let transcript = "";
      for(let i=0; i<e.results.length; i++){ transcript += e.results[i][0].transcript; }
      el.value = baseValue + transcript;
      el.dispatchEvent(new Event('input', {bubbles:true}));
    };
    rec.onerror = (e)=>{
      const messages = {
        'not-allowed': "Microphone access was blocked. Check site permissions, or type instead.",
        'service-not-allowed': "Voice input isn't available in this context. Please type instead.",
        'audio-capture': "No microphone found on this device.",
        'no-speech': "Didn't catch that. Tap the mic and try again.",
        'network': "Voice input needs a network connection."
      };
      toast(messages[e.error] || ("Voice input error: " + (e.error||"unknown")));
    };
    rec.onend = ()=>{
      if(btn){ btn.classList.remove("mic-active"); btn.innerHTML = ic('mic'); btn.setAttribute('aria-label','Speak to add text'); btn.title = "Speak to add text"; }
      el.dispatchEvent(new Event('change', {bubbles:true}));
      if(ACTIVE_RECOGNITION===rec){ ACTIVE_RECOGNITION=null; ACTIVE_RECOGNITION_BTN=null; }
    };
    rec.start();
  }catch(e){
    toast("Could not start voice input.");
    if(btn){ btn.classList.remove("mic-active"); btn.innerHTML = ic('mic'); }
  }
}

  out += `अपराध उप-श्रेणी: ${subHi}\n`;
  out += `धारा: ${hiSections(c)}\n\n`;
  out += `GD प्रविष्टि\n\n`;

  out += `आज दिनांक ${gdDate} को समय लगभग ${gdTime}, ${hiVal(p.complainantName)}`;
  if(p.guardianName) out += ` ${hiRelationship(relFor(c))} ${p.guardianName}`;
  if(p.age) out += `, उम्र लगभग ${p.age} वर्ष`;
  if(p.address) out += `, निवासी ${p.address}`;
  out += `, थाना ${hiVal(p.policeStation)} उपस्थित आए तथा अपनी शिकायत के संबंध में एक ${complaintTypeHi} प्रस्तुत की।\n\n`;

  if(p.description) out += `शिकायतकर्ता द्वारा बताया गया कि ${p.description}\n\n`;

  if(f.propertyDetails || f.propertyValue){
    out += `शिकायतकर्ता द्वारा बताया गया कि ${hiVal(f.propertyDetails,'सामान')} गायब है।`;
    if(f.propertyValue) out += ` चोरी गए सामान की अनुमानित कुल कीमत लगभग ${f.propertyValue} बताई गई।`;
    if(cdIsUnknownAccused(c)) out += ` शिकायत के अनुसार घटना के लिए उत्तरदायी व्यक्ति अज्ञात हैं।`;
    out += `\n\n`;
  }

  out += `प्राप्त शिकायत के आधार पर प्रकरण को ${catHi} एवं उप-श्रेणी ${subHi} के रूप में दर्ज किया गया तथा लागू BNS धाराओं का अधिकारी द्वारा चयन एवं सत्यापन किया गया।\n\n`;

  if(c.fir.registered){
    out += `प्राप्त सूचना के आधार पर थाना ${hiVal(p.policeStation)} में FIR संख्या ${hiVal(c.fir.number)} दिनांक ${firDate} को ${firTime} पंजीकृत की गई। FIR का विवरण CCTNS में दर्ज किया गया। FIR की प्रति शिकायतकर्ता को नियमानुसार उपलब्ध कराई गई।\n\n`;
  }

  if(c.io.name){
    out += `प्रकरण की विवेचना हेतु ${hiVal(c.io.rank)} ${hiVal(c.io.name)} को विवेचक नियुक्त किया गया। विवेचक को घटनास्थल का निरीक्षण करने, शिकायतकर्ता एवं गवाहों के बयान दर्ज करने, उपलब्ध CCTV फुटेज की जांच करने, आवश्यक साक्ष्य एकत्र करने तथा अन्य आवश्यक विवेचनात्मक कार्रवाई करने हेतु निर्देशित किया गया।\n\n`;
  }

  out += `उक्त कार्यवाही की प्रविष्टि सामान्य डायरी में दर्ज की गई।\n\n`;
  out += `वरिष्ठ अधिकारी:\n${gdSeniorOfficerText(c) || '__________________'}\nथाना ${hiVal(p.policeStation)}\nजनपद ${hiVal(p.district)}\n\n`;
  out += `हस्ताक्षर: __________________\nदिनांक: ${gdDate}\nसमय: ${gdTime}\n`;
  return out;
}

/* "Review & confirm": one clear confirmation, then the same generate-and-lock as before. */
async function reviewAndConfirmStatement(caseId){
  const c = getCase(caseId);
  ensureFirStatementAutoFill(c);
  const f = c.firStatement.fields;
  const incomplete = STATEMENT_MANDATORY.some(k=> !f[k] || String(f[k]).trim()==='') || (f.bnsSections||[]).length===0;
  if(incomplete){ generateStatement(caseId); return; }   // shows the missing fields exactly as before
  const ok = await confirmDialog({ title:'Confirm the writer statement?', body:'Check the preview first. The statement is locked once confirmed; you can unlock it with Edit statement.', confirmLabel:'Confirm statement' });
  if(ok) generateStatement(caseId);
}

function assignIo(ev, caseId){
  ev.preventDefault();
  const c = getCase(caseId);
  const obj = formToObj(ev.target);
  const wasAssigned = c.io.assigned;
  Object.assign(c.io, obj, {assigned:true});
  UI.ioEdit = null;
  if(!wasAssigned){
    c.status = "IO Assigned";
    addDiaryPara(c, {
      investigationStep:"Investigating Officer assigned",
      actionTaken:`${c.io.name} (${c.io.rank}) assigned as Investigating Officer.`,
      result:"IO assigned", nextAction:"Proceed to generate the GD entry.",
      approved:true
    });
  }
  saveDB();
  if(wasAssigned){ render(); toast("Investigating officer updated."); }
  else { saveAndContinue(caseId,'io'); toast("Investigating officer assigned."); }
  return false;
}

const STATEMENT_MANDATORY = ['firNumber','policeStation','district','firDate','firTime','crimeCategory','crimeSubCategory',

/* Keeps the statement in step with the case. The only fields shown on this tab are the
   recorder's own details (who, when, where, on whose orders) plus the FIR and GD numbers,
   which write straight back to the case. Everything else is not editable here, so it is
   copied from the case on every render, a police station corrected on the Complaint tab,
   or a GD number entered after this tab was first opened, now reaches the statement.
   Once the statement is generated and locked, nothing changes until the officer unlocks it. */
function ensureFirStatementAutoFill(c){
  if(c.firStatement.generated) return;
  const f = c.firStatement.fields;
  const source = {
    complaintNumber: c.complaint.complaintNumber,
    firNumber: c.fir.number, policeStation: c.complaint.policeStation, district: c.complaint.district,
    gdNumber: c.gd.number, gdDate: c.gd.date, gdTime: c.gd.time, firDate: c.fir.date, firTime: c.fir.time,
    crimeCategory: c.complaint.crimeCategory, crimeSubCategory: c.complaint.crimeSubCategory,
    complainantName: c.complaint.complainantName, guardianName: c.complaint.guardianName,
    complainantAge: c.complaint.age, complainantAddress: c.complaint.address,
    complaintDate: c.complaint.complaintDate, complaintTime: c.complaint.complaintTime,
    briefDescription: c.complaint.description,
    firRegDate: c.fir.date, firRegTime: c.fir.time,
    ioName: c.io.name, ioRank: c.io.rank, ioAssignmentDate: c.io.date, ioAssignmentTime: c.io.time
  };
  Object.entries(source).forEach(([k,val])=>{ f[k] = val || ""; });
  f.officerPosting = c.complaint.policeStation ? "Police Station "+c.complaint.policeStation : "";
  f.bnsSections = c.bns.sections.map(s=>({code:s.code, title:s.title}));
  if(c.complaint.gender){
    f.relationship = relFor(c);
  }
  c.firStatement.autoFilled = true;
  saveDB();
}

function updateStatementField(caseId, key, value){

  if(key==='firNumber'){ c.fir.number = value; }
  if(key==='gdNumber'){ c.gd.number = value; }

    const fieldDef = STATEMENT_GROUPS.flatMap(g=>g.fields).find(fd=>fd.key===key);
    const wrap = document.getElementById('stmt-'+key); const fieldEl = wrap && wrap.closest('.field');

  refreshStatementPreview(caseId);
  if(key==='firNumber'){
    const title = caseTitle(c);

    document.querySelectorAll(`[data-case-title="${caseId}"]`).forEach(el=>{ el.innerHTML = title; });

function generateStatement(caseId){

  ensureFirStatementAutoFill(c);
  const missing = STATEMENT_MANDATORY.some(k=> !f[k] || String(f[k]).trim()==='');
  const missingBns = (f.bnsSections||[]).length===0;
  if(missing || missingBns){
    UI.stmtShowErrors = true;
    render();
    const upstream = statementUpstreamMissing(c);
    toast(upstream.length
      ? "The statement can't be generated yet. The banner lists what is still needed."
      : "Complete the highlighted fields to generate the statement.");
    return;
  }
  UI.stmtShowErrors = false;
  c.firStatement.generated = true;
  c.status = "Registration Complete";
  if(!f.firstParchaDone){
    addDiaryPara(c, {
      investigationStep:"FIR Writing Officer Statement recorded",
      actionTaken: firStatementPlainText(f),
      result:"FIR, GD and Statement recorded",
      nextAction:"Proceed with investigation steps.",
      approved:true
    });
    f.firstParchaDone = true;
  }
  saveDB();
  render();
  toast('Writer statement recorded.');
}

    c.firStatement.fields[k] = defaults.hasOwnProperty(k) ? (Array.isArray(defaults[k])?[]:defaults[k]) : "";

async function downloadStatementPdf(caseId){
  const c = getCase(caseId);
  const text = firStatementPlainText(c.firStatement.fields);
  const filename = `FIR_Statement_${(c.firStatement.fields.firNumber||'draft').replace(/\//g,'_')}`;
  if(UI_LANG === 'hi'){
    // The PDF library's built-in fonts cannot draw Devanagari, so a Hindi PDF would come out as garbage characters
    toast("A Hindi PDF can't be made here, so the statement is downloading as a text file. Use Print to save it as PDF.");
    downloadText(filename + '.txt', text);
    return;
  }
  try{
    await loadJsPdf();
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit:'pt', format:'a4' });
    const margin = 56;
    const maxWidth = doc.internal.pageSize.getWidth() - margin*2;
    const pageBottom = doc.internal.pageSize.getHeight() - margin;
    const lineHeight = 16;
    let y = margin;
    doc.setFont('helvetica','bold'); doc.setFontSize(13);
    doc.splitTextToSize("STATEMENT OF FIR WRITING / REGISTRATION OFFICER", maxWidth).forEach(l=>{
      doc.text(l, doc.internal.pageSize.getWidth()/2, y, {align:'center'}); y += lineHeight;
    });
    y += 8;
    doc.setFont('helvetica','normal'); doc.setFontSize(11);
    const bodyText = text.split('\n').slice(2).join('\n'); // drop the title lines already drawn above
    bodyText.split('\n').forEach(rawLine=>{
      const wrapped = doc.splitTextToSize(rawLine==='' ? ' ' : rawLine, maxWidth);
      wrapped.forEach(l=>{
        if(y > pageBottom){ doc.addPage(); y = margin; }
        doc.text(l, margin, y);
        y += lineHeight;
      });
    });
    doc.save(filename + '.pdf');
    embedHint('download');
  }catch(e){
    toast("Couldn't generate a PDF right now, so it is downloading as text instead.");
    downloadText(filename + '.txt', text);
  }
}
function loadJsPdf(){
  return new Promise((resolve, reject)=>{
    if(window.jspdf && window.jspdf.jsPDF){ resolve(); return; }
    const existing = document.getElementById('jspdf-script');
    if(existing){ existing.addEventListener('load', ()=>resolve()); existing.addEventListener('error', reject); return; }
    const script = document.createElement('script');
    script.id = 'jspdf-script';
    script.src = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
    script.onload = ()=>resolve();
    script.onerror = ()=>reject(new Error("Could not load PDF library"));
    document.head.appendChild(script);
  });
}

/* ---- Statement text engine: one set of building blocks, used for both the highlighted
   live-preview HTML and the plain text used by copy/print/PDF. Optional details (a
   guardian's name, property value, an IO not yet assigned, etc.) simply drop out of the
   sentence instead of leaving blank brackets. ---- */
function stmtV(val, highlight, fallback){
  const has = val !== undefined && val !== null && String(val).trim() !== '';
  const s = has ? String(val) : (fallback!==undefined ? fallback : '_____');
  return highlight ? `<span class="stmt-var">${esc(s)}</span>` : s;
}
function stmtT(s, highlight){ return highlight ? esc(s) : s; }
/* Short, generic offence phrase per sub-category, used only for the first, brief mention
   of what the complaint concerns. The full, specific account always comes from the
   officer's own dictated/typed Brief Incident Description, never invented here. */
const OFFENCE_PHRASES = {
  "Theft": "theft", "Robbery": "robbery", "Burglary": "burglary", "House Breaking": "house-breaking and theft",
  "Murder": "murder", "Attempt to Murder": "attempt to murder", "Assault": "assault", "Kidnapping": "kidnapping",
  "Online Fraud": "online fraud", "Identity Theft": "identity theft", "Cyber Stalking": "cyber stalking",
  "Account Hacking": "unauthorised access to his account"
};
const RELATIONSHIP_WORDS = { "S/O":"son of", "D/O":"daughter of", "W/O":"wife of" };
/* The FIR Writing Officer's name/rank fields are no longer shown on the form, the person
   who recorded the statement is treated as the officer giving it, since that's the only
   identity the form still collects. Falls back to officerName/officerRank if those were
   set some other way (e.g. an older saved case). */
function stmtOfficerName(f){ return f.recordedBy || f.officerName || ''; }
function stmtOfficerRank(f){ return f.recordedByRank || f.officerRank || ''; }
function computeStatementDerived(f){
  return {
    bnsSectionsText: (f.bnsSections||[]).map(s=>s.code).join(', '),
    hasBns: (f.bnsSections||[]).length>0,
    hasGuardian: !!(f.guardianName && f.guardianName.trim()),
    hasAge: !!(f.complainantAge && String(f.complainantAge).trim()),
    hasAddress: !!(f.complainantAddress && f.complainantAddress.trim()),
    hasServiceNumber: !!(f.officerServiceNumber && f.officerServiceNumber.trim()),
    hasPosting: !!(f.officerPosting && f.officerPosting.trim()),
    hasState: !!(f.state && f.state.trim()),
    hasProperty: !!((f.propertyDetails && f.propertyDetails.trim()) || (f.propertyValue && String(f.propertyValue).trim())),
    hasGd: !!(f.gdNumber && f.gdNumber.trim()),
    hasIo: !!(f.ioName && f.ioName.trim()),
    hasDirection: !!(f.initialDirection && f.initialDirection.trim()),
    copyProvidedText: f.firCopyProvided==='No' ? 'not provided' : 'provided',
    complaintTypeText: f.complaintType==='Oral Information' ? 'oral information' : (f.complaintType==='Other' ? 'complaint' : 'written complaint'),
    offencePhrase: OFFENCE_PHRASES[f.crimeSubCategory] || (f.crimeSubCategory ? f.crimeSubCategory.toLowerCase() : 'the offence')
  };
}
/* District line used in a few places: "District X" or "District X, State" when known. */
function stmtDistrictLine(f, V, T, d){
  let s = T('District ')+V(f.district);
  if(d.hasState) s += T(', ')+V(f.state);
  return s;
}
function buildStatementParagraphs(f, highlight){
  f = Object.assign({}, f, ['firDate','complaintDate','firRegDate','gdDate','statementDate','ioAssignmentDate'].reduce((o,k)=>{ o[k] = f[k] ? docDate(f[k]) : f[k]; return o; }, {}));
  const V = (val, fb)=>stmtV(val, highlight, fb);
  const T = (s)=>stmtT(s, highlight);
  const d = computeStatementDerived(f);
  const lines = [];
  const kv = (label, val) => { if(val && String(val).trim()!==''){ lines.push(T(label+': ')+V(val)); } };
  kv('Complaint No.', f.complaintNumber);
  kv('FIR No.', f.firNumber);
  lines.push(T('Police Station: ')+V(f.policeStation)+T(', ')+stmtDistrictLine(f,V,T,d));
  kv('GD Entry No.', f.gdNumber);
  kv('Date', f.firDate);
  kv('Crime Category', f.crimeCategory);
  kv('Crime Sub-category', f.crimeSubCategory);
  kv('Informant/Complainant', f.complainantName);
  const officerName = stmtOfficerName(f);
  const officerRank = stmtOfficerRank(f);
  if(officerName || officerRank){
    lines.push(T('FIR Writing/Registration Officer: ')+V((officerRank?officerRank+' ':'')+officerName, '_____'));
  }

  const paras = [];

  // P1, officer identification + complainant's appearance and complaint
  let p1 = T('I, ')+V((officerRank?officerRank+' ':'')+officerName,'_____');
  if(d.hasServiceNumber) p1 += T(', Belt/Service No. ')+V(f.officerServiceNumber);
  p1 += T(', presently posted at ')+V(f.officerPosting, 'Police Station '+(f.policeStation||'_____'))+T(', ')+stmtDistrictLine(f,V,T,d);
  p1 += T(', state that on ')+V(f.complaintDate)+T(' at about ')+V(f.complaintTime)+T(', I was performing my official duties at Police Station ')+V(f.policeStation)+T(' when ')+V(f.complainantName);
  if(d.hasGuardian) p1 += T(', ')+V(RELATIONSHIP_WORDS[f.relationship]||'son of')+T(' ')+V(f.guardianName);
  if(d.hasAge) p1 += T(', aged about ')+V(f.complainantAge)+T(' years');
  if(d.hasAddress) p1 += T(', resident of ')+V(f.complainantAddress);
  p1 += T(', appeared at the police station and submitted a ')+V(d.complaintTypeText)+T(' regarding ')+V(d.offencePhrase)+T('.');
  paras.push(p1);

  // P1b, on whose orders the FIR was registered, if given
  if(f.onOrdersOf && f.onOrdersOf.trim()!==''){
    paras.push(T('The FIR was registered on the orders of ')+V(f.onOrdersOf)+T('.'));
  }

  // P2, the officer's own account of what the complainant stated (their Brief Incident Description, verbatim)
  if(f.briefDescription && f.briefDescription.trim()!==''){
    paras.push(T('The complainant stated in the ')+V(d.complaintTypeText)+T(' that ')+V(afterThat(f.briefDescription)));
  }

  // P3, property, only if provided
  if(d.hasProperty){
    let pp = T('The complainant further stated that ')+V(f.propertyDetails,'certain items')+T(' were stolen or found missing.');
    if(f.propertyValue && String(f.propertyValue).trim()!==''){
      pp += T(' The complainant stated that the approximate value of the stolen property was ')+V(f.propertyValue)+T('.');
    }
    if(/unknown|unidentified|अज्ञात/i.test(f.briefDescription||'')) pp += T(' The identity of the person(s) responsible was not known to the complainant at the time of registration.');
    paras.push(pp);
  }

  // P4, receipt and processing under BNS
  paras.push(T('I received the ')+V(d.complaintTypeText)+T(' and examined the information provided by the complainant. The information disclosed facts relating to a cognizable offence. The case was accordingly processed for registration under the applicable provisions of the Bharatiya Nyaya Sanhita, 2023, as selected and confirmed during FIR registration.'));

  // P5, CCTNS entry, GD, FIR registration
  if(d.hasGd){
    // In this workflow the FIR is prepared first and the GD entry is made after it, at its own date and time
    let p5 = T('The information provided by the complainant was entered into the prescribed CCTNS system, and FIR No. ')+V(f.firNumber)+T(' was registered at Police Station ')+V(f.policeStation)+T(' on ')+V(f.firRegDate)+T(' at about ')+V(f.firRegTime)+T('. ');
    p5 += T('The corresponding GD Entry No. ')+V(f.gdNumber)+(f.gdDate ? T(' was recorded on ')+V(f.gdDate)+T(' at about ')+V(f.gdTime)+T('.') : T(' was recorded.'));
    paras.push(p5);
  } else {
    paras.push(T('The information provided by the complainant was entered into the prescribed CCTNS system. FIR No. ')+V(f.firNumber)+T(' was registered at Police Station ')+V(f.policeStation)+T(' on ')+V(f.firRegDate)+T(' at about ')+V(f.firRegTime)+T('.'));
  }
  paras.push(T('The FIR contained the details of the complainant, incident, place of occurrence')+(d.hasProperty?T(', stolen property'):T(''))+T(' and applicable legal provisions.'));

  // P6, FIR copy provided
  paras.push(T('After registration of the FIR, a copy of the FIR was ')+V(d.copyProvidedText)+T(' to the complainant in accordance with the applicable procedure. The complainant was informed about the registration of the case and the further investigation process.'));

  // P7, forwarded to IO with standard investigation directions
  if(d.hasIo){
    paras.push(T('The FIR and relevant GD information were thereafter forwarded to ')+V((f.ioRank?f.ioRank+' ':'')+f.ioName)+T(', who was assigned as the Investigating Officer of the case. The Investigating Officer was directed to conduct necessary investigation, including inspection of the place of occurrence, examination of the complainant and witnesses, collection and preservation of relevant evidence, examination of available CCTV footage and other necessary investigation as per applicable law and procedure.'));
  }
  if(d.hasDirection){ paras.push(V(f.initialDirection)); }

  // Closing
  paras.push(T('I state that the above FIR was registered by me in the course of my official duty on the basis of the information and ')+V(d.complaintTypeText)+T(' received at the police station. The information entered into CCTNS and the FIR was recorded to the best of my knowledge and based on the information available at the time of registration.'));
  paras.push(T('This statement is given by me regarding the receipt of the complaint, preparation and registration of the FIR, recording of the corresponding GD entry, provision of the FIR copy to the complainant and forwarding of the case for investigation.'));

  return { lines, paras };
}

/* The description is dropped into "...stated that ___". Lower-case its first word when that word is
   an ordinary sentence opener, so it reads "that on the night of...", names are left as written. */
function afterThat(text){
  const m = String(text||'').match(/^(\s*)([A-Z][a-z]*)(\b[\s\S]*)$/);
  const openers = ['On','The','A','An','At','In','During','While','When','Around','About','Two','Three','Some','Unknown','Yesterday','Today','Last','Within','After','Before','My','His','Her','Their'];
  return m && openers.includes(m[2]) ? m[1] + m[2].toLowerCase() + m[3] : text;
}

  const { lines, paras } = buildStatementParagraphs(f, false);

  let out = 'Statement of FIR Writing Officer\n\n';
  out += lines.join('\n') + '\n\n';
  out += 'Statement\n\n';
  out += paras.join('\n\n') + '\n\n';
  out += sig.block1.join('\n') + '\n\n';
  out += 'Statement Given By:\n' + sig.block2.join('\n');
  return out;
}
function firStatementPlainTextHindi(f){

  out += 'कथन दर्ज करने वाला अधिकारी:\n' + sig.block2.join('\n');
  return out;
}

function ensureSopLoaded(c){
  const sub = c.complaint.crimeSubCategory;
  if(c.sop.subcategoryLoaded === sub) return;
  const lib = SOP_LIBRARY[sub];
  if(!lib) return;
  c.sop.subcategoryLoaded = sub;
  c.sop.steps = lib.steps.map((activity,i)=>({
    id: "step-"+i, num:i+1, activity, requiredInfo:"", requiredEvidence:"", status:"Pending",
    date:"", time:"", officer:"", notes:"", reasonNA:"", paraGenerated:false, custom:false
  }));
  if(c.evidence.length===0){
    c.evidence = lib.evidence.map(item=>({item, required:"Required", status:"Pending"}));
  }
}
function renderSopTab(c){
  if(!c.io.assigned){
    return `<div class="card card-pad">${banner('warning', t('Assign an Investigating Officer before starting investigation steps.'))}</div>`;

function toggleStepComplete(caseId, stepId, isChecked){
  const c = getCase(caseId);
  const s = c.sop.steps.find(x=>x.id===stepId);
  s.status = isChecked ? 'Completed' : 'Pending';
  if(isChecked){
    if(!s.date) s.date = nowDate();
    if(!s.time) s.time = nowTime();
    if(!s.officer) s.officer = c.io.name;
    if(!s.paraGenerated){
      addDiaryPara(c, {
        investigationStep: s.activity,
        actionTaken: s.activity + ', completed by ' + (s.officer||'the Investigating Officer') + '.',
        result:'Completed',
        approved:false
      });
      s.paraGenerated = true;
      toast("Step completed. Draft case diary para created for your approval.");
    }
  }
  saveDB(); render();
}
function markStepNA(caseId, stepId){
  const c = getCase(caseId);
  const s = c.sop.steps.find(x=>x.id===stepId);
  if(s.status === 'Not Applicable'){
    s.status = 'Pending'; s.reasonNA = '';
    saveDB(); render();
    return;
  }
  const reason = prompt("Reason this step is not applicable:", s.reasonNA||"");
  if(reason===null) return;
  if(!reason.trim()){ toast("Provide a reason for Not Applicable."); return; }
  s.status = 'Not Applicable'; s.reasonNA = reason.trim();
  if(!s.date) s.date = nowDate();
  if(!s.time) s.time = nowTime();
  if(!s.officer) s.officer = c.io.name;
  if(!s.paraGenerated){
    addDiaryPara(c, {
      investigationStep: s.activity,
      actionTaken: `Step marked Not Applicable. Reason: ${s.reasonNA}`,
      result:'Not Applicable', approved:false
    });
    s.paraGenerated = true;
  }
  saveDB(); render();
  toast("Step marked Not Applicable.");
}
function addCustomSopStep(caseId){
  const c = getCase(caseId);
  const input = document.getElementById('custom-step-input');
  const text = input ? input.value.trim() : "";
  if(!text){ toast("Describe the custom step first."); return; }
  const num = c.sop.steps.length + 1;
  c.sop.steps.push({
    id: uid("step-custom"), num, activity: text, requiredInfo:"", requiredEvidence:"", status:"Pending",
    date:"", time:"", officer:"", notes:"", reasonNA:"", paraGenerated:false, custom:true
  });
  saveDB(); render();
  toast("Custom step added.");
}
function removeCustomStep(caseId, stepId){
  const c = getCase(caseId);
  c.sop.steps = c.sop.steps.filter(s=>s.id!==stepId);
  c.sop.steps.forEach((s,i)=>{ s.num = i+1; });

function buildSampleCase(spec){
  const c = defaultCaseShape(uid("case"));
  c.sample = true;
  const day = sampleDay(spec.daysAgo);
  const yr = new Date().getFullYear();
  c.createdAt = `${day}T${spec.complaintTime}:00`;
  const { incidentDaysAgo, ...complaint } = spec.complaint;
  Object.assign(c.complaint, complaint, {
    complaintNumber: `CR/${yr}/S${String(spec.complaintNo).padStart(2,'0')}`,
    complaintDate: day, complaintTime: spec.complaintTime,
    dateOfIncident: sampleDay(incidentDaysAgo), registered: true
  });
  const para = (fields, time) => { const p = addDiaryPara(c, fields); p.date = day; p.time = time; };

  if(spec.stage >= 2 && spec.bns){
    c.bns.sections = bnsPick(spec.bns);
    c.bns.confirmed = true;
    c.bns.autoIdentifyFor = c.complaint.crimeCategory + "|" + c.complaint.crimeSubCategory;
  }
  if(spec.stage >= 3){
    c.fir.registered = true; c.fir.number = spec.fir.number; c.fir.date = day; c.fir.time = spec.fir.time;
    c.fir.narrative = buildFirNarrative(c);
    c.firCopyGenerated = true; c.firCctnsCopied = !!spec.fir.number;
    c.status = "FIR Registered";
    para({ investigationStep:"Complaint received & FIR registered",
      actionTaken:`Complaint received from ${c.complaint.complainantName} regarding ${c.complaint.crimeSubCategory}. FIR registered under BNS section(s) ${c.bns.sections.map(s=>s.code).join(', ')}.`,
      result:"FIR registered", nextAction:"Copy the FIR text, upload to CCTNS, then enter the FIR number CCTNS assigns.", approved:true }, spec.fir.time);
  }
  if(spec.stage >= 4){
    Object.assign(c.io, spec.io, { assigned:true, date: day });
    c.status = "IO Assigned";
    para({ investigationStep:"Investigating Officer assigned", actionTaken:`${c.io.name} (${c.io.rank}) assigned as Investigating Officer.`,
      result:"IO assigned", nextAction:"Proceed to generate the GD entry.", approved:true }, spec.io.time);
  }
  if(spec.stage >= 5){
    Object.assign(c.gd, spec.gd, { generated:true, date: day });
    c.gdCctnsCopied = true;
    c.status = "GD Generated";
  }
  if(spec.stage >= 6){
    ensureFirStatementAutoFill(c);
    const f = c.firStatement.fields;
    Object.assign(f, spec.statement, { statementDate: day });
    c.firStatement.generated = true;
    c.status = "Registration Complete";
    para({ investigationStep:"FIR Writing Officer Statement recorded", actionTaken: firStatementPlainText(f),
      result:"FIR, GD and Statement recorded", nextAction:"Proceed with investigation steps.", approved:true }, spec.statement.statementTime);
    f.firstParchaDone = true;
  }
  return c;
}
/* Adds the sample cases, replacing any earlier copies. Newest first, like real cases. */
function loadSampleCases(){
  DB.order.filter(id=>DB.cases[id] && DB.cases[id].sample).forEach(id=>{ delete DB.cases[id]; });
  DB.order = DB.order.filter(id=>DB.cases[id]);
  const built = sampleCaseSpecs().map(buildSampleCase);
  built.slice().reverse().forEach(c=>{ DB.cases[c.id] = c; DB.order.unshift(c.id); });
  try{ localStorage.setItem(SAMPLE_FLAG_KEY, "1"); }catch(e){}
  saveDB();
}
async function loadSampleCasesFromUi(){
  const hasSamples = DB.order.some(id=>DB.cases[id].sample);
  if(hasSamples){
    const ok = await confirmDialog({ title:'Reset the sample cases?', body:'The six sample cases go back to how they started. Cases you registered are not touched.', confirmLabel:'Reset sample cases' });
    if(!ok) return;
  }
  loadSampleCases();
  UI.view = "list"; UI.caseId = DB.order[0] || null;
  render();
  toast(hasSamples ? "Sample cases reset." : "Six sample cases added.");
}
/* First run on this browser, with no cases yet: add the samples so there is something to check. */
(function seedSamplesOnFirstRun(){
  let seeded = false;
  try{ seeded = localStorage.getItem(SAMPLE_FLAG_KEY) === "1"; }catch(e){}
  if(!seeded && DB.order.length === 0){
    loadSampleCases();
    UI.view = "list"; UI.caseId = DB.order[0] || null;
  }
})();

/* ---------------- GLOBAL EVENTS ---------------- */
function wireGlobalEvents(){
  // category -> subcategory dependency in edit forms is already handled inline
}

render();
</script>
