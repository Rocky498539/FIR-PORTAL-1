.case-line--muted{margin-top:var(--axial-space-4); color:var(--axial-text-tertiary);}
.case-header-actions{display:flex; align-items:center; gap:var(--axial-space-8); flex-shrink:0;}
.meta-grid{display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:var(--axial-space-16); margin:var(--axial-space-20) 0 0; padding-top:var(--axial-space-20); border-top:var(--axial-stroke-thin) solid var(--axial-border-subtle);}
.meta-grid dt{font-size:var(--axial-font-size-12); font-weight:var(--axial-font-weight-regular); line-height:var(--axial-line-height-normal); color:var(--axial-text-tertiary); margin-bottom:var(--axial-space-4);}
.meta-grid dd{margin:0; font-size:var(--axial-font-size-14); font-weight:var(--axial-font-weight-medium); line-height:var(--axial-line-height-normal); color:var(--axial-text-primary); overflow-wrap:anywhere;}
.meta-grid dd.cell-muted{font-weight:var(--axial-font-weight-regular); color:var(--axial-text-tertiary);}

.next-card{display:flex; align-items:center; justify-content:space-between; gap:var(--axial-space-16); padding:var(--axial-space-16) var(--axial-space-20); background:var(--axial-background-primary);
  border:var(--axial-stroke-thin) solid var(--axial-border-subtle); border-left:var(--axial-stroke-medium) solid var(--axial-interactive-accent); border-radius:var(--axial-radius-lg); box-shadow:var(--axial-elevation-1);}
.next-card-label{font-size:var(--axial-font-size-12); font-weight:var(--axial-font-weight-medium); line-height:var(--axial-line-height-normal); color:var(--axial-text-accent);}
.next-card-text{font-size:var(--axial-font-size-16); font-weight:var(--axial-font-weight-medium); line-height:var(--axial-line-height-normal); color:var(--axial-text-primary); margin-top:var(--axial-space-4);}

.section-card{background:var(--axial-background-primary); border:var(--axial-stroke-thin) solid var(--axial-border-subtle); border-radius:var(--axial-radius-lg); box-shadow:var(--axial-elevation-1);}
.section-card-head{display:flex; align-items:center; justify-content:space-between; gap:var(--axial-space-12); padding:var(--axial-space-16) var(--axial-space-20); border-bottom:var(--axial-stroke-thin) solid var(--axial-border-subtle);}
.section-card-title{margin:0; font-size:var(--axial-font-size-16); font-weight:var(--axial-font-weight-medium); line-height:var(--axial-line-height-normal); color:var(--axial-text-primary);}
.section-card-body{padding:var(--axial-space-8) var(--axial-space-20) var(--axial-space-16);}
.progress-steps{list-style:none; margin:0; padding:0;}
.progress-step{display:grid; grid-template-columns:24px minmax(0,1fr) auto; gap:var(--axial-space-12); align-items:center; padding:var(--axial-space-12) 0; border-top:var(--axial-stroke-thin) solid var(--axial-border-subtle);}
.progress-step:first-child{border-top:none;}
.progress-icon{width:24px; height:24px; border-radius:var(--axial-radius-full); display:flex; align-items:center; justify-content:center; background:var(--axial-surface-neutral-subtle); color:var(--axial-icon-default);}
.progress-icon .ms{font-size:var(--axial-font-size-16);}
.progress-step.is-done .progress-icon{background:var(--axial-feedback-success-bg); color:var(--axial-feedback-success);}
.progress-step.is-next .progress-icon{background:var(--axial-interactive-accent-subtle); color:var(--axial-text-accent);}
.progress-name{font-size:var(--axial-font-size-14); font-weight:var(--axial-font-weight-medium); line-height:var(--axial-line-height-normal); color:var(--axial-text-primary);}
.progress-detail{font-size:var(--axial-font-size-12); font-weight:var(--axial-font-weight-regular); line-height:var(--axial-line-height-normal); color:var(--axial-text-tertiary);}
.progress-step:not(.is-done):not(.is-next) .progress-name{color:var(--axial-text-secondary);}
/* Row action, Button Type=Text, Small */
.progress-go{border:none; background:transparent; color:var(--axial-text-primary); font-size:var(--axial-font-size-12); font-weight:var(--axial-font-weight-medium); line-height:var(--axial-line-height-normal); cursor:pointer; height:33px; padding:var(--axial-space-8) var(--axial-space-12);
  border-radius:var(--axial-radius-md); display:inline-flex; align-items:center; gap:var(--axial-space-4);}
.progress-go .ms{font-size:var(--axial-font-size-16); color:var(--axial-icon-default);}
.progress-go:hover{background:var(--axial-background-hover);}
.progress-go:active{background:var(--axial-background-selected);}

.complete-card{background:var(--axial-background-primary); border:var(--axial-stroke-thin) solid var(--axial-border-subtle); border-radius:var(--axial-radius-lg); box-shadow:var(--axial-elevation-1); overflow:hidden;}
.complete-head{display:flex; align-items:center; gap:var(--axial-space-16); padding:var(--axial-space-20) var(--axial-space-24); background:var(--axial-feedback-success-bg); border-bottom:var(--axial-stroke-thin) solid var(--axial-border-subtle);}
.complete-badge{width:40px; height:40px; border-radius:var(--axial-radius-full); background:var(--axial-background-primary); border:none; color:var(--axial-feedback-success); display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.complete-kicker{font-size:var(--axial-font-size-12); font-weight:var(--axial-font-weight-medium); line-height:var(--axial-line-height-normal); color:var(--axial-text-primary);}
.complete-title{margin:0; font-size:var(--axial-font-size-18); font-weight:var(--axial-font-weight-medium); line-height:var(--axial-line-height-normal); color:var(--axial-text-primary);}
.complete-body{display:grid; grid-template-columns:minmax(0,1.3fr) minmax(0,1fr); gap:var(--axial-space-24); padding:var(--axial-space-20) var(--axial-space-24);}
.complete-list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:var(--axial-space-8); font-size:var(--axial-font-size-14); font-weight:var(--axial-font-weight-regular); line-height:var(--axial-line-height-relaxed); color:var(--axial-text-primary);}
.complete-list li{display:flex; align-items:flex-start; gap:var(--axial-space-8);}
.complete-list .ms{color:var(--axial-feedback-success);}
.complete-aside{padding:var(--axial-space-16); background:var(--axial-background-subtle); border:var(--axial-stroke-thin) solid var(--axial-border-subtle); border-radius:var(--axial-radius-md);}
.complete-aside-label{font-size:var(--axial-font-size-12); font-weight:var(--axial-font-weight-regular); line-height:var(--axial-line-height-normal); color:var(--axial-text-tertiary);}
.complete-aside-value{margin-top:var(--axial-space-4); font-size:var(--axial-font-size-14); font-weight:var(--axial-font-weight-medium); line-height:var(--axial-line-height-normal); color:var(--axial-text-primary);}
.complete-actions{display:flex; justify-content:flex-end; gap:var(--axial-space-8); padding:var(--axial-space-16) var(--axial-space-24); border-top:var(--axial-stroke-thin) solid var(--axial-border-subtle); background:var(--axial-surface-brand-subtle);}

.case-actions{display:flex; align-items:center; justify-content:space-between; gap:var(--axial-space-12); padding:var(--axial-space-16) 0 0; margin-top:var(--axial-space-8); border-top:var(--axial-stroke-thin) solid var(--axial-border-subtle); font-size:var(--axial-font-size-14); font-weight:var(--axial-font-weight-regular); line-height:var(--axial-line-height-relaxed); color:var(--axial-text-secondary);}

/* ---------------- Forms ---------------- */
.form-surface{background:var(--axial-background-primary); border:var(--axial-stroke-thin) solid var(--axial-border-subtle); border-radius:var(--axial-radius-lg); box-shadow:var(--axial-elevation-1);}
.form-section{display:grid; grid-template-columns:minmax(0,220px) minmax(0,1fr); gap:var(--axial-space-24); padding:var(--axial-space-24); border-top:var(--axial-stroke-thin) solid var(--axial-border-subtle);}
.form-section:first-of-type{border-top:none;}
.form-section-head{display:flex; gap:var(--axial-space-12); align-items:baseline;}
.form-section-no{font-size:var(--axial-font-size-12); font-weight:var(--axial-font-weight-medium); line-height:var(--axial-line-height-normal); color:var(--axial-text-tertiary); font-variant-numeric:tabular-nums; min-width:16px;}
.form-section-title{margin:0; font-size:var(--axial-font-size-16); font-weight:var(--axial-font-weight-medium); line-height:var(--axial-line-height-normal); color:var(--axial-text-primary);}
.form-section-desc{margin:var(--axial-space-4) 0 0; font-size:var(--axial-font-size-14); font-weight:var(--axial-font-weight-regular); line-height:var(--axial-line-height-relaxed); color:var(--axial-text-secondary);}
.form-section-fields{display:flex; flex-direction:column; gap:var(--axial-space-16); min-width:0;}
.form-grid{display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:var(--axial-space-16);}
.form-grid .span-2{grid-column:1 / -1;}
/* Chip S Tag, warning */
.confirm-tag{display:inline-flex; align-items:center; gap:var(--axial-space-4); margin-top:var(--axial-space-8); height:24px; padding:var(--axial-space-4) var(--axial-space-8); border:none;
  border-radius:var(--axial-radius-sm); background:var(--axial-feedback-warning-bg); font-size:var(--axial-font-size-12); font-weight:var(--axial-font-weight-medium); line-height:var(--axial-line-height-normal); color:var(--axial-text-primary);}
.confirm-tag .ms{font-size:var(--axial-font-size-16); color:var(--axial-feedback-warning);}
.sticky-actions{position:sticky; bottom:0; z-index:6; display:flex; align-items:center; justify-content:space-between; gap:var(--axial-space-12); padding:var(--axial-space-16) var(--axial-space-24);
  background:var(--axial-background-primary); border-top:var(--axial-stroke-thin) solid var(--axial-border-subtle); border-radius:0 0 var(--axial-radius-lg) var(--axial-radius-lg);}
.sticky-actions .caption{color:var(--axial-text-secondary);}
.sticky-actions-right{display:flex; gap:var(--axial-space-8); margin-left:auto;}

/* Narration: fields sit on background/primary, so the panel is outlined rather than tinted */
.narration{margin:var(--axial-space-24) var(--axial-space-24) 0; padding:var(--axial-space-20); border:var(--axial-stroke-thin) solid var(--axial-border-subtle); border-radius:var(--axial-radius-lg); background:var(--axial-background-primary);}
.narration-head{display:flex; align-items:flex-start; justify-content:space-between; gap:var(--axial-space-12); margin-bottom:var(--axial-space-12);}
.narration-title{margin:0; font-size:var(--axial-font-size-16); font-weight:var(--axial-font-weight-medium); line-height:var(--axial-line-height-normal); color:var(--axial-text-primary);}
.narration-sub{margin:var(--axial-space-4) 0 0; font-size:var(--axial-font-size-14); font-weight:var(--axial-font-weight-regular); line-height:var(--axial-line-height-relaxed); color:var(--axial-text-secondary);}
.narration .axial-textarea{min-height:120px;}
.narration-foot{display:flex; align-items:center; justify-content:space-between; gap:var(--axial-space-12); margin-top:var(--axial-space-12); flex-wrap:wrap;}
.narration-status{display:inline-flex; align-items:center; gap:var(--axial-space-8); font-size:var(--axial-font-size-12); font-weight:var(--axial-font-weight-medium); line-height:var(--axial-line-height-normal); color:var(--axial-text-primary);}
.narration-status:empty{display:none;}
.narration-status .ms{font-size:var(--axial-font-size-16); color:var(--axial-feedback-success);}

/* ---------------- Split screens (form + document) ---------------- */
.split{display:grid; grid-template-columns:minmax(0,1.3fr) minmax(0,1fr); gap:var(--axial-space-32); align-items:start;}
.split-main{display:flex; flex-direction:column; gap:var(--axial-space-16); min-width:0;}
.split-doc{position:sticky; top:calc(var(--axial-space-64) + var(--axial-space-20)); min-width:0;}
.doc-head{display:flex; align-items:center; justify-content:space-between; gap:var(--axial-space-12); margin-bottom:var(--axial-space-12); min-height:33px;}
.doc-head-title{font-size:var(--axial-font-size-12); font-weight:var(--axial-font-weight-medium); line-height:var(--axial-line-height-normal); color:var(--axial-text-secondary); display:flex; align-items:center; gap:var(--axial-space-8);}
.doc-head-title .ms{font-size:var(--axial-font-size-16); color:var(--axial-icon-default);}
.doc-toolbar{gap:var(--axial-space-8);}
/* The page is the document itself, the user's content, drawn in Axial type */
.doc-page{background:var(--axial-background-primary); border:var(--axial-stroke-thin) solid var(--axial-border-subtle); border-radius:var(--axial-radius-sm); box-shadow:var(--axial-elevation-2);
  padding:var(--axial-space-40) var(--axial-space-48); max-height:calc(100vh - 150px); font-family:var(--axial-font-family);}
.doc-pre{font-size:var(--axial-font-size-14); font-weight:var(--axial-font-weight-regular); line-height:var(--axial-line-height-relaxed); color:var(--axial-text-primary);}
.doc-title{font-size:var(--axial-font-size-20); font-weight:var(--axial-font-weight-semibold); line-height:var(--axial-line-height-normal); text-transform:none; letter-spacing:0;}
.fir-doc-title{font-size:var(--axial-font-size-20); font-weight:var(--axial-font-weight-semibold); line-height:var(--axial-line-height-normal); letter-spacing:0;}
.fir-doc-sub{font-size:var(--axial-font-size-12); font-weight:var(--axial-font-weight-regular); line-height:var(--axial-line-height-normal);}
.fir-sec{padding:var(--axial-space-12) 0;}
.fir-doc, .fir-rows{font-size:var(--axial-font-size-14); font-weight:var(--axial-font-weight-regular); line-height:var(--axial-line-height-relaxed);}
.stmt-var{background:var(--axial-interactive-accent-subtle); color:var(--axial-text-accent);}

.task-card{background:var(--axial-background-primary); border:var(--axial-stroke-thin) solid var(--axial-border-subtle); border-radius:var(--axial-radius-lg); box-shadow:var(--axial-elevation-1); overflow:hidden;}
.task-head{display:flex; align-items:flex-start; justify-content:space-between; gap:var(--axial-space-12); padding:var(--axial-space-20) var(--axial-space-24) var(--axial-space-16);}
.task-title{margin:0; font-size:var(--axial-font-size-18); font-weight:var(--axial-font-weight-medium); line-height:var(--axial-line-height-normal); color:var(--axial-text-primary);}
.task-sub{margin:var(--axial-space-4) 0 0; font-size:var(--axial-font-size-14); font-weight:var(--axial-font-weight-regular); line-height:var(--axial-line-height-relaxed); color:var(--axial-text-secondary);}
.task-steps{list-style:none; margin:0; padding:var(--axial-space-4) var(--axial-space-24) var(--axial-space-8);}
.task-step{position:relative; display:grid; grid-template-columns:28px minmax(0,1fr); gap:var(--axial-space-16); padding:var(--axial-space-16) 0 var(--axial-space-20);}
.task-step + .task-step{border-top:var(--axial-stroke-thin) solid var(--axial-border-subtle);}
.task-mark{width:28px; height:28px; border-radius:var(--axial-radius-full); display:flex; align-items:center; justify-content:center; font-size:var(--axial-font-size-12); font-weight:var(--axial-font-weight-medium); line-height:var(--axial-line-height-normal); background:var(--axial-surface-neutral-subtle); color:var(--axial-text-secondary); border:none;}
.task-mark .ms{font-size:var(--axial-font-size-16);}
.task-step.is-current .task-mark{background:var(--axial-interactive-primary); color:var(--axial-text-on-primary); box-shadow:none;}
.task-step.is-done .task-mark{background:var(--axial-feedback-success-bg); color:var(--axial-feedback-success);}
.task-step-title{font-size:var(--axial-font-size-14); font-weight:var(--axial-font-weight-medium); line-height:var(--axial-line-height-normal); color:var(--axial-text-primary); padding-top:var(--axial-space-4);}
.task-step:not(.is-current):not(.is-done) .task-step-title{color:var(--axial-text-secondary);}
.task-step-text{margin:0 0 var(--axial-space-12); font-size:var(--axial-font-size-14); font-weight:var(--axial-font-weight-regular); line-height:var(--axial-line-height-relaxed); color:var(--axial-text-secondary);}
.task-ok{display:flex; align-items:center; gap:var(--axial-space-8); margin:0 0 var(--axial-space-12); font-size:var(--axial-font-size-12); font-weight:var(--axial-font-weight-medium); line-height:var(--axial-line-height-normal); color:var(--axial-text-primary);}
.task-ok[hidden]{display:none;}
.task-ok .ms{font-size:var(--axial-font-size-16); color:var(--axial-feedback-success);}
.task-step-body{min-width:0;}
.task-step-body .axial-input, .task-step-body .field{max-width:340px;}
.task-foot{display:flex; align-items:center; justify-content:space-between; gap:var(--axial-space-12); padding:var(--axial-space-16) var(--axial-space-24); border-top:var(--axial-stroke-thin) solid var(--axial-border-subtle); background:var(--axial-surface-brand-subtle);}
.task-foot .caption{color:var(--axial-text-secondary);}

.quiet-panel{background:var(--axial-background-primary); border:var(--axial-stroke-thin) solid var(--axial-border-subtle); border-radius:var(--axial-radius-lg);}
.quiet-panel-head{display:flex; align-items:center; justify-content:space-between; gap:var(--axial-space-12); padding:var(--axial-space-16) var(--axial-space-20) 0;}
.quiet-panel-title{margin:0; font-size:var(--axial-font-size-16); font-weight:var(--axial-font-weight-medium); line-height:var(--axial-line-height-normal); color:var(--axial-text-primary);}
.quiet-panel-body{padding:var(--axial-space-12) var(--axial-space-20) var(--axial-space-20);}
.fir-summary-dl{font-size:var(--axial-font-size-14); font-weight:var(--axial-font-weight-regular); line-height:var(--axial-line-height-relaxed); line-height:var(--axial-line-height-normal); grid-template-columns:minmax(0,176px) minmax(0,1fr); gap:var(--axial-space-8) var(--axial-space-16);}
.fir-summary-dl dt{color:var(--axial-text-secondary);}
.fir-summary-title{font-size:var(--axial-font-size-12); font-weight:var(--axial-font-weight-medium); line-height:var(--axial-line-height-normal); color:var(--axial-text-tertiary);}
/* Chip S Tag, warning, "Not recorded" */
.fir-missing{display:inline-flex; align-items:center; gap:var(--axial-space-4); height:24px; padding:var(--axial-space-4) var(--axial-space-8); border:none; border-radius:var(--axial-radius-sm);
  background:var(--axial-feedback-warning-bg); font-size:var(--axial-font-size-12); font-weight:var(--axial-font-weight-medium); line-height:var(--axial-line-height-normal); color:var(--axial-text-primary); white-space:nowrap;}
.fir-missing .ms{font-size:var(--axial-font-size-16); color:var(--axial-feedback-warning);}
.missing-summary{padding:var(--axial-space-16); border:none; background:var(--axial-feedback-warning-bg); border-radius:var(--axial-radius-md);}
.missing-summary.is-error{background:var(--axial-feedback-error-bg);}
.missing-summary-title{display:flex; align-items:center; gap:var(--axial-space-8); font-size:var(--axial-font-size-14); font-weight:var(--axial-font-weight-medium); line-height:var(--axial-line-height-normal); color:var(--axial-text-primary);}
.missing-summary-title .ms{color:var(--axial-feedback-warning);}
.missing-summary.is-error .missing-summary-title .ms{color:var(--axial-feedback-error);}
.missing-list{display:flex; flex-wrap:wrap; gap:var(--axial-space-8); margin:var(--axial-space-12) 0 0; padding:0; list-style:none;}
/* Chip S, outlined, jumps to the field */
.missing-list button{height:24px; padding:var(--axial-space-4) var(--axial-space-8); border-radius:var(--axial-radius-sm); border:var(--axial-stroke-thin) solid var(--axial-border-default);
  background:var(--axial-background-primary); font-size:var(--axial-font-size-12); font-weight:var(--axial-font-weight-medium); line-height:var(--axial-line-height-normal); color:var(--axial-text-primary); cursor:pointer;}
.missing-list button:hover{border-color:var(--axial-border-medium);}
.missing-list button:active{background:var(--axial-background-selected);}

/* Sections list (BNS) */
.sec-list{list-style:none; margin:0; padding:0;}
.sec-row{display:grid; grid-template-columns:minmax(0,110px) minmax(0,1fr) auto; gap:var(--axial-space-16); align-items:start; padding:var(--axial-space-16) var(--axial-space-20); border-top:var(--axial-stroke-thin) solid var(--axial-border-subtle);}
.sec-row:first-child{border-top:none;}
.sec-code{font-size:var(--axial-font-size-14); font-weight:var(--axial-font-weight-medium); line-height:var(--axial-line-height-normal); color:var(--axial-text-primary); font-variant-numeric:tabular-nums;}
.sec-title{font-size:var(--axial-font-size-14); font-weight:var(--axial-font-weight-medium); line-height:var(--axial-line-height-normal); color:var(--axial-text-primary); display:flex; align-items:center; gap:var(--axial-space-8); flex-wrap:wrap;}
.sec-desc{margin-top:var(--axial-space-4); font-size:var(--axial-font-size-14); font-weight:var(--axial-font-weight-regular); line-height:var(--axial-line-height-relaxed); color:var(--axial-text-secondary);}
.sec-empty{padding:var(--axial-space-16) var(--axial-space-20); font-size:var(--axial-font-size-14); font-weight:var(--axial-font-weight-regular); line-height:var(--axial-line-height-relaxed); color:var(--axial-text-secondary);}
.add-panel{border-top:var(--axial-stroke-thin) solid var(--axial-border-subtle); padding:var(--axial-space-16) var(--axial-space-20) var(--axial-space-20); background:var(--axial-background-primary); border-radius:0 0 var(--axial-radius-lg) var(--axial-radius-lg);}
.add-toggle{display:flex; padding:var(--axial-space-8) var(--axial-space-12); border-top:var(--axial-stroke-thin) solid var(--axial-border-subtle);}
.action-bar{display:flex; align-items:center; justify-content:space-between; gap:var(--axial-space-12); padding:var(--axial-space-16) var(--axial-space-20); background:var(--axial-background-primary);
  border:var(--axial-stroke-thin) solid var(--axial-border-subtle); border-radius:var(--axial-radius-lg); box-shadow:var(--axial-elevation-1);}
.action-bar-status{display:inline-flex; align-items:center; gap:var(--axial-space-8); font-size:var(--axial-font-size-14); font-weight:var(--axial-font-weight-medium); line-height:var(--axial-line-height-normal); color:var(--axial-text-primary);}
.action-bar-status .ms{color:var(--axial-feedback-success);}
.action-bar-status.is-muted{font-size:var(--axial-font-size-14); font-weight:var(--axial-font-weight-regular); line-height:var(--axial-line-height-relaxed); color:var(--axial-text-secondary);}
.bns-results .check-item{border-radius:var(--axial-radius-md);}

/* Read-only auto-filled values */

/* ============================================================
   Case Management System, police case registration (Axial)

/* ---------------- DOMAIN DATA ---------------- */

const CRIME_TAXONOMY = {

const BNS_LIBRARY = [

  {code:"103(1)", title:"Murder", desc:"Culpable homicide amounting to murder.", tags:["Murder"]},
  {code:"103(2)", title:"Murder by group of five or more", desc:"Murder committed by five or more persons acting in concert on specified grounds.", tags:["Murder"]},
  {code:"105", title:"Culpable homicide not amounting to murder", desc:"Causing death without the intention/knowledge required for murder.", tags:["Murder","Attempt to Murder"]},
  {code:"109", title:"Attempt to murder", desc:"Doing an act with the intention or knowledge to cause death, under circumstances that if death were caused it would amount to murder.", tags:["Attempt to Murder"]},
  {code:"110", title:"Attempt to commit culpable homicide", desc:"Act done with intent/knowledge likely to cause death, not amounting to murder.", tags:["Attempt to Murder","Assault"]},

  {code:"3(5)", title:"Common intention", desc:"Where a criminal act is done by several persons in furtherance of the common intention of all, each is liable as if the act were done by them alone. Often invoked alongside murder/robbery charges.", tags:["Murder","Robbery"]},

  {code:"117", title:"Voluntarily causing grievous hurt", desc:"Voluntarily causing hurt that falls within the grievous-hurt definition.", tags:["Assault"]},
  {code:"131", title:"Assault or criminal force (punishment)", desc:"Punishment for assault or use of criminal force otherwise than on grave provocation.", tags:["Assault"]},
  {code:"132", title:"Assault or criminal force to deter public servant", desc:"Assault/force used against a public servant discharging duty.", tags:["Assault"]},
  {code:"133", title:"Assault or criminal force with intent to dishonour", desc:"Assault or use of force otherwise than on grave provocation, intending to dishonour.", tags:["Assault"]},

/* ---------------- LOCAL CRIME CLASSIFICATION & BNS ENGINE ----------------
   Published pages run in a sandboxed context that only allows network requests to a
   handful of script CDNs, calls to api.anthropic.com are silently blocked there, which
   made "identify crime type" / "identify BNS sections" fail with no clear reason. Both
   now run on a deterministic, fully local engine so they always work, with an optional
   best-effort AI call attempted first only where it can gracefully fall back. */
const CRIME_KEYWORDS = {
  "Theft": ["theft","thief","stolen","stole","steal","missing valuables","pickpocket","taken from my","taken from his","taken from her","was gone","went missing","noticed it was missing"],
  "Snatching": ["snatch","grabbed","yanked","pulled the chain","pulled her chain","pulled his chain","gold chain","from her neck","from his neck","from her hand","from his hand"],
  "Robbery": ["robbery","robbed","robbing","looted","dacoity","knife point","knifepoint","gunpoint","gun point","pistol","held up","threatened"],
  "Burglary": ["burglary","broke into","broken into","break-in","broke open","forced entry","broken lock","lock broken","broken window","shutter broken","broke the shutter","shutter was broken"],
  "House Breaking": ["house breaking","house-breaking","broke into the house","entered my house","trespass","intruder entered"],
  "Murder": ["murder","murdered","killed","dead body","homicide","stabbed to death","shot dead","found dead"],
  "Attempt to Murder": ["attempt to murder","attempted murder","tried to kill","stabbed but survived","shot but survived","attacked with intent to kill"],
  "Assault": ["assault","beaten","beat up","attacked","hit with","slapped","punched","assaulted","injured me"],
  "Kidnapping": ["kidnap","abduct","abducted","missing person","taken away forcibly","ransom","forcibly taken"],
  "Online Fraud": ["online fraud","upi fraud","otp fraud","fraudulent transaction","fake website","phishing","payment fraud","money transferred fraudulently","debited without","fake link","scam call","investment scam"],
  "Identity Theft": ["identity theft","impersonat","fake profile","fake account in my name","aadhaar misuse","pan misuse","someone is using my identity"],
  "Cyber Stalking": ["cyber stalking","stalking me online","harassing messages","threatening messages online","following me on social media","unwanted messages online","messaging me repeatedly"],
  "Account Hacking": ["account hacked","hacked my account","unauthorized access","password compromised","email hacked","social media hacked","account was hacked"]
};
const CLASSIFY_PRIORITY = ["Murder","Attempt to Murder","Kidnapping","Robbery","Burglary","House Breaking","Snatching","Assault",
  "Account Hacking","Identity Theft","Online Fraud","Cyber Stalking","Theft"];
/* Guess a crime category + sub-category from free text, purely by local keyword matching. */
function classifyCrimeFromText(text){
  const lower = (text||"").toLowerCase();
  if(!lower.trim()) return null;
  let best = null, bestScore = 0;
  Object.entries(CRIME_KEYWORDS).forEach(([sub, keywords])=>{
    let score = 0;
    keywords.forEach(k=>{ if(lower.includes(k)) score++; });
    // On a tie the more specific offence wins: a break-in where cash was stolen is burglary, not plain theft.
    const moreSpecific = best && CLASSIFY_PRIORITY.indexOf(sub) < CLASSIFY_PRIORITY.indexOf(best);
    if(score > bestScore || (score>0 && score===bestScore && moreSpecific)){ bestScore = score; best = sub; }
  });
  if(!best) return null;
  for(const [cat, subs] of Object.entries(CRIME_TAXONOMY)){
    if(subs.includes(best)) return { category: cat, subCategory: best };
  }
  return null;
}
/* Deterministic BNS lookup: every section tagged for the sub-category, plus any other
   section whose title/description shares a distinctive word with the incident description
   (catches things like a threat mentioned in an otherwise-theft case). No network call -
   this always works. */
function localIdentifyBnsSections(c){
  const sub = c.complaint.crimeSubCategory;
  const seen = new Set();
  const results = [];
  // House-breaking by day and by night are different sub-sections; when the time is known, suggest only the one that fits.
  const hh = parseInt(String(c.complaint.timeOfIncident||"").split(":")[0], 10);
  const skip = isNaN(hh) ? null : ((hh>=18 || hh<6) ? "331(2)" : "331(4)");
  BNS_LIBRARY.filter(s=>s.tags.includes(sub) && s.code!==skip).forEach(s=>{
    if(!seen.has(s.code)){ results.push(s); seen.add(s.code); }
  });
  const desc = (c.complaint.description||"").toLowerCase();
  if(desc){
    Object.entries(BNS_NARRATION_TRIGGERS).forEach(([code, phrases])=>{
      if(seen.has(code)) return;
      const s = BNS_LIBRARY.find(b=>b.code===code);
      if(s && phrases.some(ph=>desc.includes(ph))){ results.push(s); seen.add(code); }
    });
  }
  return results;
}
/* Sections the narration itself points to, whatever the sub-category. Matching every long word of
   every section's description used to pull murder, kidnapping and cheating into a phone snatching,
   because words like "persons" or "approximately" appear everywhere. These are explicit phrases,
   and they only ever add suggestions for the officer to review. */
const BNS_NARRATION_TRIGGERS = {
  "3(5)": ["two men","two persons","two unknown","two boys","three men","three persons","three unknown","accomplice","associates","along with his","along with her","gang of"],
  "115": ["hurt","injur","bruise","wound","bleeding","beat him","beat her","hit him","hit her","slapped","punched"],
  "117": ["fracture","grievous","broken bone","broke his arm","broke her arm","lost consciousness"],
  "351(1)-(4)": ["threatened","threat to kill","threatening to","dire consequences"],
  "305": ["from the house","from his house","from her house","from the shop","from his shop","from her shop","godown","warehouse","temple","idol"],
  "306": ["servant","domestic help","maid","his employee","her employee","the driver took","worker took"],
  "IT Act 66D": ["upi","otp","phishing","fake link","screen-sharing","screen sharing","kyc"],
  "334": ["almirah","locker was broken","safe was broken","broke open the","cash box","drawer was broken","box was broken"]
};
/* Local, regex/keyword-based fallback for "Fill details from narration" when the AI call
   isn't reachable, always produces at least the crime classification and description. */
function localExtractComplaintFields(text){
  const fields = { description: text.trim() };
  const cls = classifyCrimeFromText(text);
  if(cls){ fields.crimeCategory = cls.category; fields.crimeSubCategory = cls.subCategory; }
  const dateMatch = text.match(/\b(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})\b/);
  if(dateMatch){
    let [, d, m, y] = dateMatch;
    if(y.length===2) y = "20"+y;
    fields.dateOfIncident = `${y.padStart(4,"0")}-${m.padStart(2,"0")}-${d.padStart(2,"0")}`;
  } else {
    const MONTHS = {january:1,february:2,march:3,april:4,may:5,june:6,july:7,august:8,september:9,october:10,november:11,december:12,
      jan:1,feb:2,mar:3,apr:4,jun:6,jul:7,aug:8,sep:9,sept:9,oct:10,nov:11,dec:12};
    const monthNames = Object.keys(MONTHS).join("|");
    let dm = text.match(new RegExp(`\\b(\\d{1,2})(?:st|nd|rd|th)?\\s+(${monthNames})\\.?,?\\s*(\\d{4})?\\b`, "i"));
    let dayFirst = true;
    if(!dm){ dm = text.match(new RegExp(`\\b(${monthNames})\\.?\\s+(\\d{1,2})(?:st|nd|rd|th)?,?\\s*(\\d{4})?\\b`, "i")); dayFirst = false; }
    if(dm){
      const day = dayFirst ? dm[1] : dm[2];
      const monthWord = dayFirst ? dm[2] : dm[1];
      const year = dm[3] || String(new Date().getFullYear());
      const mm = MONTHS[monthWord.toLowerCase()];
      fields.dateOfIncident = `${year}-${String(mm).padStart(2,"0")}-${day.padStart(2,"0")}`;
    }
  }
  const timeMatch = text.match(/\b(\d{1,2}):(\d{2})\s*(am|pm|AM|PM)?\b/);
  if(timeMatch){
    let hh = parseInt(timeMatch[1],10);
    const mm = timeMatch[2];
    const ap = (timeMatch[3]||"").toLowerCase();
    if(ap==="pm" && hh<12) hh += 12;
    if(ap==="am" && hh===12) hh = 0;
    fields.timeOfIncident = String(hh).padStart(2,"0")+":"+mm;
  } else {
    const timeWord = text.match(/\b(\d{1,2})\s*(am|pm|AM|PM)\b/);
    if(timeWord){
      let hh = parseInt(timeWord[1],10);
      const ap = timeWord[2].toLowerCase();
      if(ap==="pm" && hh<12) hh += 12;
      if(ap==="am" && hh===12) hh = 0;
      fields.timeOfIncident = String(hh).padStart(2,"0")+":00";
    }
  }
  const mobileMatch = text.match(/\b[6-9]\d{9}\b/);
  if(mobileMatch) fields.mobile = mobileMatch[0];
  const ageMatch = text.match(/\b(\d{1,2})\s*(?:years old|yrs|year[- ]old|yo)\b/i) || text.match(/^[A-Z][A-Za-z.]*(?:\s+[A-Z][A-Za-z.]*){0,3},\s*(\d{1,2}),/);
  if(ageMatch) fields.age = ageMatch[1];
  // Complainant: the capitalised name the narration opens with, e.g. "Ramesh Kumar, 45, reported..." or "Ramesh Kumar S/O ..."
  const nameMatch = text.match(/^\s*(?:(?:Shri|Smt\.?|Sri|Mr\.?|Mrs\.?|Ms\.?|Km\.?)\s+)?([A-Z][a-z]+(?:\s+[A-Z][a-z]+){0,3})(?=\s*(?:,|\s+(?:S\/O|D\/O|W\/O|son of|daughter of|wife of|aged|reported|complained|stated|informed|says|said)\b))/);
  if(nameMatch && !/^(Yesterday|Today|Tonight|Last|On|At|In|The|This|That|My|Our|His|Her|Sir|Madam|Respected|Dear|Around|About|During|While|When|Complainant|Informant)\b/i.test(nameMatch[1])) fields.complainantName = nameMatch[1];
  const rel = text.match(/\b(S\/O|D\/O|W\/O|son of|daughter of|wife of)\s+(?:(?:Shri|Late|Sri|Mr\.?)\s+)?([A-Z][a-z]+(?:\s+[A-Z][a-z]+){0,3})/);
  if(rel){
    fields.guardianName = rel[2];
    const r = rel[1].toLowerCase();
    fields.gender = (r==='s/o' || r==='son of') ? 'Male' : 'Female';
  } else if(/^\s*(?:Smt\.?|Mrs\.?|Ms\.?|Km\.?)\s/i.test(text)){ fields.gender = 'Female'; }
  else if(/^\s*(?:Shri|Mr\.?)\s/i.test(text)){ fields.gender = 'Male'; }
  // Place: a named road, market, nagar, colony etc. mentioned with on/at/near/in
  const placeMatch = text.match(/\b(?:on|at|near|in|outside)\s+((?:the\s+)?(?:[A-Z0-9][\w.\-\/]*\s+){0,4}(?:Road|Marg|Market|Bazaar|Bazar|Chowk|Crossing|Nagar|Colony|Mandi|Station|Stand|Park|Street|Gali|Lane|Sector\s+\d+))\b/);
  if(placeMatch) fields.placeOfIncident = placeMatch[1].replace(/^the\s+/i,'');
  return fields;
}

    <p class="auth-sub"><span>${t('Sent to')} <strong>+91 ${esc(formatMobile(LOGIN.mobile))}</strong></span>
      <button type="button" class="auth-link" onclick="changeLoginNumber()">${t('Change number')}</button></p>
    <form class="auth-fields" novalidate onsubmit="return verifyLoginCode(event)">
      <fieldset class="otp-fieldset${err?' field-error':''}">
        <legend>${t('6-digit code')}</legend>
        <div class="otp">
          ${[0,1,2,3,4,5].map(i=>`<input class="otp-box" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="${i===0?'one-time-code':'off'}"
            aria-label="Digit ${i+1} of 6" data-i="${i}" oninput="onOtpInput(this)" onkeydown="onOtpKey(event)" onpaste="onOtpPaste(event)" onfocus="this.select()">`).join('')}
        </div>
        <div id="otp-msg" class="field-message" aria-live="polite">${err ? ic('error')+'<span>'+esc(t(err))+'</span>' : ''}</div>
      </fieldset>
      <button type="button" data-submit onclick="submitFormFrom(this)" id="login-verify" class="axial-btn axial-btn--primary axial-btn--lg axial-btn--full" disabled>${t('Log in')}</button>
    </form>
    <p class="auth-resend" id="login-resend" aria-live="polite">${resendHtml()}</p>`;
}
function resendHtml(){
  const secs = Math.max(0, Math.ceil((LOGIN.resendAt - Date.now())/1000));
  if(secs>0) return `${t('Resend code in')} 0:${String(secs).padStart(2,'0')}`;
  return `<button type="button" class="auth-link" onclick="resendLoginCode()">${t('Resend code')}</button>`;
}
function startResendTimer(){
  clearInterval(LOGIN.timer);
  LOGIN.timer = setInterval(()=>{
    const el = document.getElementById('login-resend');
    if(!el || LOGIN.step!=='code'){ clearInterval(LOGIN.timer); return; }
    const html = resendHtml();
    if(el.innerHTML !== html){ el.innerHTML = html; applyTranslations(el); }
    if(LOGIN.resendAt <= Date.now()) clearInterval(LOGIN.timer);
  }, 1000);
}
/* Called after the login screen renders: put focus where the officer needs it next. */
function afterLoginRender(){
  LOGIN.flowPlayed = true;   // later re-renders (errors, next step, language) show the finished flow instead of replaying it
  if(LOGIN.step==='code'){
    startResendTimer();
    if(LOGIN.focus==='otp'){ const first = document.querySelector('.otp-box'); if(first) first.focus(); }
  } else if(LOGIN.focus==='mobile' && !(LOGIN.firstPaint && matchMedia('(pointer: coarse)').matches)){
    // On a phone, don't raise the keyboard before the officer has seen the screen
    const m = document.getElementById('login-mobile');
    if(m){ m.focus(); m.setSelectionRange(m.value.length, m.value.length); }
  }
  LOGIN.focus = null;
  LOGIN.firstPaint = false;
}
function onLoginMobileInput(el){
  const digits = el.value.replace(/\D/g,'').slice(0,10);
  if(el.value !== digits) el.value = digits;
  LOGIN.mobile = digits;
  if(LOGIN.error){
    LOGIN.error = null;
    el.removeAttribute('aria-invalid');
    el.closest('.field').classList.remove('field-error');
    document.getElementById('login-mobile-msg').innerHTML = '';
  }
}
function sendLoginCode(ev){
  ev.preventDefault();
  if(LOGIN.sending) return false;
  if(!/^[6-9]\d{9}$/.test(LOGIN.mobile)){
    LOGIN.error = LOGIN.mobile ? 'Enter a 10-digit mobile number starting with 6, 7, 8 or 9.' : 'Enter your mobile number.';
    LOGIN.focus = 'mobile';
    render();
    return false;
  }
  LOGIN.error = null; LOGIN.sending = true; render();
  setTimeout(()=>{
    LOGIN.sending = false; LOGIN.step = 'code'; LOGIN.focus = 'otp';
    LOGIN.resendAt = Date.now() + 30000;
    render();
    toast('Code sent.');
  }, 600);
  return false;
}
function changeLoginNumber(){
  clearInterval(LOGIN.timer);
  LOGIN.step = 'mobile'; LOGIN.error = null; LOGIN.focus = 'mobile';
  render();
}
function resendLoginCode(){
  LOGIN.resendAt = Date.now() + 30000; LOGIN.error = null; LOGIN.focus = 'otp';
  render();
  toast('A new code has been sent.');
}
function otpBoxes(){ return Array.from(document.querySelectorAll('.otp-box')); }
function otpValue(){ return otpBoxes().map(b=>b.value).join(''); }
function syncOtpState(){
  const btn = document.getElementById('login-verify');
  if(btn) btn.disabled = otpValue().length !== 6;
  if(LOGIN.error){
    LOGIN.error = null;
    const fs = document.querySelector('.otp-fieldset'); if(fs) fs.classList.remove('field-error');
    const msg = document.getElementById('otp-msg'); if(msg) msg.innerHTML = '';
  }
}
function fillOtpFrom(startIndex, digits){
  const boxes = otpBoxes();
  let i = startIndex;
  for(const d of digits){ if(i>=boxes.length) break; boxes[i].value = d; i++; }
  (boxes[Math.min(i, boxes.length-1)]).focus();
  syncOtpState();
}
function onOtpInput(el){
  const digits = el.value.replace(/\D/g,'');
  const i = Number(el.dataset.i);
  if(digits.length > 1){ el.value = ''; fillOtpFrom(i, digits); return; }   // autofill drops the whole code into one box
  el.value = digits;
  if(digits && i < 5) otpBoxes()[i+1].focus();
  syncOtpState();
}
function onOtpKey(ev){
  const el = ev.target, i = Number(el.dataset.i), boxes = otpBoxes();
  if(ev.key==='Backspace' && !el.value && i>0){ ev.preventDefault(); boxes[i-1].value=''; boxes[i-1].focus(); syncOtpState(); }
  else if(ev.key==='ArrowLeft' && i>0){ ev.preventDefault(); boxes[i-1].focus(); }
  else if(ev.key==='ArrowRight' && i<5){ ev.preventDefault(); boxes[i+1].focus(); }
}
function onOtpPaste(ev){
  const digits = (ev.clipboardData || window.clipboardData).getData('text').replace(/\D/g,'').slice(0,6);
  if(!digits) return;
  ev.preventDefault();
  fillOtpFrom(Number(ev.target.dataset.i), digits);
}
function verifyLoginCode(ev){
  ev.preventDefault();
  const code = otpValue();
  if(code.length !== 6){
    LOGIN.error = 'Enter all 6 digits of the code.'; LOGIN.focus = 'otp'; render();
    return false;
  }
  clearInterval(LOGIN.timer);
  LOGGED_IN_OFFICER = { mobile: LOGIN.mobile };
  UI.view = "list";
  try{ localStorage.setItem("axial_login", JSON.stringify(LOGGED_IN_OFFICER)); }catch(e){}
  SENIOR_OFFICER = { name: "", rank: "" };
  Object.assign(LOGIN, { step:'mobile', error:null, sending:false, resendAt:0, focus:'mobile' });
  render();
  return false;
}
async function logOut(){
  const ok = await confirmDialog({ title:'Log out?', body:"You'll need a new code to log back in.", confirmLabel:'Log out' });
  if(!ok) return;
  LOGGED_IN_OFFICER = null;
  SENIOR_OFFICER = { name:"", rank:"" };
  try{ localStorage.removeItem("axial_login"); }catch(e){}
  render();
}

function t(text){ return UI_LANG === "hi" ? (HI_DICT[text] || text) : text; }
/* Helpers for the dedicated Hindi document templates (FIR / GD / Statement). These build a
   full Hindi legal document using fixed Hindi boilerplate matching the officer-provided
   sample, with case data substituted in. Officer-typed free text (narration, property
   details) is inserted as-is, since we cannot reliably auto-translate arbitrary text. */
function hiDate(iso){
  if(!iso) return "_____";
  const parts = String(iso).split("-");
  if(parts.length!==3) return iso;
  const [y,m,d] = parts;
  return `${d}-${m}-${y}`;
}
function hiTimeStr(hm){ return hm ? `${hm} बजे` : "_____"; }
const HI_RELATIONSHIP = { "S/O":"पुत्र", "D/O":"पुत्री", "W/O":"पत्नी" };
function hiRelationship(rel){ return HI_RELATIONSHIP[rel] || "पुत्र/पुत्री"; }
function hiComplaintType(type){
  if(type==="Oral Information") return "मौखिक सूचना";
  if(type==="Other") return "सूचना";
  return "लिखित शिकायत";
}
/* Relationship and verb forms follow the complainant's recorded gender, even before the writer statement has been opened. */
function relFor(c){
  const g = c.complaint.gender;
  if(g==='Female') return c.firStatement.fields.relationship==='W/O' ? 'W/O' : 'D/O';
  if(g==='Male') return 'S/O';
  return c.firStatement.fields.relationship || 'S/O';
}
function hiSections(c){
  const secs = c.bns.sections.map(s=>s.code);
  const bns = secs.filter(x=>!/^it act/i.test(x)), it = secs.filter(x=>/^it act/i.test(x)).map(x=>x.replace(/^it act\s*/i,''));
  return [bns.length ? `भारतीय न्याय संहिता, 2023 की धारा ${bns.join(', ')}` : '', it.length ? `सूचना प्रौद्योगिकी अधिनियम, 2000 की धारा ${it.join(', ')}` : ''].filter(Boolean).join('; ') || '_____';
}
function hiCrimeCategory(cat){ return HI_DICT[cat] || cat || "_____"; }
function hiVal(v, fallback){ return (v && String(v).trim()!=="") ? v : (fallback!==undefined ? fallback : "_____"); }
/* Applies HI_DICT to the live DOM: exact-match text nodes, placeholders and titles only -
   never touches values the officer typed. */
function applyTranslations(root){
  root = root || document.getElementById("app");
  if(!root || UI_LANG !== "hi") return;
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode(node){
      // Generated legal documents (FIR/GD/Statement sheets) stay in English on purpose -
      // translating stray words inside them would corrupt formal document text.
      return (node.parentElement && node.parentElement.closest(".doc-page"))
        ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT;
    }
  });
  const edits = [];
  let node;
  while((node = walker.nextNode())){
    const trimmed = node.nodeValue.trim();
    if(trimmed && HI_DICT[trimmed]){ edits.push([node, trimmed, HI_DICT[trimmed]]); }
  }
  edits.forEach(([node, trimmed, translated])=>{ node.nodeValue = node.nodeValue.replace(trimmed, translated); });
  root.querySelectorAll("[placeholder]").forEach(el=>{
    if(el.closest(".doc-page")) return;
    const v = el.getAttribute("placeholder");
    if(v && HI_DICT[v]) el.setAttribute("placeholder", HI_DICT[v]);
  });
  root.querySelectorAll("[title]").forEach(el=>{
    if(el.closest(".doc-page")) return;
    const v = el.getAttribute("title");
    if(v && HI_DICT[v]) el.setAttribute("title", HI_DICT[v]);
  });
}

/* Material Symbols Rounded icon. aria-hidden, because every icon sits beside a text label or inside a labelled control. */
/* Inline SVG icons, no icon font, so nothing can render as a word when offline.
   24px grid, 1.8 stroke, round caps and joins, drawn in currentColor. Names match the ones used
   throughout the file, so every ic('…') call keeps working. */
/* Material Symbols Rounded, rendered from the embedded subset. A few names used in the markup are
   not Material names; they map to the Material glyph that means the same thing. */
const ICON_NAMES = { chevron_down:'expand_more', clipboard:'content_paste', clock:'schedule', dot:'fiber_manual_record', file_pen:'edit_document',
  form:'assignment', user:'person', trash:'delete', copy:'content_copy', file:'description', folder:'folder_open', plus:'add', chevron:'chevron_right',
  officer:'badge', language:'translate' };
function ic(name, extraClass){
  const glyph = ICON_NAMES[name] || name;
  return `<span class="ms${extraClass?' '+extraClass:''}" aria-hidden="true">${glyph}</span>`;
}
const BANNER_ICONS = { success:"check_circle", warning:"warning", error:"error", info:"info" };
function banner(kind, bodyHtml, extraStyle){
  return `<div class="status-banner status-banner--${kind}"${extraStyle?` style="${extraStyle}"`:''}>${ic(BANNER_ICONS[kind])}<div class="status-banner-body">${bodyHtml}</div></div>`;
}
/* One title for a case, used by the sidebar, top bar, case list, overview and FIR card so they never disagree. */
function caseTitle(c){
  if(c.fir.registered) return c.fir.number ? `${t('FIR')} ${esc(c.fir.number)}` : t('FIR number pending');
  return c.complaint.complainantName ? esc(c.complaint.complainantName) : t('Untitled complaint');
}
/* The station an officer registered their last case at, pre-fills the next complaint. */
function lastUsedStation(){
  for(const id of DB.order){ const c = DB.cases[id]; if(c && c.complaint.policeStation) return {policeStation:c.complaint.policeStation, district:c.complaint.district}; }
  return {policeStation:"", district:""};
}
function uid(prefix){ return prefix + "-" + Math.random().toString(36).slice(2,8) + Date.now().toString(36).slice(-4); }
function pad(n){ return n.toString().padStart(2,"0"); }
function nowDate(){ const d=new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function nowTime(){ const d=new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function fmtDate(s){ if(!s) return "Not recorded"; return s; }
function esc(s){ return (s===undefined||s===null) ? "" : String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

/* The canonical shape of a case. newCase() uses this to create fresh cases; ensureCaseShape()
   uses it to backfill any fields missing from cases that were saved by an earlier version of
   this app (e.g. before a tab like FIR Writing Officer Statement existed), without this,
   opening a newer tab on an older saved case would throw partway through rendering, which
   looks exactly like "the tab isn't clickable". Existing values are never touched, only
   genuinely missing keys are filled in. */
function defaultCaseShape(id){
  return {
    id,
    createdAt: new Date().toISOString(),
    complaint: {
      complaintNumber:"", complaintDate: nowDate(), complaintTime: nowTime(),
      policeStation:"", district:"",
      complainantName:"", guardianName:"", age:"", gender:"", mobile:"", address:"", idDetails:"",
      nationality:"Indian", occupation:"", idType:"", idNumber:"",
      placeOfIncident:"", dateOfIncident:"", timeOfIncident:"", description:"",
      crimeCategory:"", crimeSubCategory:"",
      registered:false
    },
    bns:{ sections:[], confirmed:false, autoIdentifyFor:"" },
    fir:{ registered:false, number:"", date:"", time:"", narrative:"" },
    firCopyGenerated:false, firCctnsCopied:false,
    gd:{ generated:false, number:"", date:"", time:"", seniorOfficer:"" },
    gdCctnsCopied:false,
    caseDiary:[],
    io:{ assigned:false, name:"", rank:"", serviceNumber:"", station:"", date:"", time:"" },
    sop:{ subcategoryLoaded:"", steps:[] },
    evidence:[],
    esakshya:[],
    firStatement:{
      fields:{
        complaintNumber:"", firNumber:"", policeStation:"", district:"", state:"", gdNumber:"", firDate:"", firTime:"",
        crimeCategory:"", crimeSubCategory:"", bnsSections:[],
        officerName:"", officerRank:"", officerServiceNumber:"", officerPosting:"",
        complainantName:"", relationship:"S/O", guardianName:"", complainantAge:"", complainantAddress:"",
        complaintDate:"", complaintTime:"", complaintType:"Written Complaint", briefDescription:"",
        propertyDetails:"", propertyValue:"",
        firRegDate:"", firRegTime:"", cctnsEntryCompleted:"Yes", firCopyProvided:"Yes",
        ioName:"", ioRank:"", ioAssignmentDate:"", ioAssignmentTime:"", initialDirection:"",
        recordedBy:"", recordedByRank:"", statementDate:"", statementTime:"", statementLocation:"", onOrdersOf:"",
        gdDate:"", gdTime:"",
        firstParchaDone:false
      },
      generated:false,
      autoFilled:false
    },
    status:"Complaint Registered",
    finalised:false
  };
}
/* Recursively fills in any keys missing from `target` using `defaults`, without ever
   overwriting a value that's already there. */
function fillDefaults(target, defaults){
  Object.keys(defaults).forEach(key=>{
    if(target[key] === undefined){
      target[key] = defaults[key];
    } else if(
      defaults[key] !== null && typeof defaults[key] === 'object' && !Array.isArray(defaults[key]) &&
      target[key] !== null && typeof target[key] === 'object' && !Array.isArray(target[key])
    ){
      fillDefaults(target[key], defaults[key]);
    }
  });
  return target;
}
function ensureCaseShape(c){ return fillDefaults(c, defaultCaseShape(c.id)); }

function newCase(){
  const id = uid("case");
  const c = defaultCaseShape(id);
  DB.cases[id]=c; DB.order.unshift(id); saveDB();
  return c;
}
function getCase(id){ return DB.cases[id]; }
function deleteCase(id){
  delete DB.cases[id];
  DB.order = DB.order.filter(x=>x!==id);
  if(UI.caseId===id){ UI.caseId = DB.order[0]||null; UI.view = UI.caseId? "case":"list"; }
  saveDB(); render();
}

function toast(msg){
  const wrap = document.getElementById("toast-wrap");
  wrap.innerHTML = "";   // one message at a time, so a run of actions never stacks over the document
  const el = document.createElement("div");
  el.className="toast"; el.setAttribute("role","status"); el.textContent = t(msg);
  wrap.appendChild(el);
  const ms = Math.min(6000, 2400 + msg.length*25);
  setTimeout(()=>{ el.style.opacity="0"; setTimeout(()=>el.remove(),200); }, ms);
}

function addDiaryPara(c, fields){
  const paraNo = c.caseDiary.length + 1;
  c.caseDiary.push(Object.assign({
    paraNo, date: nowDate(), time: nowTime(),
    place: c.complaint.policeStation || "Not recorded",
    officer: c.io.name || "Duty Officer",
    crimeCategory: c.complaint.crimeCategory, crimeSubCategory: c.complaint.crimeSubCategory,
    investigationStep:"", actionTaken:"", statement:"", evidenceCollected:"", documents:"", result:"", nextAction:"",
    approved:false
  }, fields));
  return c.caseDiary[c.caseDiary.length-1];
}

/* ---------------- COMPLETENESS ---------------- */
function computeCompleteness(c){
  const allStepsDone = c.sop.steps.length>0 && c.sop.steps.every(s=> s.status==="Completed" || s.status==="Not Applicable");
  const hasStatement = c.caseDiary.some(p=>p.statement && p.statement.trim().length>0) || (c.complaint.description||"").trim().length>0;
  const hasWitness = c.sop.steps.some(s=>/witness/i.test(s.activity) && s.status==="Completed");
  const hasScene = c.sop.steps.some(s=>/scene/i.test(s.activity) && (s.status==="Completed"||s.status==="Not Applicable"));
  const evidenceDone = c.evidence.length>0 && c.evidence.every(e=> e.status==="Collected" || e.required==="Not Required");
  const cctvItem = c.evidence.find(e=>/cctv/i.test(e.item));
  const cctvDone = !cctvItem || cctvItem.status==="Collected" || cctvItem.required==="Not Required";
  const forensicItem = c.evidence.find(e=>/forensic|fsl/i.test(e.item));
  const forensicDone = !forensicItem || forensicItem.status==="Collected" || forensicItem.required==="Not Required";
  const recoveryItem = c.evidence.find(e=>/recovery/i.test(e.item));
  const recoveryDone = !recoveryItem || recoveryItem.status==="Collected" || recoveryItem.required==="Not Required";
  const map = {
    complaint: !!c.complaint.registered,
    category: !!c.complaint.crimeCategory,
    subcategory: !!c.complaint.crimeSubCategory,
    bns: c.bns.sections.length>0 && c.bns.confirmed,
    fir: !!c.fir.registered,
    firCopy: !!c.firCopyGenerated,
    firCctns: !!c.firCctnsCopied,
    gd: !!c.gd.generated,
    gdCctns: !!c.gdCctnsCopied,
    io: !!c.io.assigned,
    sopLoaded: !!c.sop.subcategoryLoaded,
    statement: hasStatement,
    witness: hasWitness,
    sceneExamined: hasScene,
    evidenceChecklist: evidenceDone,
    esakshya: c.esakshya.length>0,
    cctv: cctvDone,
    forensic: forensicDone,
    recovery: recoveryDone,
    allSteps: allStepsDone,
    caseDiary: c.caseDiary.length>0 && c.caseDiary.every(p=>p.approved)
  };
  return map;
}
function statusOf(done, mandatory){
  if(done) return "green";
  return mandatory ? "red" : "yellow";
}
const MANDATORY_KEYS = ["complaint","category","subcategory","bns","fir","io","sopLoaded","caseDiary"];

/* ---------------- RENDER SHELL ---------------- */

function render(){
  const app = document.getElementById("app");
  if(!LOGGED_IN_OFFICER){
    app.innerHTML = renderLoginScreen();
    applyTranslations(app);
    afterLoginRender();
    return;
  }
  app.innerHTML = `
    <div class="app-shell">
      ${renderSidebar()}
      <div class="main">
        ${renderTopbar()}
        <main class="content" id="main-content">${renderMain()}</main>
      </div>
    </div>
  `;
  wireGlobalEvents();
  applyTranslations(app);
  // The step bar scrolls sideways on narrower screens; keep the open step in view
  const nav = app.querySelector('.reg-nav'), act = nav && nav.querySelector('.reg-tab.is-active');
  if(nav && act){
    const left = act.offsetLeft - nav.offsetLeft, right = left + act.offsetWidth;
    if(right > nav.scrollLeft + nav.clientWidth) nav.scrollLeft = right - nav.clientWidth + 16;
    else if(left < nav.scrollLeft) nav.scrollLeft = Math.max(0, left - 16);
  }
}
/* Forms never depend on the browser submitting them. Previews and locked-down browsers often
   sandbox the page with form submission switched off, which silently blocks every submit button.
   Buttons run the form's own handler directly (after the browser's field checks), and Enter in a
   field does the same. This also stops Enter from reloading the page on forms with no handler. */
function submitFormFrom(btn){
  const form = btn.closest('form');
  if(!form || btn.disabled) return;
  if(!form.noValidate && !form.reportValidity()) return;
  if(typeof form.onsubmit === 'function'){
    form.onsubmit.call(form, { preventDefault(){}, stopPropagation(){}, target: form, currentTarget: form });
  }
}
document.addEventListener('keydown', (ev)=>{
  if(ev.key!=='Enter' || ev.defaultPrevented || ev.isComposing) return;
  const el = ev.target;
  if(!(el instanceof HTMLInputElement) || ['button','submit','reset','checkbox','radio','file'].includes(el.type) || !el.form) return;
  ev.preventDefault();
  const btn = el.form.querySelector('[data-submit]');
  if(btn && !btn.disabled) btn.click();
});

/* In-app confirmation. The browser's confirm() is switched off in sandboxed previews, where it
   returns "cancel" without showing anything, so Log out and Delete case did nothing there. */
function confirmDialog({title, body, confirmLabel, danger}){
  return new Promise((resolve)=>{
    const returnFocus = document.activeElement;
    const scrim = document.createElement('div');
    scrim.className = 'scrim';
    scrim.innerHTML = `<div class="modal" role="alertdialog" aria-modal="true" aria-labelledby="dlg-title"${body?' aria-describedby="dlg-body"':''}>
      <h2 class="modal-title" id="dlg-title">${esc(t(title))}</h2>
      ${body ? `<p class="modal-body" id="dlg-body">${esc(t(body))}</p>` : ''}
      <div class="modal-actions">
        <button type="button" class="axial-btn axial-btn--outline axial-btn--md" data-act="cancel">${t('Cancel')}</button>
        <button type="button" class="axial-btn ${danger?'axial-btn--danger':'axial-btn--primary'} axial-btn--md" data-act="ok">${esc(t(confirmLabel))}</button>
      </div>
    </div>`;
    const buttons = ()=>Array.from(scrim.querySelectorAll('button'));
    const close = (ok)=>{
      document.removeEventListener('keydown', onKey, true);
      scrim.remove();
      if(returnFocus && document.contains(returnFocus)) returnFocus.focus();
      resolve(ok);
    };
    const onKey = (e)=>{
      if(e.key==='Escape'){ e.preventDefault(); close(false); }
      else if(e.key==='Tab'){
        const b = buttons(), i = b.indexOf(document.activeElement);
        e.preventDefault(); b[(i + (e.shiftKey ? b.length-1 : 1)) % b.length].focus();
      }
    };
    scrim.addEventListener('click', (e)=>{
      if(e.target===scrim) return close(false);
      const act = e.target.closest('[data-act]');
      if(act) close(act.dataset.act==='ok');
    });
    document.addEventListener('keydown', onKey, true);
    document.body.appendChild(scrim);
    // A destructive action starts on Cancel, so a stray Enter can't delete anything
    scrim.querySelector(danger ? '[data-act="cancel"]' : '[data-act="ok"]').focus();
  });
}

/* Previews also block downloads and the print dialog. When the page is embedded, say so. */
const IN_EMBED = (()=>{ try{ return window.self !== window.top; }catch(e){ return true; } })();
function embedHint(kind){
  if(!IN_EMBED) return;
  setTimeout(()=>toast(kind==='print'
    ? "If the print dialog didn't open, open the file directly in Chrome or Edge. Previews can block printing."
    : "If nothing downloaded, open the file directly in Chrome or Edge. Previews can block downloads."), 500);
}

/* Cards that open something are role="button"; Enter and Space activate them like a real button. */

/* ================= REGISTRATION STAGE =================
   Derived from case data only, nothing here writes to the case. Used by the register,
   sidebar, case header, registration nav and the "continue" actions. */
const REG_STEPS = [
  { id:'complaint',    label:'Complaint',        done:c=>!!c.complaint.registered },
  { id:'bns',          label:'BNS Sections',     done:c=>!!c.bns.confirmed },
  { id:'fir',          label:'FIR',              done:c=>!!c.fir.registered && !!String(c.fir.number||'').trim() },
  { id:'io',           label:'IO Assignment',    done:c=>!!c.io.assigned },
  { id:'gd',           label:'GD',               done:c=>!!c.gd.generated && !!String(c.gd.number||'').trim() },
  { id:'firStatement', label:'Writer Statement', done:c=>!!c.firStatement.generated },
];
function isRegistrationComplete(c){ return REG_STEPS.every(s=>s.done(c)); }
function nextAction(c){
  if(!c.bns.confirmed) return { tab:'bns', label:'Confirm BNS sections' };
  if(!c.fir.registered) return { tab:'fir', label:'Prepare FIR for CCTNS' };
  if(!String(c.fir.number||'').trim()) return { tab:'fir', label: c.firCctnsCopied ? 'Enter FIR number from CCTNS' : 'Copy FIR into CCTNS' };
  if(!c.io.assigned) return { tab:'io', label:'Assign investigating officer' };
  if(!c.gd.generated) return { tab:'gd', label:'Prepare GD entry' };
  if(!String(c.gd.number||'').trim()) return { tab:'gd', label: c.gdCctnsCopied ? 'Enter GD number from CCTNS' : 'Copy GD into CCTNS' };
  if(!c.firStatement.generated) return { tab:'firStatement', label:'Confirm writer statement' };
  return null;
}
function caseStage(c){
  const n = nextAction(c);
  if(!n) return { label:'Registration complete', tone:'success', icon:'check_circle' };
  const byTab = {
    bns:          ['Complaint registered', 'neutral', ''],
    fir:          [c.fir.registered ? 'CCTNS pending' : 'FIR pending', 'accent', 'clock'],
    io:           ['IO assignment pending', 'accent', 'clock'],
    gd:           [c.gd.generated ? 'GD number pending' : 'GD pending', 'accent', 'clock'],
    firStatement: ['Statement pending', 'accent', 'clock'],
  };
  const [label, tone, icon] = byTab[n.tab];
  return { label, tone, icon };
}
function stagePill(c){ const s = caseStage(c); return `<span class="pill pill--${s.tone}">${s.icon?ic(s.icon):''}${t(s.label)}</span>`; }
function sectionsShort(c){
  const secs = c.bns.sections.map(s=>s.code);
  const bns = secs.filter(x=>!/^it act/i.test(x)), it = secs.filter(x=>/^it act/i.test(x)).map(x=>x.replace(/^it act\s*/i,''));
  return [bns.length ? `BNS ${bns.join(', ')}` : '', it.length ? `IT Act ${it.join(', ')}` : ''].filter(Boolean).join(' · ');
}

function caseMatchesFilter(c, f){ return f==='complete' ? isRegistrationComplete(c) : f==='open' ? !isRegistrationComplete(c) : true; }
function caseMatchesQuery(c, q){
  if(!q) return true;

  return [c.fir.number, p.complaintNumber, c.gd.number, p.complainantName, p.crimeSubCategory, p.crimeCategory, p.policeStation, p.district, c.io.name, c.bns.sections.map(s=>s.code).join(' ')]

async function extractComplaintDetails(formId, textareaId){
  const form = document.getElementById(formId);
  const textarea = document.getElementById(textareaId);
  const text = textarea ? textarea.value.trim() : "";
  if(!text){ toast("Write or speak the complaint narration first."); return; }
  const btn = document.getElementById(textareaId+'-extract-btn');
  const originalLabel = btn ? btn.innerHTML : "";
  if(btn){ btn.disabled = true; btn.innerHTML = `${ic('hourglass_top')}<span>Reading complaint…</span>`; }
  let fields = null;
  try{
    fields = await tryAiExtractComplaint(text);
  }catch(e){
    fields = null; // network to the AI is not always reachable, fall through to the local engine below
  }
  if(!fields){
    fields = localExtractComplaintFields(text);
  }
  fields.narration = text;
  applyExtractedFieldsToForm(form, fields);
  const status = document.getElementById(textareaId+'-status');
  if(status){ status.innerHTML = `${ic('check_circle')}<span>${t('Details filled from complaint. Review before continuing.')}</span>`; }
  form.querySelectorAll('.field-error').forEach(f=>f.classList.remove('field-error'));
  if(btn){ btn.disabled = false; btn.innerHTML = originalLabel; }
}
async function tryAiExtractComplaint(text){
  const instructions = `Extract structured fields from an Indian police complaint narration. Respond with ONLY strict JSON, no markdown fences, no commentary, matching exactly this schema (use empty string "" for anything not mentioned in the text; never invent facts that are not stated):
{"complainantName":"","guardianName":"","age":"","gender":"","mobile":"","address":"","nationality":"","occupation":"","idType":"","idNumber":"","policeStation":"","district":"","placeOfIncident":"","dateOfIncident":"","timeOfIncident":"","description":"","crimeCategory":"","crimeSubCategory":""}
"gender" must be one of "Male","Female","Other" or "".
"idType" must be exactly one of ${ID_TYPES.map(x=>`"${x}"`).join(",")} or "" if no ID is mentioned; "idNumber" is the number as stated.
Classification. Pick "crimeSubCategory" first, then set "crimeCategory" to the group that sub-category belongs to, never a different group:
${Object.entries(CRIME_TAXONOMY).map(([cat,subs])=>`- "${cat}": ${subs.map(x=>`"${x}"`).join(", ")}`).join("\n")}
Use "" for both if the narration does not make it clear.
Under the Bharatiya Nyaya Sanhita: "Snatching" (BNS 304) is property suddenly seized or grabbed from a person, with no hurt, restraint or threat. It is a property crime. "Robbery" (BNS 309) is theft or snatching where the offender causes or attempts hurt, wrongful restraint, or fear of instant hurt or death. "Theft" (BNS 303) is property taken without the owner's knowledge or without force, e.g. pickpocketing or a vehicle taken while parked.
"dateOfIncident" must be YYYY-MM-DD if a specific date is mentioned or clearly inferable, else "".
"timeOfIncident" must be 24-hour HH:MM if mentioned, else "".
"description" should be a clean, professional restatement of the incident in a couple of sentences, using only facts present in the narration.

Complaint narration:
"""
${text}
"""`;
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "claude-sonnet-4-6",
      max_tokens: 1000,
      messages: [{ role: "user", content: instructions }]
    })
  });
  if(!res.ok) throw new Error("AI extraction request failed");
  const data = await res.json();
  const raw = (data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join("").trim();
  const cleaned = raw.replace(/^```(json)?/i,'').replace(/```$/,'').trim();
  return JSON.parse(cleaned);
}
function applyExtractedFieldsToForm(form, fields){
  if(!form || !fields) return;
  const simple = ['complainantName','guardianName','age','gender','mobile','address','nationality','occupation','idType','idNumber','policeStation','district','placeOfIncident','dateOfIncident','timeOfIncident','description'];
  simple.forEach(key=>{
    if(fields[key]){
      const el = form.elements[key];
      if(el) el.value = fields[key];
    }
  });
  const cls = reconcileClassification(fields);
  const catEl = form.querySelector('#cc-category');
  if(catEl && cls.category){
    catEl.value = cls.category;
    updateSubcategoryOptions(catEl);
    const subEl = form.querySelector('#cc-subcategory');
    if(subEl) subEl.value = cls.subCategory || "";
  }
}
/* The sub-category decides the category: a sub-category belongs to exactly one group, so a reply
   like "Violent Crime" + "Robbery" (robbery is listed under property crime) is corrected rather than
   leaving the sub-category blank. If the reply has no usable sub-category, the local keyword
   classifier is used instead, and a category is never shown with an empty sub-category unless
   neither source could tell. */
function parentCategoryOf(sub){
  for(const [cat, subs] of Object.entries(CRIME_TAXONOMY)){ if(subs.includes(sub)) return cat; }
  return "";
}
function reconcileClassification(fields){
  const sub = fields.crimeSubCategory || "";
  const parent = parentCategoryOf(sub);
  if(parent) return { category: parent, subCategory: sub };
  const local = classifyCrimeFromText(fields.narration || fields.description || "");
  if(local) return { category: local.category, subCategory: local.subCategory };
  return { category: CRIME_TAXONOMY[fields.crimeCategory] ? fields.crimeCategory : "", subCategory: "" };
}

function updateSubcategoryOptions(sel){
  const cat = sel.value;
  const sub = document.getElementById("cc-subcategory");
  sub.innerHTML = `<option value="">${t('Select sub-category')}</option>` + (CRIME_TAXONOMY[cat]||[]).map(s=>`<option value="${s}">${s}</option>`).join("");
}

function formToObj(form){
  const fd = new FormData(form);
  const obj = {};
  for(const [k,v] of fd.entries()) obj[k]=v;
  return obj;
}

function submitComplaint(ev){
  ev.preventDefault();
  const obj = normaliseComplaint(formToObj(ev.target));
  if(!obj.crimeCategory || !obj.crimeSubCategory){ toast("Select crime category and sub-category."); return false; }
  const c = newCase();
  Object.assign(c.complaint, obj, {registered:true});
  if(!c.complaint.complaintNumber){
    // Next number for this year; counting cases would repeat a number after a case is deleted
    const yr = new Date().getFullYear(), prefix = "CR/"+yr+"/";
    const used = DB.order.map(id=>DB.cases[id] && DB.cases[id].complaint.complaintNumber).filter(n=>n && n.startsWith(prefix)).map(n=>parseInt(n.slice(prefix.length),10)).filter(n=>!isNaN(n));
    c.complaint.complaintNumber = prefix + String((used.length ? Math.max(...used) : 0) + 1).padStart(3,'0');
  }
  saveDB();
  openCase(c.id);
  setTab("bns");
  toast("Complaint registered.");
  return false;
}

function saveComplaintEdits(ev, caseId){
  ev.preventDefault();
  const c = getCase(caseId);
  const obj = normaliseComplaint(formToObj(ev.target));
  if(ev.target.elements.idNumber && ev.target.elements.idNumber.disabled) obj.idNumber = '';
  const typeChanged = (obj.crimeSubCategory||'') !== (c.complaint.crimeSubCategory||'') || (obj.crimeCategory||'') !== (c.complaint.crimeCategory||'');
  Object.assign(c.complaint, obj);
  if(typeChanged && c.bns.sections.length){
    c.bns.confirmed = false;
    saveDB();
    toast("Crime type changed. Review the BNS sections for it and confirm again.");
    setTab("bns");
    return false;
  }
  saveDB();
  toast("Complaint saved.");
  setTab(c.fir.registered ? "fir" : "bns");
  return false;
}

/* ================= CASE DIARY (court format) =================
   The first parchas of the case diary, laid out the way the case diary submitted to court reads:
   a header block, then "1. General Information" and "2. Major Task Performed", with the English
   and Hindi label under each other.

   Only what the system actually recorded is written in. Anything the system cannot know (the
   distance of the place of occurrence from the police station, times the investigating officer
   spent in the field, places visited during investigation) is left as a blank for the officer to
   fill. Nothing about the investigation itself is invented here. */
const CD_BLANK = '__________';
function cdIsUnknownAccused(c){ return /unknown|unidentified|अज्ञात/i.test(c.complaint.description||''); }
function cdCaseNo(c){
  const num = String(c.fir.number||'').trim();
  const year = (c.fir.date||nowDate()).slice(0,4);
  const digits = num ? num.split('/')[0] : CD_BLANK;
  return { num, year, digits };
}
function cdPerson(c){
  const p = c.complaint;
  const guardian = p.guardianName ? `${({'S/O':'son of','D/O':'daughter of','W/O':'wife of'})[relFor(c)]} Shri ${p.guardianName}` : '';
  return [`Complainant ${p.gender==='Female'?'Smt.':'Shri'} ${p.complainantName||CD_BLANK}`, guardian, p.address ? `resident of ${p.address}` : ''].filter(Boolean).join(' ');
}
function cdActs(c){
  const secs = c.bns.sections.map(s=>s.code);
  const bns = secs.filter(x=>!/^it act/i.test(x)), it = secs.filter(x=>/^it act/i.test(x)).map(x=>x.replace(/^it act\s*/i,''));
  return [bns.length ? `section${bns.length>1?'s':''} ${bns.join(', ')} BNS` : '', it.length ? `section${it.length>1?'s':''} ${it.join(', ')} IT Act` : ''].filter(Boolean).join(', ');
}
function cdBrief(c){
  const p = c.complaint, k = cdCaseNo(c);
  const secs = c.bns.sections.map(s=>s.code);
  const bns = secs.filter(x=>!/^it act/i.test(x)), it = secs.filter(x=>/^it act/i.test(x)).map(x=>x.replace(/^it act\s*/i,''));
  const acts = [bns.length ? `section${bns.length>1?'s':''} ${bns.join(', ')} BNS` : '', it.length ? `section${it.length>1?'s':''} ${it.join(', ')} IT Act` : ''].filter(Boolean).join(', ');
  return [
    `Case crime no. ${k.digits} of ${k.year}, ${acts || CD_BLANK}.`,
    `Date of occurrence ${p.dateOfIncident ? docDate(p.dateOfIncident) : CD_BLANK} at about ${p.timeOfIncident || CD_BLANK} hrs, information received ${p.complaintDate ? docDate(p.complaintDate) : CD_BLANK} at ${p.complaintTime || CD_BLANK} hrs.`,
    `Place of occurrence ${p.placeOfIncident || CD_BLANK}, about ${CD_BLANK} from the police station.`,
    `${cdPerson(c)}.`,
    cdIsUnknownAccused(c) ? 'Versus unknown persons, as stated in the complaint.' : `Versus ${CD_BLANK}.`,
  ].join(' ');
}
/* Each parcha: what it covers, and the tasks inside it. */
function caseDiaryParchas(c){
  const p = c.complaint, k = cdCaseNo(c), f = c.firStatement.fields;
  const station = psName(p.policeStation) || CD_BLANK;
  const secs = cdActs(c) || CD_BLANK;
  const ioName = [c.io.rank, c.io.name].filter(Boolean).join(' ') || CD_BLANK;
  const writer = [f.recordedByRank, f.recordedBy].filter(Boolean).join(' ') || CD_BLANK;

  const one = {
    title: 'Registration of the case',
    date: c.fir.date,
    startTime: p.complaintTime, endTime: c.gd.time || c.fir.time,
    places: `Police Station ${station}`,
    tasks: [
      { task:'Receive the complaint', desc:
        `A ${f.complaintType==='Oral Information' ? 'oral information' : 'written complaint'} was received at Police Station ${station} on ${p.complaintDate ? docDate(p.complaintDate) : CD_BLANK} at ${p.complaintTime || CD_BLANK} hrs from ${p.complainantName || CD_BLANK}. The complaint states: ${p.description || CD_BLANK}` },
      { task:'Register the FIR', desc:
        `The information disclosed a cognizable offence. FIR no. ${k.num || CD_BLANK} was registered at Police Station ${station}, District ${p.district || CD_BLANK}, on ${c.fir.date ? docDate(c.fir.date) : CD_BLANK} at ${c.fir.time || CD_BLANK} hrs under ${secs} against ${cdIsUnknownAccused(c) ? 'unknown persons' : CD_BLANK}. The case was classified as ${p.crimeSubCategory || CD_BLANK}.` },
      c.gd.generated ? { task:'Make the general diary entry', desc:
        `General diary entry no. ${c.gd.number || CD_BLANK} was made at Police Station ${station} on ${c.gd.date ? docDate(c.gd.date) : CD_BLANK} at ${c.gd.time || CD_BLANK} hrs regarding the registration of the case${c.gd.seniorOfficer ? `, under the supervision of ${c.gd.seniorOfficer}` : ''}.` } : null,
      c.firStatement.generated ? { task:'Record the statement of the FIR writing officer', desc:
        `The statement of the FIR writing officer ${writer} was recorded at ${f.statementLocation || `Police Station ${station}`} on ${f.statementDate ? docDate(f.statementDate) : CD_BLANK} at ${f.statementTime || CD_BLANK} hrs${f.onOrdersOf ? `, the FIR having been registered on the orders of ${f.onOrdersOf}` : ''}.` } : null,
    ].filter(Boolean),
  };

  const two = c.io.assigned ? {
    title: 'Investigation entrusted',
    date: c.io.date || c.fir.date,
    startTime: c.io.time, endTime: '',
    places: `Police Station ${station}`,
    tasks: [
      { task:'Entrust the investigation', desc:
        `The investigation of the case was entrusted to ${ioName}${c.io.serviceNumber ? `, service no. ${c.io.serviceNumber}` : ''}, ${c.io.station ? `posted at Police Station ${psName(c.io.station)}` : `Police Station ${station}`}, on ${c.io.date ? docDate(c.io.date) : CD_BLANK} at ${c.io.time || CD_BLANK} hrs${c.gd.seniorOfficer ? ` on the orders of ${c.gd.seniorOfficer}` : ''}.` },
      { task:'Hand over the case papers', desc:
        `Copies of the FIR${c.gd.number ? `, the general diary entry no. ${c.gd.number}` : ''}${c.firStatement.generated ? ' and the statement of the FIR writing officer' : ''} were handed over to ${ioName} for investigation.` },
      { task:'Take up the investigation', desc:
        `${ioName} took up the investigation of the case on ${c.io.date ? docDate(c.io.date) : CD_BLANK} at ${CD_BLANK} hrs. Further proceedings are recorded in the case diaries that follow.` },
    ],
  } : null;

  /* A blank pro-forma. The system has no record of any investigation step, so nothing is filled in. */
  const three = {
    title: 'First steps of the investigation',
    blank: true,
    date: '', startTime: '', endTime: '', places: '',
    tasks: [
      { task:'Visit the place of occurrence and prepare the site plan', desc:'' },
      { task:'Record the statement of the complainant under section 180 BNSS', desc:'' },
      { task:'Trace and collect the available evidence', desc:'' },
    ],
  };
  return [one, two, three].filter(Boolean).map((x, i)=> Object.assign(x, {
    serial: String(i+1).padStart(2,'0'),
    diaryNo: `CD/${k.year}/${k.digits}/${String(i+1).padStart(2,'0')}`,
  }));
}
const CD_LABELS = {

    return `<div class="page-head"><div><h1 class="page-title">${t('Case diary')}</h1></div></div>
      ${banner('warning', `<span>${t('The case diary starts once the FIR is prepared.')}</span><div class="banner-links"><button type="button" class="axial-btn axial-btn--outline axial-btn--sm" onclick="setTab('fir')">${t('Go to FIR')}</button></div>`)}`;
  }
  const missing = [];
  if(!c.io.assigned) missing.push(t('Investigating officer'));
  if(!c.gd.generated) missing.push(t('GD entry'));
  if(!c.firStatement.generated) missing.push(t('Writer statement'));
  return `
  <div class="page-head">
    <div>
      <h1 class="page-title">${t('Case diary')}</h1>
      <p class="page-sub">${t('The opening parchas in the format submitted to court, written from what this case has recorded.')}</p>
    </div>
    <div class="page-head-actions">
      <button type="button" class="axial-btn axial-btn--outline axial-btn--md" onclick="copyCaseDiary('${c.id}')">${ic('content_copy')}<span>${t('Copy')}</span></button>
      <button type="button" class="axial-btn axial-btn--outline axial-btn--md" onclick="downloadText('CaseDiary_' + (getCase('${c.id}').fir.number||'draft').replace(/\\//g,'_') + '.txt', caseDiaryText(getCase('${c.id}')))">${ic('download')}<span>${t('Download')}</span></button>
      <button type="button" class="axial-btn axial-btn--outline axial-btn--md" onclick="printDocPage()">${ic('print')}<span>${t('Print')}</span></button>
    </div>
  </div>
  <div class="cd-wrap">
    ${banner('info', `<span>${t('Blanks marked')} ${CD_BLANK} ${t('are for the officer to fill: the distance of the place of occurrence from the police station, field timings, places visited, and anything the investigating officer records.')}</span>`)}
    ${missing.length ? banner('warning', `<span>${t('Not recorded yet, so it is left out of the diary:')} ${missing.join(', ')}.</span>`) : ''}
    ${caseDiaryHtml(c)}
  </div>`;
}

function renderCaseWorkspace(c){
  let body = "";
  switch(UI.tab){
    case "overview": body = renderOverview(c); break;
    case "complaint": body = renderComplaintTab(c); break;
    case "bns": body = renderBnsTab(c); break;
    case "fir": body = renderFirTab(c); break;
    case "io": body = renderIoTab(c); break;
    case "gd": body = renderGdTab(c); break;
    case "firStatement": body = renderFirStatementTab(c); break;
    case "diary": body = renderCaseDiaryTab(c); break;
    default: body = renderOverview(c);
  }
  return `${regNavHtml(c)}${body}`;
}
function continueRegistration(caseId){
  const c = getCase(caseId); const n = nextAction(c);
  setTab(n ? n.tab : 'overview');
}
function stepDetail(c, id){
  const p = c.complaint;
  switch(id){
    case 'complaint': return p.complaintDate ? `${t('Registered')} ${shortDateTime(p.complaintDate, p.complaintTime)}` : '';
    case 'bns': return c.bns.confirmed ? sectionsShort(c) : (c.bns.sections.length ? `${c.bns.sections.length} ${t('suggested, not yet confirmed')}` : t('Not yet identified'));
    case 'fir': return c.fir.number ? `FIR ${esc(c.fir.number)} ${t('recorded from CCTNS')}` : c.fir.registered ? t('Prepared, CCTNS number pending') : t('Not yet prepared');
    case 'io': return c.io.assigned ? `${esc([c.io.rank, c.io.name].filter(Boolean).join(' '))}` : t('Not yet assigned');
    case 'gd': return c.gd.number ? `GD ${esc(c.gd.number)} ${t('recorded')}` : c.gd.generated ? t('Prepared, CCTNS number pending') : t('Not yet prepared');
    case 'firStatement': return c.firStatement.generated ? t('Recorded and locked') : t('Not yet confirmed');
  }
  return '';
}
