<html lang="en">

<title>Case Management System</title>
<style>
/* ============ AXIAL DESIGN SYSTEM, tokens ============
   Values from the Axial skill's token tables (the published axial-tokens.css lags them on
   background/selected, text/disabled, text/placeholder and icon/disabled; the tables are newer).
   Primitives are declared only so semantics can alias them. Nothing outside this block
   references a primitive or a literal. ⬥ brand-variant: interactive/primary(-hover,-active),
   border/emphasis, background/selected, surface/brand-subtle, icon/default. */
:root{
  /* primitives, 85 values */
  --axial-color-primary-50:#F4F5F7; --axial-color-primary-100:#E8EAF0; --axial-color-primary-200:#D1D5E0; --axial-color-primary-300:#A3AAC1; --axial-color-primary-400:#767FA2; --axial-color-primary-500:#4A5483; --axial-color-primary-600:#353D5E; --axial-color-primary-700:#2A3149; --axial-color-primary-800:#202337; --axial-color-primary-900:#161825;
  --axial-color-grey-50:#F9FAFB; --axial-color-grey-100:#F3F4F6; --axial-color-grey-200:#E5E7EB; --axial-color-grey-300:#D1D5DB; --axial-color-grey-400:#9CA3AF; --axial-color-grey-500:#6B7280; --axial-color-grey-600:#4B5563; --axial-color-grey-700:#374151; --axial-color-grey-800:#1F2937; --axial-color-grey-900:#111827;
  --axial-color-white-50:#FFFFFF; --axial-color-white-100:#FAFAFA; --axial-color-white-200:#F5F5F5;
  --axial-color-ice-50:#FCFCFD; --axial-color-ice-100:#F6F8FA; --axial-color-ice-200:#EEF2F5; --axial-color-ice-300:#E6EBEF; --axial-color-ice-400:#D8E0E7; --axial-color-ice-500:#C4CED8; --axial-color-ice-600:#9DAAB7; --axial-color-ice-700:#6F7F8F; --axial-color-ice-800:#4A5967; --axial-color-ice-900:#2E3845;
  --axial-color-sand-50:#FBFBFA; --axial-color-sand-100:#F5F5F2;
  --axial-color-blue-50:#EFF6FF; --axial-color-blue-100:#DBEAFE; --axial-color-blue-200:#BFDBFE; --axial-color-blue-300:#93C5FD; --axial-color-blue-400:#60A5FA; --axial-color-blue-500:#3B82F6; --axial-color-blue-600:#2563EB; --axial-color-blue-700:#1D4ED8; --axial-color-blue-800:#1E40AF; --axial-color-blue-900:#1E3A8A;
  --axial-color-green-50:#F0FDF4; --axial-color-green-100:#DCFCE7; --axial-color-green-200:#BBF7D0; --axial-color-green-300:#86EFAC; --axial-color-green-400:#4ADE80; --axial-color-green-500:#22C55E; --axial-color-green-600:#16A34A; --axial-color-green-700:#15803D; --axial-color-green-800:#166534; --axial-color-green-900:#14532D;
  --axial-color-red-50:#FEF2F2; --axial-color-red-100:#FEE2E2; --axial-color-red-200:#FECACA; --axial-color-red-300:#FCA5A5; --axial-color-red-400:#F87171; --axial-color-red-500:#EF4444; --axial-color-red-600:#DC2626; --axial-color-red-700:#B91C1C; --axial-color-red-800:#991B1B; --axial-color-red-900:#7F1D1D;
  --axial-color-yellow-50:#FFFBEB; --axial-color-yellow-100:#FEF3C7; --axial-color-yellow-200:#FDE68A; --axial-color-yellow-300:#FCD34D; --axial-color-yellow-400:#FBBF24; --axial-color-yellow-500:#F59E0B; --axial-color-yellow-600:#D97706; --axial-color-yellow-700:#B45309; --axial-color-yellow-800:#92400E; --axial-color-yellow-900:#78350F;
  --axial-color-orange-50:#FFF7ED; --axial-color-orange-100:#FFEDD5; --axial-color-orange-200:#FED7AA; --axial-color-orange-300:#FDBA74; --axial-color-orange-400:#FB923C; --axial-color-orange-500:#F97316; --axial-color-orange-600:#EA580C; --axial-color-orange-700:#C2410C; --axial-color-orange-800:#9A3412; --axial-color-orange-900:#7C2D12;

  /* background */
  --axial-background-primary: var(--axial-color-white-50);
  --axial-background-secondary: var(--axial-color-ice-50);
  --axial-background-surface: var(--axial-color-white-100);
  --axial-background-subtle: var(--axial-color-ice-100);
  --axial-background-hover: var(--axial-color-ice-200);
  --axial-background-selected: var(--axial-color-primary-100);
  --axial-background-disabled: var(--axial-color-grey-100);

  /* text */
  --axial-text-primary: var(--axial-color-primary-800);
  --axial-text-secondary: var(--axial-color-grey-600);
  --axial-text-tertiary: var(--axial-color-grey-500);
  --axial-text-disabled: var(--axial-color-grey-500);
  --axial-text-placeholder: var(--axial-color-grey-400);
  --axial-text-on-primary: var(--axial-color-white-50);
  --axial-text-accent: var(--axial-color-blue-600);

  /* border */
  --axial-border-subtle: var(--axial-color-grey-200);
  --axial-border-default: var(--axial-color-grey-300);
  --axial-border-medium: var(--axial-color-grey-400);
  --axial-border-strong: var(--axial-color-grey-500);
  --axial-border-emphasis: var(--axial-color-primary-800);
  --axial-border-disabled: var(--axial-color-grey-200);
  --axial-border-inverse: var(--axial-color-white-50);

  /* interactive */
  --axial-interactive-primary: var(--axial-color-primary-800);
  --axial-interactive-primary-hover: var(--axial-color-primary-700);
  --axial-interactive-primary-active: var(--axial-color-primary-900);
  --axial-interactive-accent: var(--axial-color-blue-500);
  --axial-interactive-accent-hover: var(--axial-color-blue-600);
  --axial-interactive-accent-active: var(--axial-color-blue-700);
  --axial-interactive-accent-subtle: var(--axial-color-blue-50);

  /* feedback */
  --axial-feedback-success: var(--axial-color-green-600);
  --axial-feedback-success-bg: var(--axial-color-green-50);
  --axial-feedback-error: var(--axial-color-red-600);
  --axial-feedback-error-bg: var(--axial-color-red-50);
  --axial-feedback-warning: var(--axial-color-yellow-600);
  --axial-feedback-warning-bg: var(--axial-color-yellow-50);
  --axial-feedback-info: var(--axial-color-blue-600);
  --axial-feedback-info-bg: var(--axial-color-blue-50);

  /* surface */
  --axial-surface-brand-subtle: var(--axial-color-primary-50);
  --axial-surface-neutral-subtle: var(--axial-color-grey-100);
  --axial-surface-neutral-muted: var(--axial-color-grey-200);
  --axial-surface-accent-muted: var(--axial-color-blue-100);

  /* icon */
  --axial-icon-default: var(--axial-color-primary-300);
  --axial-icon-disabled: var(--axial-color-grey-300);
  --axial-icon-rating: var(--axial-color-yellow-400);

  /* category */
  --axial-category-neutral: var(--axial-color-grey-100);
  --axial-category-neutral-strong: var(--axial-color-grey-600);
  --axial-category-blue: var(--axial-color-blue-50);
  --axial-category-blue-strong: var(--axial-color-blue-600);
  --axial-category-green: var(--axial-color-green-50);
  --axial-category-green-strong: var(--axial-color-green-600);
  --axial-category-yellow: var(--axial-color-yellow-50);
  --axial-category-yellow-strong: var(--axial-color-yellow-600);
  --axial-category-orange: var(--axial-color-orange-50);
  --axial-category-orange-strong: var(--axial-color-orange-600);

  /* component: field */
  --axial-field-background-default: var(--axial-color-sand-50);
  --axial-field-background-readonly: var(--axial-color-sand-100);
  --axial-field-background-active: var(--axial-background-primary);
  --axial-field-border-default-readonly: var(--axial-border-default);
  --axial-field-border-active: var(--axial-interactive-accent);
  --axial-field-border-error: var(--axial-feedback-error);

  /* spacing, 2 is a half-step for control internals only */
  --axial-space-2:2px; --axial-space-4:4px; --axial-space-8:8px; --axial-space-12:12px; --axial-space-16:16px; --axial-space-20:20px;
  --axial-space-24:24px; --axial-space-32:32px; --axial-space-40:40px; --axial-space-48:48px; --axial-space-64:64px; --axial-space-80:80px;
  --axial-space-96:96px; --axial-space-128:128px;

  /* radius */
  --axial-radius-none:0px; --axial-radius-xs:2px; --axial-radius-sm:4px; --axial-radius-md:8px; --axial-radius-lg:12px;
  --axial-radius-xl:16px; --axial-radius-2xl:24px; --axial-radius-full:48px;

  /* stroke */
  --axial-stroke-none:0px; --axial-stroke-hairline:0.5px; --axial-stroke-thin:1px; --axial-stroke-regular:2px; --axial-stroke-medium:3px; --axial-stroke-thick:4px;

  /* elevation */
  --axial-elevation-0: none;
  --axial-elevation-1: 0px 1px 2px 0px rgba(17, 24, 39, 0.04), 0px 1px 4px 0px rgba(17, 24, 39, 0.06);
  --axial-elevation-2: 0px 2px 4px 0px rgba(17, 24, 39, 0.06), 0px 4px 12px -2px rgba(17, 24, 39, 0.08);
  --axial-elevation-3: 0px 4px 8px 0px rgba(17, 24, 39, 0.08), 0px 8px 24px -4px rgba(17, 24, 39, 0.12);
  --axial-elevation-4: 0px 8px 16px 0px rgba(17, 24, 39, 0.10), 0px 16px 40px -8px rgba(17, 24, 39, 0.16);

  /* typography, DM Sans only, tracking always 0. Devanagari has no DM Sans glyphs and falls back to the OS font. */
  --axial-font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans Devanagari', 'Nirmala UI', sans-serif;
  --axial-font-size-10:10px; --axial-font-size-11:11px; --axial-font-size-12:12px; --axial-font-size-14:14px; --axial-font-size-16:16px;
  --axial-font-size-18:18px; --axial-font-size-20:20px; --axial-font-size-24:24px; --axial-font-size-30:30px; --axial-font-size-36:36px;
  --axial-font-weight-light:300; --axial-font-weight-regular:400; --axial-font-weight-medium:500; --axial-font-weight-semibold:600; --axial-font-weight-bold:700;
  --axial-line-height-none:1; --axial-line-height-tight:1.2; --axial-line-height-normal:1.4; --axial-line-height-relaxed:1.6;

  /* grid */
  --axial-grid-columns:12; --axial-grid-column-width:110px; --axial-grid-gutter:20px; --axial-grid-margin:120px;
}

/* Text styles, the 16 composed Axial styles */
.axial-heading-h1    { font-family: var(--axial-font-family); font-size: var(--axial-font-size-36); font-weight: var(--axial-font-weight-bold); line-height: var(--axial-line-height-tight); }
.axial-heading-h2    { font-family: var(--axial-font-family); font-size: var(--axial-font-size-30); font-weight: var(--axial-font-weight-semibold); line-height: var(--axial-line-height-tight); }
.axial-heading-h3    { font-family: var(--axial-font-family); font-size: var(--axial-font-size-24); font-weight: var(--axial-font-weight-semibold); line-height: var(--axial-line-height-normal); }
.axial-heading-h4    { font-family: var(--axial-font-family); font-size: var(--axial-font-size-20); font-weight: var(--axial-font-weight-semibold); line-height: var(--axial-line-height-normal); }
.axial-heading-h5    { font-family: var(--axial-font-family); font-size: var(--axial-font-size-18); font-weight: var(--axial-font-weight-medium); line-height: var(--axial-line-height-normal); }
.axial-heading-h6    { font-family: var(--axial-font-family); font-size: var(--axial-font-size-16); font-weight: var(--axial-font-weight-medium); line-height: var(--axial-line-height-normal); }
.axial-body-large    { font-family: var(--axial-font-family); font-size: var(--axial-font-size-18); font-weight: var(--axial-font-weight-regular); line-height: var(--axial-line-height-relaxed); }
.axial-body-default  { font-family: var(--axial-font-family); font-size: var(--axial-font-size-16); font-weight: var(--axial-font-weight-regular); line-height: var(--axial-line-height-relaxed); }
.axial-body-small    { font-family: var(--axial-font-family); font-size: var(--axial-font-size-14); font-weight: var(--axial-font-weight-regular); line-height: var(--axial-line-height-relaxed); }
.axial-body-xs       { font-family: var(--axial-font-family); font-size: var(--axial-font-size-12); font-weight: var(--axial-font-weight-regular); line-height: var(--axial-line-height-none); }
.axial-label-large   { font-family: var(--axial-font-family); font-size: var(--axial-font-size-16); font-weight: var(--axial-font-weight-medium); line-height: var(--axial-line-height-none); }
.axial-label-default { font-family: var(--axial-font-family); font-size: var(--axial-font-size-14); font-weight: var(--axial-font-weight-medium); line-height: var(--axial-line-height-normal); }
.axial-label-small   { font-family: var(--axial-font-family); font-size: var(--axial-font-size-12); font-weight: var(--axial-font-weight-medium); line-height: var(--axial-line-height-normal); }
.axial-label-xs      { font-family: var(--axial-font-family); font-size: var(--axial-font-size-11); font-weight: var(--axial-font-weight-regular); line-height: var(--axial-line-height-none); }
.axial-label-2xs     { font-family: var(--axial-font-family); font-size: var(--axial-font-size-10); font-weight: var(--axial-font-weight-medium); line-height: var(--axial-line-height-none); }
.axial-caption       { font-family: var(--axial-font-family); font-size: var(--axial-font-size-12); font-weight: var(--axial-font-weight-regular); line-height: var(--axial-line-height-normal); }

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--axial-font-family); color:var(--axial-text-primary);
  background:var(--axial-background-secondary); -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4,h5,h6,p{margin:0;}
button{font-family:var(--axial-font-family);}
@media (prefers-reduced-motion: reduce){ *{animation:none !important; transition:none !important;} }

/* Focus: 2px border/emphasis outside the box, on every interactive element. Fields use their own ladder. */
button:focus-visible, [role="button"]:focus-visible, a:focus-visible{
  outline:var(--axial-stroke-regular) solid var(--axial-border-emphasis); outline-offset:var(--axial-space-2);
}


/* Layout */
.app-shell{display:flex; min-height:100vh;}
.sidebar{
  width:256px; flex-shrink:0; background:var(--axial-background-primary);
  border-right:var(--axial-stroke-thin) solid var(--axial-border-subtle);
  display:flex; flex-direction:column; position:sticky; top:0; height:100vh;
}
.sidebar-brand{padding:var(--axial-space-24) var(--axial-space-24) var(--axial-space-16);
  display:flex; align-items:center; gap:var(--axial-space-12); border-bottom:var(--axial-stroke-thin) solid var(--axial-border-subtle);}
.brand-mark{width:36px;height:36px;border-radius:var(--axial-radius-full);background:var(--axial-interactive-primary);
  display:flex;align-items:center;justify-content:center;color:var(--axial-text-on-primary);font-weight:var(--axial-font-weight-semibold);font-size:var(--axial-font-size-16);flex-shrink:0;}
.brand-name{font-size:var(--axial-font-size-16);font-weight:var(--axial-font-weight-medium);line-height:var(--axial-line-height-normal);color:var(--axial-text-primary);}
.brand-sub{font-size:var(--axial-font-size-11);font-weight:var(--axial-font-weight-regular);line-height:var(--axial-line-height-none);color:var(--axial-text-tertiary);}
.sidebar-body{padding:var(--axial-space-16); overflow-y:auto; flex:1;}
.officer-strip{display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:var(--axial-space-4) var(--axial-space-8);
  padding:var(--axial-space-8) var(--axial-space-12); margin-bottom:var(--axial-space-16);
  background:var(--axial-surface-brand-subtle); border-radius:var(--axial-radius-md);}
.officer-strip-name{display:flex; align-items:center; gap:var(--axial-space-8); flex-shrink:0;
  font-size:var(--axial-font-size-12); font-weight:var(--axial-font-weight-medium); line-height:var(--axial-line-height-normal); color:var(--axial-text-primary); white-space:nowrap;}
.officer-strip-name .ms{color:var(--axial-icon-default);}
.officer-strip .axial-btn{margin-left:auto;}
.sidebar-section-label{font-size:var(--axial-font-size-12);font-weight:var(--axial-font-weight-medium);line-height:var(--axial-line-height-normal);color:var(--axial-text-tertiary);
  padding:var(--axial-space-8) var(--axial-space-8) var(--axial-space-4); margin-top:var(--axial-space-12);}
.case-list{display:flex;flex-direction:column;gap:var(--axial-space-4);}
.case-item{display:flex;flex-direction:column;align-items:flex-start;gap:var(--axial-space-4);width:100%;text-align:left;
  padding:var(--axial-space-8) var(--axial-space-12); background:transparent;
  border-radius:var(--axial-radius-md);cursor:pointer;border:var(--axial-stroke-thin) solid transparent;}
.case-item:hover{background:var(--axial-background-hover);}
.case-item:active{background:var(--axial-background-selected);}
.case-item.active{background:var(--axial-background-selected); border-color:var(--axial-border-emphasis);}
.case-item .ci-title{font-size:var(--axial-font-size-14);font-weight:var(--axial-font-weight-medium);line-height:var(--axial-line-height-normal);color:var(--axial-text-primary);}
.case-item--nav{margin-top:var(--axial-space-16);}
.case-item--nav .ci-title{display:flex; align-items:center; gap:var(--axial-space-8);}
.case-item--nav .ms{color:var(--axial-icon-default);}
.case-item .ci-sub{font-size:var(--axial-font-size-12);font-weight:var(--axial-font-weight-regular);line-height:var(--axial-line-height-normal);color:var(--axial-text-tertiary);}
.main{flex:1; min-width:0; display:flex; flex-direction:column;}
.topbar{
  height:64px; flex-shrink:0; display:flex; align-items:center; justify-content:space-between;
  padding:0 var(--axial-space-32); background:var(--axial-background-primary);
  border-bottom:var(--axial-stroke-thin) solid var(--axial-border-subtle); position:sticky; top:0; z-index:5;
}
.topbar-right{display:flex; align-items:center; gap:var(--axial-space-16);}
.content{padding:var(--axial-space-32); max-width:1200px; margin:0 auto; width:100%;}
@media (max-width:900px){ .sidebar{width:220px;} .content{padding:var(--axial-space-16);} .topbar{padding:0 var(--axial-space-16);} }

/* Type, Axial composed styles, kept on the class names the templates already use */
.h1{font-size:var(--axial-font-size-30);font-weight:var(--axial-font-weight-semibold);line-height:var(--axial-line-height-tight);color:var(--axial-text-primary);}   /* Heading/H2 */
.h2{font-size:var(--axial-font-size-24);font-weight:var(--axial-font-weight-semibold);line-height:var(--axial-line-height-normal);color:var(--axial-text-primary);}   /* Heading/H3 */
.h3{font-size:var(--axial-font-size-20);font-weight:var(--axial-font-weight-semibold);line-height:var(--axial-line-height-normal);color:var(--axial-text-primary);}   /* Heading/H4 */
.h4{font-size:var(--axial-font-size-16);font-weight:var(--axial-font-weight-medium);line-height:var(--axial-line-height-normal);color:var(--axial-text-primary);}   /* Heading/H6 */
.body-def{font-size:var(--axial-font-size-14);font-weight:var(--axial-font-weight-regular);line-height:var(--axial-line-height-relaxed);color:var(--axial-text-secondary);}  /* Body/Small */
.label-def{font-size:var(--axial-font-size-14);font-weight:var(--axial-font-weight-medium);line-height:var(--axial-line-height-normal);color:var(--axial-text-primary);}   /* Label/Default */
.caption{font-size:var(--axial-font-size-12);font-weight:var(--axial-font-weight-regular);line-height:var(--axial-line-height-normal);color:var(--axial-text-tertiary);}   /* Caption */

/* Buttons */
.axial-btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--axial-space-8);
  font-family:var(--axial-font-family);font-weight:var(--axial-font-weight-medium);line-height:var(--axial-line-height-none);border-radius:var(--axial-radius-md);border:var(--axial-stroke-thin) solid transparent;
  cursor:pointer;transition:background-color .15s ease,border-color .15s ease; white-space:nowrap;}
.axial-btn--sm{height:33px;padding:var(--axial-space-8) var(--axial-space-12);gap:var(--axial-space-4);font-size:var(--axial-font-size-12);}
.axial-btn--sm .ms{font-size:var(--axial-font-size-16);}
.axial-btn--md{height:36px;padding:var(--axial-space-8) var(--axial-space-16);font-size:var(--axial-font-size-14);}
.axial-btn--lg{height:45px;padding:var(--axial-space-12) var(--axial-space-20);font-size:var(--axial-font-size-16);}
.axial-btn--primary{background:var(--axial-interactive-primary);color:var(--axial-text-on-primary);}
.axial-btn--primary:hover{background:var(--axial-interactive-primary-hover);}
.axial-btn--primary:active{background:var(--axial-interactive-primary-active);}
.axial-btn--outline{background:var(--axial-background-primary);border-color:var(--axial-border-default);color:var(--axial-text-primary);}
.axial-btn--outline:hover{background:var(--axial-background-hover);border-color:var(--axial-border-medium);}
.axial-btn--outline:active{background:var(--axial-background-selected);border-color:var(--axial-border-strong);}
.axial-btn--ghost{background:transparent;color:var(--axial-text-primary);}
.axial-btn--ghost:hover{background:var(--axial-background-hover);}
.axial-btn--ghost:active{background:var(--axial-background-selected);}
.axial-btn--danger{background:var(--axial-background-primary);border-color:var(--axial-feedback-error);color:var(--axial-feedback-error);}
.axial-btn--danger:hover{background:var(--axial-feedback-error-bg);}
.axial-btn--danger:active{background:var(--axial-feedback-error-bg);border-color:var(--axial-feedback-error);}
.axial-btn--full{width:100%;}
.axial-btn:disabled, .axial-btn[aria-disabled="true"]{
  background:var(--axial-background-disabled);border-color:var(--axial-border-disabled);color:var(--axial-text-disabled);cursor:not-allowed;}
.axial-btn--ghost:disabled{background:transparent;border-color:transparent;}

/* Button rows. Buttons keep their own width; nothing stretches them. */
.actions{display:flex; align-items:center; justify-content:flex-end; gap:var(--axial-space-12); flex-wrap:wrap; margin-top:var(--axial-space-24);}
.actions--start{justify-content:flex-start;}
.actions--between{justify-content:space-between;}
.actions--flush{margin-top:0;}

/* Cards */
.card{background:var(--axial-background-primary); border:var(--axial-stroke-thin) solid var(--axial-border-subtle);
  border-radius:var(--axial-radius-lg); box-shadow:var(--axial-elevation-1);}
.card-pad{padding:var(--axial-space-24);}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--axial-space-16); gap:var(--axial-space-12); flex-wrap:wrap;}
.case-card{display:block; cursor:pointer;}
.case-card:hover{border-color:var(--axial-border-default);}
.case-card:active{background:var(--axial-background-subtle);}
.stack{display:flex;flex-direction:column;gap:var(--axial-space-24);}
.stack-16{display:flex;flex-direction:column;gap:var(--axial-space-16);}
.row{display:flex;gap:var(--axial-space-16); flex-wrap:wrap;}
.row > .field, .row > .kv{flex:1 1 220px;}

/* Fields, Axial field ladder, web geometry (52px, pad 12/16, radius md, 1px) */
.field{display:flex;flex-direction:column;gap:var(--axial-space-8);}
.field label{font-size:var(--axial-font-size-14);font-weight:var(--axial-font-weight-medium);line-height:var(--axial-line-height-normal);color:var(--axial-text-primary);}
.field .hint{font-size:var(--axial-font-size-12);line-height:var(--axial-line-height-normal);color:var(--axial-text-tertiary);}
.axial-input, .axial-select, .axial-textarea{
  height:52px; border-radius:var(--axial-radius-md);
  border:var(--axial-stroke-thin) solid var(--axial-field-border-default-readonly);
  padding:var(--axial-space-12) var(--axial-space-16); font-family:var(--axial-font-family); font-size:var(--axial-font-size-14); line-height:var(--axial-line-height-normal); color:var(--axial-text-primary);
  background:var(--axial-field-background-default); width:100%;
}
.axial-textarea{height:auto;min-height:96px; resize:vertical; line-height:var(--axial-line-height-relaxed);}
.axial-input:focus, .axial-select:focus, .axial-textarea:focus{
  outline:none; background:var(--axial-field-background-active); border-color:var(--axial-field-border-active);}
.axial-input::placeholder, .axial-textarea::placeholder{color:var(--axial-text-placeholder);}
.axial-input[readonly], .axial-textarea[readonly]{background:var(--axial-field-background-readonly);}
.axial-input:disabled,.axial-select:disabled,.axial-textarea:disabled{
  background:var(--axial-background-disabled); border-color:var(--axial-border-disabled); color:var(--axial-text-disabled); cursor:not-allowed;}
.field-error .axial-input, .field-error .axial-select, .field-error .axial-textarea{border-color:var(--axial-field-border-error);}
.field-adorned{position:relative;}
.field-adorned .axial-input, .field-adorned .axial-textarea{padding-right:var(--axial-space-48);}

/* Pills, Pill S (25px, pad 4/12, radius full). Status colour rides on the icon; the label stays text/primary. */
.pill{display:inline-flex;align-items:center;gap:var(--axial-space-4);height:25px;padding:var(--axial-space-4) var(--axial-space-12);
  border-radius:var(--axial-radius-full);font-size:var(--axial-font-size-12);font-weight:var(--axial-font-weight-medium);line-height:var(--axial-line-height-none);white-space:nowrap;color:var(--axial-text-primary);}
.pill .ms{font-size:var(--axial-font-size-16);}
.pill--neutral{background:var(--axial-surface-neutral-subtle); color:var(--axial-text-secondary);}
.pill--accent{background:var(--axial-interactive-accent-subtle); color:var(--axial-text-accent);}
.pill--success{background:var(--axial-feedback-success-bg);} .pill--success .ms{color:var(--axial-feedback-success);}
.pill--warning{background:var(--axial-feedback-warning-bg);} .pill--warning .ms{color:var(--axial-feedback-warning);}
.pill--error{background:var(--axial-feedback-error-bg);}     .pill--error .ms{color:var(--axial-feedback-error);}
.pill--primary{background:var(--axial-interactive-primary); color:var(--axial-text-on-primary);}
.dot{width:8px;height:8px;border-radius:var(--axial-radius-full);display:inline-block;flex-shrink:0;}
.dot--green{background:var(--axial-feedback-success);} .dot--yellow{background:var(--axial-feedback-warning);}
.dot--red{background:var(--axial-feedback-error);} .dot--grey{background:var(--axial-border-medium);}

/* Tabs */
.tabs{display:flex;gap:var(--axial-space-4); overflow-x:auto; border-bottom:var(--axial-stroke-thin) solid var(--axial-border-subtle); margin-bottom:var(--axial-space-24);}
.tab{padding:var(--axial-space-12) var(--axial-space-16); font-size:var(--axial-font-size-14);font-weight:var(--axial-font-weight-medium);line-height:var(--axial-line-height-normal);color:var(--axial-text-tertiary);
  background:transparent; border:none; border-bottom:var(--axial-stroke-regular) solid transparent; cursor:pointer; white-space:nowrap; flex-shrink:0;}
.tab:hover{color:var(--axial-text-primary); background:var(--axial-background-hover);}
.tab:active{background:var(--axial-background-selected);}
.tab.active{color:var(--axial-text-primary); border-bottom-color:var(--axial-border-emphasis);}
.tab:focus-visible{outline-offset:calc(-1 * var(--axial-stroke-regular));}

/* Lists */
.list-row{display:flex; align-items:center; gap:var(--axial-space-12); padding:var(--axial-space-12) 0; border-bottom:var(--axial-stroke-thin) solid var(--axial-border-subtle);}
.list-row:last-child{border-bottom:none;}
.check-item{display:flex; align-items:flex-start; justify-content:space-between; gap:var(--axial-space-16);
  padding:var(--axial-space-12) var(--axial-space-16); border:var(--axial-stroke-thin) solid var(--axial-border-subtle);
  border-radius:var(--axial-radius-md); margin-bottom:var(--axial-space-8); background:var(--axial-background-primary);}
.progress-list{display:flex; flex-direction:column; gap:var(--axial-space-12);}
.progress-item{display:flex; align-items:center; gap:var(--axial-space-12); font-size:var(--axial-font-size-14); line-height:var(--axial-line-height-relaxed); color:var(--axial-text-tertiary);}
.progress-item .ms{color:var(--axial-icon-default);}
.progress-item.done{color:var(--axial-text-primary);}
.progress-item.done .ms{color:var(--axial-feedback-success);}

/* Diary para (investigation phase) */
.diary-para{border-left:var(--axial-stroke-medium) solid var(--axial-border-emphasis); padding:var(--axial-space-4) 0 var(--axial-space-4) var(--axial-space-16); margin-bottom:var(--axial-space-24);}

/* Empty state */
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:var(--axial-space-16);padding:var(--axial-space-48) var(--axial-space-24);}
.empty-icon{width:64px;height:64px;border-radius:var(--axial-radius-full);background:var(--axial-surface-neutral-subtle);display:flex;align-items:center;justify-content:center;color:var(--axial-icon-default);}
.empty-icon .ms{font-size:var(--axial-font-size-36);}

/* Snackbar, one at a time */
#toast-wrap{position:fixed; bottom:var(--axial-space-24); right:var(--axial-space-24); z-index:100; display:flex; flex-direction:column; gap:var(--axial-space-8); max-width:480px;}
.toast{background:var(--axial-interactive-primary); color:var(--axial-text-on-primary); min-height:36px; padding:var(--axial-space-8) var(--axial-space-12);
  border-radius:var(--axial-radius-sm); font-size:var(--axial-font-size-14); line-height:var(--axial-line-height-normal); box-shadow:var(--axial-elevation-3); animation:toastin .2s ease-out; transition:opacity .2s;}
@keyframes toastin{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}

/* Banners, tint + feedback icon + text/primary */
.status-banner{display:flex; align-items:flex-start; gap:var(--axial-space-12); padding:var(--axial-space-12) var(--axial-space-16);
  border-radius:var(--axial-radius-md); font-size:var(--axial-font-size-14); line-height:var(--axial-line-height-relaxed); color:var(--axial-text-primary);}
.status-banner > .ms{margin-top:var(--axial-space-2);}
.status-banner--success{background:var(--axial-feedback-success-bg);} .status-banner--success > .ms{color:var(--axial-feedback-success);}
.status-banner--warning{background:var(--axial-feedback-warning-bg);} .status-banner--warning > .ms{color:var(--axial-feedback-warning);}
.status-banner--error{background:var(--axial-feedback-error-bg);}     .status-banner--error > .ms{color:var(--axial-feedback-error);}
.status-banner--info{background:var(--axial-feedback-info-bg);}       .status-banner--info > .ms{color:var(--axial-feedback-info);}
.status-banner-body{flex:1; min-width:0; display:flex; flex-direction:column; gap:var(--axial-space-8);}
.banner-links{display:flex; flex-wrap:wrap; gap:var(--axial-space-8);}

/* misc */
.divider{height:1px;background:var(--axial-border-subtle); border:none; margin:var(--axial-space-24) 0;}
.two-col{display:grid; grid-template-columns:1fr 1fr; gap:var(--axial-space-16) var(--axial-space-32);}
@media (max-width:640px){.two-col{grid-template-columns:1fr;}}
.kv{display:flex;flex-direction:column;gap:var(--axial-space-4);}
.kv .k{font-size:var(--axial-font-size-12);line-height:var(--axial-line-height-normal);color:var(--axial-text-tertiary);}
.kv .v{font-size:var(--axial-font-size-14);line-height:var(--axial-line-height-normal);color:var(--axial-text-primary);font-weight:var(--axial-font-weight-medium);}
.narration-block{border:var(--axial-stroke-thin) solid var(--axial-border-subtle); border-radius:var(--axial-radius-lg); padding:var(--axial-space-16);}
.section-gap{margin-top:var(--axial-space-16);}
textarea.mono, pre.mono{font-family:var(--axial-font-family); font-size:var(--axial-font-size-14); white-space:pre-wrap; line-height:var(--axial-line-height-relaxed);}
.icon-btn{width:36px;height:36px;border-radius:var(--axial-radius-md);border:var(--axial-stroke-thin) solid var(--axial-border-default);
  background:var(--axial-background-primary);display:flex;align-items:center;justify-content:center;cursor:pointer; color:var(--axial-icon-default); flex-shrink:0; padding:0;}
.icon-btn:hover{background:var(--axial-background-hover);}
.icon-btn:active{background:var(--axial-background-selected);}
.mic-btn{position:absolute; right:var(--axial-space-8); width:32px; height:32px; border-radius:var(--axial-radius-full); border-color:transparent; background:transparent;}
.mic-btn--bottom{bottom:var(--axial-space-8);}
.mic-btn--middle{top:50%; transform:translateY(-50%);}
.mic-btn.mic-active{background:var(--axial-feedback-error); color:var(--axial-text-on-primary);}
.step-card-row{display:flex; align-items:center; gap:var(--axial-space-12);}

/* ---- FIR ---- */
.fir-form-section{display:flex; flex-direction:column; gap:var(--axial-space-16); padding:var(--axial-space-24) 0; border-top:var(--axial-stroke-thin) solid var(--axial-border-subtle);}
.fir-form-section:first-child{padding-top:0; border-top:none;}
.sections-chips{display:flex; flex-wrap:wrap; gap:var(--axial-space-8); font-size:var(--axial-font-size-14); line-height:var(--axial-line-height-relaxed);}

.cctns-steps{list-style:none; margin:var(--axial-space-8) 0 0; padding:0; display:flex; flex-direction:column;}
.cctns-step{position:relative; display:grid; grid-template-columns:28px minmax(0,1fr); column-gap:var(--axial-space-12); padding-bottom:var(--axial-space-24);}
.cctns-step:last-child{padding-bottom:0;}
.cctns-step:not(:last-child)::after{content:""; position:absolute; left:var(--axial-space-12); top:32px; margin-left:var(--axial-space-2); bottom:var(--axial-space-4); width:var(--axial-stroke-thin); transform:translateX(-50%); background:var(--axial-border-subtle);}
.cctns-mark{width:28px; height:28px; border-radius:var(--axial-radius-full); display:flex; align-items:center; justify-content:center;
  font-size:var(--axial-font-size-12); font-weight:var(--axial-font-weight-semibold); line-height:var(--axial-line-height-none); background:var(--axial-surface-neutral-subtle); color:var(--axial-text-secondary);}
.cctns-mark .ms{font-size:var(--axial-font-size-16);}
.cctns-step.is-active .cctns-mark{background:var(--axial-interactive-primary); color:var(--axial-text-on-primary);}
.cctns-step.is-done .cctns-mark{background:var(--axial-feedback-success-bg); color:var(--axial-feedback-success);}
.cctns-step-body{display:flex; flex-direction:column; align-items:flex-start; gap:var(--axial-space-8); padding-top:var(--axial-space-4); min-width:0;}
.cctns-step-body .axial-input{max-width:320px;}

.fir-summary{display:flex; flex-direction:column; gap:var(--axial-space-20);}
.fir-summary-group + .fir-summary-group{padding-top:var(--axial-space-20); border-top:var(--axial-stroke-thin) solid var(--axial-border-subtle);}
.fir-summary-title{font-size:var(--axial-font-size-12); font-weight:var(--axial-font-weight-medium); line-height:var(--axial-line-height-normal); color:var(--axial-text-tertiary); margin-bottom:var(--axial-space-8);}
.fir-summary-dl{margin:0; display:grid; grid-template-columns:minmax(0,176px) minmax(0,1fr); gap:var(--axial-space-8) var(--axial-space-16); font-size:var(--axial-font-size-14); line-height:var(--axial-line-height-normal);}
.fir-summary-dl dt{color:var(--axial-text-secondary);}
.fir-summary-dl dd{margin:0; color:var(--axial-text-primary); font-weight:var(--axial-font-weight-medium); overflow-wrap:anywhere;}
.fir-soft{color:var(--axial-text-tertiary); font-weight:var(--axial-font-weight-regular);}
.fir-missing{display:inline-flex; align-items:center; gap:var(--axial-space-4); padding:0 var(--axial-space-8); border-radius:var(--axial-radius-sm);
  background:var(--axial-feedback-warning-bg); color:var(--axial-text-primary); font-weight:var(--axial-font-weight-medium); white-space:nowrap;}
.fir-missing .ms{font-size:var(--axial-font-size-14); color:var(--axial-feedback-warning);}

/* The FIR preview: the page is the document, laid out as the FIR format reads */
.fir-doc{font-size:var(--axial-font-size-14); line-height:var(--axial-line-height-relaxed); color:var(--axial-text-primary);}
.fir-doc-title{text-align:center; font-size:var(--axial-font-size-16); font-weight:var(--axial-font-weight-bold); line-height:var(--axial-line-height-normal);}
.fir-doc-sub{text-align:center; font-size:var(--axial-font-size-12); line-height:var(--axial-line-height-normal); color:var(--axial-text-secondary); margin:var(--axial-space-4) 0 var(--axial-space-24);}
.fir-sec{display:grid; grid-template-columns:24px minmax(0,1fr); column-gap:var(--axial-space-8); padding:var(--axial-space-12) 0; border-top:var(--axial-stroke-thin) solid var(--axial-border-subtle);}
.fir-no{font-weight:var(--axial-font-weight-semibold);}
.fir-heading{font-weight:var(--axial-font-weight-semibold); margin-bottom:var(--axial-space-4);}
.fir-rows{margin:0; display:grid; grid-template-columns:minmax(0,200px) minmax(0,1fr); gap:var(--axial-space-4) var(--axial-space-16);}
.fir-rows dt{color:var(--axial-text-secondary);}
.fir-rows dd{margin:0; overflow-wrap:anywhere;}
.fir-rows .fir-wide{grid-column:1 / -1;}
.fir-text{margin:0; white-space:pre-wrap; overflow-wrap:anywhere;}
@media (max-width:1180px){ .fir-rows, .fir-summary-dl{grid-template-columns:minmax(0,1fr);} .fir-rows dt, .fir-summary-dl dt{margin-top:var(--axial-space-4);} }

/* ---- BNS: add more sections ---- */
.search-field{position:relative;}
.search-field > .ms{position:absolute; left:var(--axial-space-16); top:50%; transform:translateY(-50%); color:var(--axial-icon-default); pointer-events:none;}
.search-field .axial-input{padding-left:var(--axial-space-48); padding-right:var(--axial-space-48);}
.search-clear{position:absolute; right:var(--axial-space-8); top:50%; transform:translateY(-50%); width:32px; height:32px; border-color:transparent; background:transparent;}
.search-clear[hidden]{display:none;}
.bns-results{margin-top:var(--axial-space-12);}
.bns-results:empty{margin-top:0;}
.bns-results .check-item:last-of-type{margin-bottom:0;}
.bns-results-note{margin-top:var(--axial-space-12); font-size:var(--axial-font-size-12); line-height:var(--axial-line-height-normal); color:var(--axial-text-tertiary);}
.bns-manual{margin-top:var(--axial-space-24); padding-top:var(--axial-space-20); border-top:var(--axial-stroke-thin) solid var(--axial-border-subtle);}
.bns-manual-prompt{display:flex; align-items:center; gap:var(--axial-space-8); flex-wrap:wrap;}
.bns-manual-form{display:flex; flex-direction:column; gap:var(--axial-space-16);}
.bns-manual-grid{display:grid; grid-template-columns:minmax(0,220px) minmax(0,1fr); gap:var(--axial-space-16);}
@media (max-width:640px){ .bns-manual-grid{grid-template-columns:1fr;} }
.bns-manual-msg:empty{display:none;}
.bns-manual-msg{margin-top:calc(-1 * var(--axial-space-8));}
.bns-manual-msg .caption, .bns-manual-msg .field-message{display:flex; align-items:center; gap:var(--axial-space-4);}
.bns-manual-msg .caption .ms{font-size:var(--axial-font-size-16); color:var(--axial-feedback-info);}

/* ---- Document screens (FIR, GD, Statement) ---- */
.stmt-grid{display:grid; grid-template-columns:1fr 1fr; gap:var(--axial-space-32); align-items:start;}
@media (max-width:900px){ .stmt-grid{grid-template-columns:1fr;} }
.doc-head{display:flex; align-items:center; justify-content:space-between; gap:var(--axial-space-12); flex-wrap:wrap; margin-bottom:var(--axial-space-12); min-height:36px;}
.doc-toolbar{display:flex; gap:var(--axial-space-8); flex-wrap:wrap;}
.doc-page-wrap{position:sticky; top:calc(var(--axial-space-64) + var(--axial-space-24));}  /* clears the 64px top bar */
@media (max-width:900px){ .doc-page-wrap{position:static;} }
.doc-page-wrap--full{position:static;}
.doc-page-wrap--full .doc-page{max-height:none;}
/* The page itself is simulated paper, the document's own content, not app chrome. It stays white in every theme. */
.doc-page{
  background:var(--axial-background-primary); color:var(--axial-text-primary); border:var(--axial-stroke-thin) solid var(--axial-border-subtle);
  border-radius:var(--axial-radius-sm); box-shadow:var(--axial-elevation-2);
  padding:var(--axial-space-40) var(--axial-space-48); font-family:var(--axial-font-family); font-size:var(--axial-font-size-14); line-height:var(--axial-line-height-relaxed);
  max-height:76vh; overflow-y:auto;
}
.doc-title{font-weight:var(--axial-font-weight-semibold); font-size:var(--axial-font-size-16); line-height:var(--axial-line-height-normal); text-align:center; margin-bottom:var(--axial-space-20);}
.doc-kv{margin-bottom:var(--axial-space-16);}
.doc-kv div{margin-bottom:var(--axial-space-4);}
.doc-para{margin:0 0 var(--axial-space-16) 0; text-align:left;}
.doc-sig{margin-top:var(--axial-space-24);}
.doc-sig-label{margin-bottom:var(--axial-space-8);}
.doc-sig div{margin-bottom:var(--axial-space-4);}
.stmt-var{background:var(--axial-interactive-accent-subtle); color:var(--axial-text-accent); border-radius:var(--axial-radius-xs); padding:0 var(--axial-space-4);}
.doc-pre{white-space:pre-wrap; word-break:break-word; font-family:var(--axial-font-family); font-size:var(--axial-font-size-14); margin:0;}
@media print{
  body.printing-statement .sidebar,
  body.printing-statement .topbar,
  body.printing-statement .tabs,
  body.printing-statement #stmt-form-col,
  body.printing-statement .doc-head,
  body.printing-statement .reg-nav{ display:none !important; }
  body.printing-statement .split{ display:block; }
  body.printing-statement .split-doc{ position:static; }
  body.printing-statement .content{ padding:0; max-width:none; }
  body.printing-statement .stmt-grid{ display:block; }
  body.printing-statement .doc-page{ box-shadow:none; border:none; max-height:none; overflow:visible; }

  body.printing-doc .sidebar,
  body.printing-doc .topbar,
  body.printing-doc .tabs,
  body.printing-doc .print-hide,
  body.printing-doc .doc-head,
  body.printing-doc .reg-nav, body.printing-doc .page-head, body.printing-doc .split-main{ display:none !important; }
  body.printing-doc .split{ display:block; }
  body.printing-doc .split-doc{ position:static; }
  body.printing-doc .content{ padding:0; max-width:none; }
  body.printing-doc .stmt-grid{ display:block; }
  body.printing-doc .doc-page{ box-shadow:none; border:none; max-height:none; overflow:visible; }
}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--axial-border-default); border-radius:var(--axial-radius-sm);}

/* Confirmation dialog, Axial modal: radius 2xl, elevation 4.
   Axial has no scrim token; this mixes the brand's darkest step so it follows a client theme. */
.scrim{position:fixed; inset:0; z-index:200; display:flex; align-items:center; justify-content:center; padding:var(--axial-space-24);
  background:color-mix(in srgb, var(--axial-interactive-primary-active) 48%, transparent); animation:scrimIn .15s ease-out;}
.modal{width:100%; max-width:400px; background:var(--axial-background-primary); border-radius:var(--axial-radius-2xl); box-shadow:var(--axial-elevation-4);
  padding:var(--axial-space-32); animation:modalIn .18s ease-out;}
.modal-title{margin:0; font-size:var(--axial-font-size-20); font-weight:var(--axial-font-weight-semibold); line-height:var(--axial-line-height-normal); color:var(--axial-text-primary);}
.modal-body{margin:var(--axial-space-8) 0 0; font-size:var(--axial-font-size-14); line-height:var(--axial-line-height-relaxed); color:var(--axial-text-secondary);}
.modal-actions{display:flex; justify-content:flex-end; gap:var(--axial-space-12); margin-top:var(--axial-space-32);}
@keyframes scrimIn{from{opacity:0;} to{opacity:1;}}
@keyframes modalIn{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;}}

/* ============ Login ============
   Form on the left, anchored top (logo) and bottom (notice) so the white space reads as intended.
   On the right, an inset navy panel shows the product doing what the headline says: a spoken complaint
   and the FIR drafted from it, with the carried-over values marked the way the app marks them.
   Everything follows the brand tokens, so a client theme re-colours the panel with nothing else to change. */
.auth{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); min-height:100vh; background:var(--axial-background-primary);}

/* ---- Form half ---- */
.auth-form-side{display:flex; flex-direction:column; min-width:0; padding:var(--axial-space-32) var(--axial-space-48);}
.auth-head{display:flex; align-items:center; justify-content:space-between; gap:var(--axial-space-16);}
.auth-logo{display:flex; align-items:center; gap:var(--axial-space-12); min-width:0;}
.auth-logo-mark{width:40px; height:40px; flex-shrink:0; border-radius:var(--axial-radius-full); display:flex; align-items:center; justify-content:center;
  background:var(--axial-interactive-primary); color:var(--axial-text-on-primary);}
.auth-logo-name{display:block; font-size:var(--axial-font-size-18); font-weight:var(--axial-font-weight-medium); line-height:var(--axial-line-height-normal); color:var(--axial-text-primary); white-space:nowrap;}
.auth-logo-sub{display:block; font-size:var(--axial-font-size-12); font-weight:var(--axial-font-weight-regular); line-height:var(--axial-line-height-normal); color:var(--axial-text-tertiary);}
.auth-form-center{flex:1; display:flex; align-items:center; justify-content:center; padding:var(--axial-space-40) 0;}
.auth-form{width:100%; max-width:400px;}
.auth-mobile-emblem{display:none;}
.auth-title{font-size:var(--axial-font-size-36); font-weight:var(--axial-font-weight-bold); line-height:var(--axial-line-height-tight); color:var(--axial-text-primary); margin:0;}
.auth-sub{display:flex; flex-wrap:wrap; align-items:center; gap:var(--axial-space-4) var(--axial-space-8); margin:var(--axial-space-12) 0 0;
  font-size:var(--axial-font-size-16); line-height:var(--axial-line-height-relaxed); color:var(--axial-text-secondary);}
.auth-sub strong{font-weight:var(--axial-font-weight-medium); color:var(--axial-text-primary);}
.auth-fields{display:flex; flex-direction:column; gap:var(--axial-space-24); margin-top:var(--axial-space-40);}
.auth-help{margin:var(--axial-space-24) 0 0; text-align:center; font-size:var(--axial-font-size-14); line-height:var(--axial-line-height-relaxed); color:var(--axial-text-tertiary);}
.auth-link{background:transparent; border:none; padding:0; font-family:var(--axial-font-family); font-size:inherit; font-weight:var(--axial-font-weight-medium); line-height:var(--axial-line-height-relaxed);
  color:var(--axial-text-accent); cursor:pointer; border-radius:var(--axial-radius-xs);}
.auth-link:hover{color:var(--axial-interactive-accent-active); text-decoration:underline;}
.auth-link:active{color:var(--axial-interactive-accent-active);}
.auth-link:disabled{color:var(--axial-text-disabled); cursor:not-allowed; text-decoration:none;}
.auth-foot{display:flex; align-items:center; gap:var(--axial-space-8); margin:0; font-size:var(--axial-font-size-12); line-height:var(--axial-line-height-normal); color:var(--axial-text-tertiary);}
.auth-foot .ms{font-size:var(--axial-font-size-16); color:var(--axial-icon-default);}
.field-message{display:flex; align-items:center; gap:var(--axial-space-4); min-height:16px; font-size:var(--axial-font-size-12); line-height:var(--axial-line-height-normal); color:var(--axial-feedback-error);}
.field-message:empty{display:none;}
.field-message .ms{font-size:var(--axial-font-size-16);}

/* Mobile number with the +91 prefix, as in the app */
.phone-field{display:flex; align-items:center; height:52px; border-radius:var(--axial-radius-md);
  border:var(--axial-stroke-thin) solid var(--axial-field-border-default-readonly); background:var(--axial-field-background-default);}
.phone-field:hover{border-color:var(--axial-border-medium);}
.phone-field:focus-within{background:var(--axial-field-background-active); border-color:var(--axial-field-border-active);}
.field-error .phone-field{border-color:var(--axial-field-border-error);}
.phone-prefix{padding:0 var(--axial-space-12) 0 var(--axial-space-16); font-size:var(--axial-font-size-16); line-height:var(--axial-line-height-normal); color:var(--axial-text-secondary);}
.phone-divider{width:var(--axial-stroke-thin); height:24px; background:var(--axial-field-border-default-readonly);}
.phone-input{flex:1; min-width:0; height:100%; border:none; background:transparent; outline:none; padding:0 var(--axial-space-16) 0 var(--axial-space-12);
  font-family:var(--axial-font-family); font-size:var(--axial-font-size-16); line-height:var(--axial-line-height-normal); color:var(--axial-text-primary);}
.phone-input::placeholder{color:var(--axial-text-placeholder);}

/* One-time code */
.otp-fieldset{border:none; margin:0; padding:0; min-width:0; display:flex; flex-direction:column; gap:var(--axial-space-8);}
.otp-fieldset legend{padding:0; margin-bottom:var(--axial-space-8); font-size:var(--axial-font-size-14); font-weight:var(--axial-font-weight-medium); line-height:var(--axial-line-height-normal); color:var(--axial-text-primary);}
.otp{display:grid; grid-template-columns:repeat(6, minmax(0,1fr)); gap:var(--axial-space-8);}
.otp-box{height:56px; width:100%; min-width:0; text-align:center; padding:0; border-radius:var(--axial-radius-md);
  border:var(--axial-stroke-thin) solid var(--axial-field-border-default-readonly); background:var(--axial-field-background-default);
  font-family:var(--axial-font-family); font-size:var(--axial-font-size-20); font-weight:var(--axial-font-weight-semibold); line-height:var(--axial-line-height-normal); color:var(--axial-text-primary);}
.otp-box:hover{border-color:var(--axial-border-medium);}
.otp-box:focus{outline:none; background:var(--axial-field-background-active); border-color:var(--axial-field-border-active);}
.field-error .otp-box{border-color:var(--axial-field-border-error);}
.auth-resend{margin:var(--axial-space-16) 0 0; font-size:var(--axial-font-size-14); line-height:var(--axial-line-height-relaxed); color:var(--axial-text-tertiary); text-align:center;}

/* ---- Showcase panel ---- */
.auth-showcase{position:relative; overflow:hidden; isolation:isolate; margin:var(--axial-space-16) var(--axial-space-16) var(--axial-space-16) 0;
  border-radius:var(--axial-radius-2xl); background:var(--axial-interactive-primary); color:var(--axial-text-on-primary);
  display:flex; flex-direction:column; padding:var(--axial-space-64) var(--axial-space-48) 0;}
.showcase-rings{position:absolute; left:372px; top:392px; width:1600px; height:1600px; transform:translate(-50%,-50%); z-index:-1; pointer-events:none;}
.showcase-rings circle{fill:none; stroke:var(--axial-interactive-primary-hover); stroke-width:1;}
.showcase-copy{max-width:520px;}
.showcase-headline{margin:0; font-size:var(--axial-font-size-36); font-weight:var(--axial-font-weight-bold); line-height:var(--axial-line-height-tight); color:var(--axial-text-on-primary);}
.showcase-lede{margin:var(--axial-space-16) 0 0; max-width:460px; font-size:var(--axial-font-size-16); line-height:var(--axial-line-height-relaxed); color:var(--axial-icon-default);}

.showcase-visual{flex:1; min-height:0; display:flex; align-items:safe center; justify-content:flex-start; padding:var(--axial-space-40) 0;}
/* The composition is drawn once at 568×540 and zoomed to the panel, so overlaps never slip at other sizes */
.sc-stage{position:relative; width:568px; height:540px; flex-shrink:0;}
/* Card left/top values below are coordinates inside this illustration, not layout spacing, so they sit outside the spacing scale. */
.sc-card{position:absolute; background:var(--axial-background-primary); color:var(--axial-text-primary);
  border-radius:var(--axial-radius-xl); box-shadow:var(--axial-elevation-4); padding:var(--axial-space-20);}
.sc-head{display:flex; align-items:center; gap:var(--axial-space-12);}
.sc-tile{width:32px; height:32px; flex-shrink:0; border-radius:var(--axial-radius-md); display:flex; align-items:center; justify-content:center;
  background:var(--axial-surface-brand-subtle); color:var(--axial-text-primary);}
.sc-tile .ms{font-size:var(--axial-font-size-20);}
.sc-title{flex:1; min-width:0; font-size:var(--axial-font-size-14); font-weight:var(--axial-font-weight-semibold); line-height:var(--axial-line-height-normal); white-space:nowrap;}
.sc-var{display:inline-block; padding:0 var(--axial-space-4); border-radius:var(--axial-radius-xs);
  background:var(--axial-interactive-accent-subtle); color:var(--axial-text-accent); font-weight:var(--axial-font-weight-medium); white-space:nowrap;}

.sc-complaint{left:0; top:0; width:352px; z-index:1;}
.sc-narration{margin:var(--axial-space-16) 0 0; font-size:var(--axial-font-size-14); line-height:var(--axial-line-height-relaxed); color:var(--axial-text-secondary);}
.sc-extract{margin-top:var(--axial-space-16); padding-top:var(--axial-space-12); border-top:var(--axial-stroke-thin) solid var(--axial-border-subtle);}
.sc-extract-label{display:flex; align-items:center; gap:var(--axial-space-4); font-size:var(--axial-font-size-12); font-weight:var(--axial-font-weight-medium); line-height:var(--axial-line-height-normal); color:var(--axial-text-tertiary);}
.sc-extract-label .ms{font-size:var(--axial-font-size-16); color:var(--axial-icon-default);}
.sc-chips{display:flex; flex-wrap:wrap; gap:var(--axial-space-8); margin-top:var(--axial-space-8); font-size:var(--axial-font-size-12); line-height:var(--axial-line-height-relaxed);}

.sc-fir{left:176px; top:248px; width:392px; z-index:2;}
.sc-doc{margin:var(--axial-space-16) 0 0; display:grid; grid-template-columns:auto 1fr; gap:var(--axial-space-8) var(--axial-space-16); font-size:var(--axial-font-size-12); line-height:var(--axial-line-height-relaxed);}
.sc-doc dt{color:var(--axial-text-tertiary);}
.sc-doc dd{margin:0; color:var(--axial-text-primary);}
.sc-para{margin:var(--axial-space-16) 0 0; padding-top:var(--axial-space-12); border-top:var(--axial-stroke-thin) solid var(--axial-border-subtle);
  font-size:var(--axial-font-size-12); line-height:var(--axial-line-height-relaxed); color:var(--axial-text-secondary);}

.sc-note{right:24px; top:228px; z-index:3; display:flex; align-items:center; gap:var(--axial-space-8); padding:var(--axial-space-8) var(--axial-space-12);
  border-radius:var(--axial-radius-md); font-size:var(--axial-font-size-12); font-weight:var(--axial-font-weight-medium); line-height:var(--axial-line-height-normal); white-space:nowrap;}
.sc-note .ms{font-size:var(--axial-font-size-16); color:var(--axial-feedback-success);}

/* One entrance, once per visit: the complaint lands, the FIR is drafted from it, the sections are confirmed */
@keyframes scIn{from{opacity:0; transform:translateY(16px);} to{opacity:1; transform:none;}}
@keyframes scMark{from{background:transparent;} to{background:var(--axial-interactive-accent-subtle);}}
.showcase--animate .sc-complaint{animation:scIn .6s cubic-bezier(.2,.7,.2,1) .15s both;}
.showcase--animate .sc-fir{animation:scIn .6s cubic-bezier(.2,.7,.2,1) .55s both;}
.showcase--animate .sc-fir .sc-var{animation:scMark .5s ease-out 1.05s both;}
.showcase--animate .sc-note{animation:scIn .5s cubic-bezier(.2,.7,.2,1) 1.35s both;}

/* ---- Sizes ---- */
@media (max-width:1320px){ .sc-stage{zoom:.9;} }
@media (max-width:1180px){ .sc-stage{zoom:.8;} }
@media (max-width:1060px){ .sc-stage{zoom:.72;} }
@media (max-width:980px){ .sc-stage{zoom:.64;} }
@media (min-width:1680px) and (min-height:1000px){ .sc-stage{zoom:1.15;} .auth-showcase{padding-left:var(--axial-space-64); padding-right:var(--axial-space-64);} .auth-form{max-width:440px;} }
@media (max-height:800px) and (min-width:1321px){ .sc-stage{zoom:.86;} }
@media (max-height:800px) and (max-width:1320px) and (min-width:1181px){ .sc-stage{zoom:.8;} }
@media (max-width:1200px){
  .auth-form-side{padding:var(--axial-space-24) var(--axial-space-32);}
  .auth-showcase{padding:var(--axial-space-48) var(--axial-space-40) 0;}
  .showcase-headline{font-size:var(--axial-font-size-30);}
  .auth-logo-sub{display:none;}
}
@media (max-height:800px){
  .auth-showcase{padding-top:var(--axial-space-48);}
  .showcase-headline{font-size:var(--axial-font-size-30);}
  .showcase-visual{padding:var(--axial-space-24) 0;}
  .auth-form-center{padding:var(--axial-space-24) 0;}
  .auth-fields{margin-top:var(--axial-space-32);}
}
/* Below 900px it becomes the app's screen: emblem, title, field, button */
@media (max-width:900px){
  .auth{grid-template-columns:1fr;}
  .auth-showcase{display:none;}
  .auth-form-side{padding:var(--axial-space-16) var(--axial-space-24) var(--axial-space-32);}
  .auth-head{justify-content:flex-end;}
  .auth-logo, .auth-foot, .auth-sub--hint{display:none;}
  .auth-form-center{align-items:flex-start; padding-top:var(--axial-space-24);}
  .auth-mobile-emblem{display:flex; justify-content:center; margin-bottom:var(--axial-space-32);}
  .auth-title{text-align:center;}
  .auth-sub{justify-content:center; font-size:var(--axial-font-size-14);}
  .auth-fields{margin-top:var(--axial-space-32);}
}
/* Phone emblem, drawn as circles (a 48px radius token cannot round a 160px box) */
.app-emblem{position:relative; width:160px; height:160px; display:flex; align-items:center; justify-content:center; color:var(--axial-text-on-primary);}
.app-emblem svg.disc{position:absolute; inset:0; width:100%; height:100%;}
.app-emblem .disc-outer{fill:var(--axial-surface-neutral-subtle);}
.app-emblem .disc-inner{fill:var(--axial-surface-neutral-muted);}
.app-emblem .disc-core{fill:var(--axial-interactive-primary);}

/* =====================================================================
   SCREEN LAYER, the case register, workspace, forms and documents.
   Built only from Axial semantic and component tokens and the composed text styles.
   Loaded last, so it sets the final look for shared components.
   ===================================================================== */
body{background:var(--axial-background-secondary); text-rendering:optimizeLegibility; -webkit-font-smoothing:antialiased; font-size:var(--axial-font-size-14); font-weight:var(--axial-font-weight-regular); line-height:var(--axial-line-height-relaxed);}
button:focus-visible, [role="button"]:focus-visible, a:focus-visible, [tabindex]:focus-visible{outline:var(--axial-stroke-regular) solid var(--axial-border-emphasis); outline-offset:var(--axial-space-2);}
.sr-only{position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;}

/* Icons, Material Symbols Rounded, 20px on web (16px inside Small controls, which are 33px tall) */
.ms{font-family:'Material Symbols Rounded'; font-weight:normal; font-style:normal; font-size:var(--axial-font-size-20); line-height:var(--axial-line-height-none); letter-spacing:0; text-transform:none;
  white-space:nowrap; direction:ltr; display:inline-block; flex-shrink:0; -webkit-font-smoothing:antialiased; user-select:none;
  font-variation-settings:'FILL' 0;}
.ms--fill{font-variation-settings:'FILL' 1;}

/* Type, legacy class names mapped onto composed Axial styles */
.h1{font-size:var(--axial-font-size-30); font-weight:var(--axial-font-weight-semibold); line-height:var(--axial-line-height-tight); color:var(--axial-text-primary);}        /* Heading/H2 */
.h2{font-size:var(--axial-font-size-24); font-weight:var(--axial-font-weight-semibold); line-height:var(--axial-line-height-normal); color:var(--axial-text-primary);}        /* Heading/H3 */
.h3{font-size:var(--axial-font-size-18); font-weight:var(--axial-font-weight-medium); line-height:var(--axial-line-height-normal); color:var(--axial-text-primary);}        /* Heading/H5 */
.h4{font-size:var(--axial-font-size-16); font-weight:var(--axial-font-weight-medium); line-height:var(--axial-line-height-normal); color:var(--axial-text-primary);}        /* Heading/H6 */
.body-def{font-size:var(--axial-font-size-14); font-weight:var(--axial-font-weight-regular); line-height:var(--axial-line-height-relaxed); color:var(--axial-text-secondary);}   /* Body/Small */
.label-def{font-size:var(--axial-font-size-14); font-weight:var(--axial-font-weight-medium); line-height:var(--axial-line-height-normal); color:var(--axial-text-primary);}   /* Label/Default */
.caption{font-size:var(--axial-font-size-12); font-weight:var(--axial-font-weight-regular); line-height:var(--axial-line-height-normal); color:var(--axial-text-tertiary);}   /* Caption */
.muted{color:var(--axial-text-secondary);}

/* Buttons, Axial geometry: S 33 (8/12, gap 4, 12px) · M 36 (8/16, gap 8, 14px) · L 45 (12/20, gap 8, 16px) · radius md */
.axial-btn{border-radius:var(--axial-radius-md); box-shadow:none; transition:background-color .16s ease, border-color .16s ease, color .16s ease;}
.axial-btn--sm{height:33px; padding:var(--axial-space-8) var(--axial-space-12); gap:var(--axial-space-4); font-size:var(--axial-font-size-12); font-weight:var(--axial-font-weight-medium); line-height:var(--axial-line-height-normal);}
.axial-btn--sm .ms{font-size:var(--axial-font-size-16);}
.axial-btn--md{height:36px; padding:var(--axial-space-8) var(--axial-space-16); gap:var(--axial-space-8); font-size:var(--axial-font-size-14); font-weight:var(--axial-font-weight-medium); line-height:var(--axial-line-height-normal);}
.axial-btn--lg{height:45px; padding:var(--axial-space-12) var(--axial-space-20); gap:var(--axial-space-8); font-size:var(--axial-font-size-16); font-weight:var(--axial-font-weight-medium); line-height:var(--axial-line-height-none);}
.axial-btn--primary{background:var(--axial-interactive-primary); color:var(--axial-text-on-primary);}
.axial-btn--primary:hover{background:var(--axial-interactive-primary-hover);}
.axial-btn--primary:active{background:var(--axial-interactive-primary-active);}
.axial-btn--outline{background:var(--axial-background-primary); border-color:var(--axial-border-default); color:var(--axial-text-primary);}
.axial-btn--outline:hover{background:var(--axial-background-hover); border-color:var(--axial-border-medium);}
.axial-btn--outline:active{background:var(--axial-background-selected); border-color:var(--axial-border-strong);}
/* Type=Text, label colour from the component: text/primary */
.axial-btn--ghost{background:transparent; border-color:transparent; color:var(--axial-text-primary);}
.axial-btn--ghost:hover{background:var(--axial-background-hover);}
.axial-btn--ghost:active{background:var(--axial-background-selected);}
/* Delete actions, red means delete */
.axial-btn--danger{background:var(--axial-background-primary); border-color:var(--axial-feedback-error); color:var(--axial-feedback-error);}
.axial-btn--danger:hover, .axial-btn--danger:active{background:var(--axial-feedback-error-bg);}
.axial-btn--text-danger{background:transparent; border-color:transparent; color:var(--axial-feedback-error);}
.axial-btn--text-danger:hover, .axial-btn--text-danger:active{background:var(--axial-feedback-error-bg);}
.axial-btn:disabled, .axial-btn[aria-disabled="true"]{background:var(--axial-background-disabled); border-color:var(--axial-border-disabled); color:var(--axial-text-disabled); cursor:not-allowed;}
.axial-btn--ghost:disabled, .axial-btn--ghost[aria-disabled="true"]{background:transparent; border-color:transparent;}

/* Filter chips, selected chip is background/selected */
